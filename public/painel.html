<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#075e54">
    <title>Painel WhatsApp Pro</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        :root {
            --primary: #075e54;
            --primary-dark: #054d44;
            --secondary: #128c7e;
            --accent: #25d366;
            --bg: #0a1014;
            --sidebar-bg: #111b21;
            --chat-bg: #0a1014;
            --incoming: #202c33;
            --outgoing: #005c4b;
            --text: #e9edef;
            --text-secondary: #8696a0;
            --border: #2a3942;
            --danger: #f15c6d;
            --warning: #ffd700;
        }
        
        body {
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        
        /* Loading */
        #loading {
            position: fixed;
            inset: 0;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        #loading.fade-out { opacity: 0; pointer-events: none; }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading p { color: white; font-size: 16px; }
        
        /* Debug Panel */
        #debugPanel {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #ff4444;
            color: white;
            padding: 10px;
            font-size: 12px;
            z-index: 10000;
            display: none;
            max-height: 200px;
            overflow-y: auto;
        }
        #debugPanel.show { display: block; }
        
        /* App Container - Mobile First */
        #app {
            display: flex;
            height: 100%;
            width: 100%;
        }
        
        /* Sidebar */
        .sidebar {
            width: 100%;
            height: 100%;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }
        
        .sidebar.hidden-mobile {
            transform: translateX(-100%);
            position: absolute;
        }
        
        @media (min-width: 900px) {
            .sidebar {
                width: 380px;
                border-right: 1px solid var(--border);
                position: relative;
                transform: none !important;
            }
            .sidebar.hidden-mobile {
                transform: none;
                position: relative;
            }
        }
        
        /* Header */
        .header {
            background: var(--sidebar-bg);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }
        .header h1 { 
            font-size: 20px; 
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }
        .icon-btn svg { width: 24px; height: 24px; }
        
        .connection-badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 12px;
            background: var(--accent);
            color: white;
            font-weight: 600;
        }
        .connection-badge.offline { background: var(--danger); }
        .connection-badge.connecting { background: var(--warning); color: #000; }
        
        /* Search */
        .search-container {
            padding: 8px 12px;
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--border);
        }
        .search-box {
            background: #202c33;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 8px 12px;
            gap: 10px;
        }
        .search-box input {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 15px;
            outline: none;
        }
        .search-box input::placeholder { color: var(--text-secondary); }
        
        /* Chat List */
        .chat-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 8px 0;
        }
        
        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .chat-item:hover { background: rgba(255,255,255,0.05); }
        .chat-item.active { background: #2a3942; }
        
        .chat-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667781 0%, #8696a0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 600;
            color: white;
            margin-right: 14px;
            flex-shrink: 0;
            position: relative;
        }
        .chat-avatar.online::after {
            content: '';
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            background: var(--accent);
            border-radius: 50%;
            border: 2px solid var(--sidebar-bg);
        }
        
        .chat-info {
            flex: 1;
            min-width: 0;
        }
        .chat-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .chat-name {
            font-weight: 500;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
        }
        .chat-time {
            font-size: 12px;
            color: var(--accent);
            flex-shrink: 0;
        }
        .chat-item:not(.unread) .chat-time { color: var(--text-secondary); }
        
        .chat-preview {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-preview.typing { color: var(--accent); font-style: italic; }
        
        .unread-badge {
            background: var(--accent);
            color: white;
            font-size: 12px;
            font-weight: 600;
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
            margin-left: 8px;
        }
        
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 8px;
            font-weight: 600;
        }
        .status-indicator.bot { background: rgba(37, 211, 102, 0.15); color: var(--accent); }
        .status-indicator.human { background: rgba(241, 92, 109, 0.15); color: var(--danger); }
        
        /* Chat Area */
        .chat-area {
            flex: 1;
            display: none;
            flex-direction: column;
            background: var(--chat-bg);
            width: 100%;
            height: 100%;
        }
        .chat-area.active { display: flex; }
        
        @media (min-width: 900px) {
            .chat-area { display: flex; }
            .chat-area:not(.has-chat) .chat-placeholder { display: flex; }
        }
        
        .chat-header {
            background: var(--sidebar-bg);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            min-height: 60px;
        }
        
        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            min-width: 0;
        }
        
        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: -8px;
        }
        @media (min-width: 900px) { .back-btn { display: none; } }
        
        .chat-title { flex: 1; min-width: 0; }
        .chat-title h3 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-title p {
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .chat-actions {
            display: flex;
            gap: 8px;
        }
        
        .action-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .action-btn.intervene { background: var(--danger); color: white; }
        .action-btn.intervene:hover { background: #d94a5b; }
        .action-btn.release { background: var(--accent); color: #111; }
        .action-btn.release:hover { background: #20c05a; }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Intervention Banner */
        .intervention-banner {
            background: linear-gradient(90deg, var(--danger), #ff6b6b);
            color: white;
            padding: 12px 16px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            animation: pulse 2s infinite;
        }
        .intervention-banner.active { display: flex; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        
        /* Messages */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            background-image: url("data:image/svg+xml,%3Csvg width='400' height='400' viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h400v400H0z' fill='%230a1014'/%3E%3Cpath d='M0 0h400v400H0z' fill='none' stroke='%23111b21' stroke-width='2'/%3E%3C/svg%3E");
        }
        
        .message {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14.5px;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
            animation: messageIn 0.3s ease;
        }
        @keyframes messageIn {
            from { opacity: 0; transform: translateY(20px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .message.incoming {
            background: var(--incoming);
            align-self: flex-start;
            border-top-left-radius: 2px;
            color: var(--text);
        }
        .message.outgoing {
            background: var(--outgoing);
            align-self: flex-end;
            border-top-right-radius: 2px;
            color: white;
        }
        .message.system {
            background: rgba(255, 193, 7, 0.15);
            align-self: center;
            font-size: 12.5px;
            color: #ffd700;
            padding: 8px 16px;
            border-radius: 16px;
            max-width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 193, 7, 0.3);
        }
        
        .message-content { margin-bottom: 4px; }
        
        .message-meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            font-size: 11px;
            opacity: 0.7;
            margin-top: 2px;
        }
        .message.outgoing .message-meta { color: #a5f3c5; }
        
        .date-separator {
            align-self: center;
            background: #1e2a30;
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
            margin: 16px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Typing Indicator */
        .typing-container {
            display: none;
            padding: 12px 16px;
            margin-bottom: 8px;
        }
        .typing-container.active { display: block; }
        
        .typing-bubble {
            background: var(--incoming);
            padding: 14px 20px;
            border-radius: 16px;
            border-top-left-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            width: fit-content;
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
        
        /* Input Area */
        .input-container {
            background: var(--sidebar-bg);
            padding: 10px 16px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            border-top: 1px solid var(--border);
        }
        
        .input-wrapper {
            flex: 1;
            background: #2a3942;
            border-radius: 24px;
            padding: 12px 20px;
            max-height: 120px;
            overflow-y: auto;
        }
        
        .input-wrapper input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);
            font-size: 15.5px;
            line-height: 1.4;
        }
        .input-wrapper input::placeholder { color: var(--text-secondary); }
        .input-wrapper input:disabled { opacity: 0.5; }
        
        .send-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: var(--secondary);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .send-btn:hover:not(:disabled) { background: var(--accent); transform: scale(1.05); }
        .send-btn:active:not(:disabled) { transform: scale(0.95); }
        .send-btn:disabled { background: #374248; cursor: not-allowed; }
        .send-btn svg { width: 24px; height: 24px; margin-left: 2px; }
        
        /* Placeholder */
        .chat-placeholder {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            text-align: center;
            padding: 40px;
        }
        .chat-placeholder svg {
            width: 120px;
            height: 120px;
            margin-bottom: 24px;
            opacity: 0.2;
        }
        .chat-placeholder h3 {
            font-size: 32px;
            font-weight: 300;
            margin-bottom: 16px;
            color: var(--text-secondary);
        }
        .chat-placeholder p { font-size: 14px; max-width: 400px; line-height: 1.6; }
        
        /* Empty State List */
        .empty-list {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .empty-list svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374248; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #4a5a63; }
        
        /* Mobile Optimizations */
        @media (max-width: 899px) {
            .message { max-width: 92%; font-size: 15.5px; }
            .chat-avatar { width: 48px; height: 48px; font-size: 20px; }
            .chat-name { font-size: 15px; }
            .action-btn { padding: 8px 16px; font-size: 13px; }
        }
        
        /* Prevent zoom on iOS */
        @supports (-webkit-touch-callout: none) {
            input, textarea { font-size: 16px; }
        }
    </style>
</head>
<body>
    <!-- Debug Panel (pressione Ctrl+D para mostrar) -->
    <div id="debugPanel"></div>
    
    <!-- Loading -->
    <div id="loading">
        <div class="spinner"></div>
        <p>Conectando ao painel...</p>
    </div>

    <div id="app">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="header">
                <h1>
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20.52 3.45A11.83 11.83 0 0 0 12 0 12 12 0 0 0 0 12a12 12 0 0 0 1.74 6.15L0 24l6.33-1.5A12 12 0 0 0 12 24a12 12 0 0 0 12-12 12 12 0 0 0-3.48-8.55zM12 22a9.89 9.89 0 0 1-5-1.35l-.36-.22-3.76.89.89-3.66-.23-.37A10 10 0 0 1 12 2a10 10 0 0 1 10 10 10 10 0 0 1-10 10zm5.4-7.4c-.3-.15-1.77-.87-2.05-1-.27-.1-.47-.15-.67.15s-.77 1-.95 1.2-.35.23-.65.08a8.2 8.2 0 0 1-2.4-1.5 9 9 0 0 1-1.67-2.08c-.17-.3 0-.47.13-.62s.3-.35.45-.53a2 2 0 0 0 .3-.5.55.55 0 0 0 0-.52c-.08-.15-.67-1.6-.92-2.2s-.48-.5-.67-.51h-.57a1.1 1.1 0 0 0-.8.37c-.28.3-1 1-1 2.43s1.03 2.82 1.17 3s1.35 2.06 3.27 2.89 1.9.85 2.25.89a2 2 0 0 0 1.53-.71 1.6 1.6 0 0 0 .36-1.03c0-.15-.12-.27-.4-.42z"/>
                    </svg>
                    WhatsApp Pro
                </h1>
                <div class="header-actions">
                    <span class="connection-badge" id="connectionBadge">Conectando...</span>
                    <button class="icon-btn" onclick="app.toggleDebug()" title="Debug">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                    </button>
                </div>
            </div>
            
            <div class="search-container">
                <div class="search-box">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#8696a0">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Pesquisar ou começar nova conversa" oninput="app.search(this.value)">
                </div>
            </div>
            
            <div class="chat-list" id="chatList">
                <div class="empty-list">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
                    <p>Carregando conversas...</p>
                </div>
            </div>
        </aside>

        <!-- Chat Area -->
        <main class="chat-area" id="chatArea">
            <div class="chat-placeholder" id="chatPlaceholder">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                <h3>WhatsApp Web</h3>
                <p>Envie e receba mensagens sem precisar manter seu celular conectado.<br>Use em até 4 dispositivos e 1 celular simultaneamente.</p>
            </div>

            <div id="activeChat" style="display: none; flex-direction: column; height: 100%;">
                <div class="chat-header">
                    <div class="chat-header-info">
                        <button class="back-btn" onclick="app.closeChat()">←</button>
                        <div class="chat-avatar" id="chatAvatar">👤</div>
                        <div class="chat-title">
                            <h3 id="chatName">-</h3>
                            <p id="chatStatus">-</p>
                        </div>
                    </div>
                    <div class="chat-actions" id="chatActions"></div>
                </div>

                <div class="intervention-banner" id="interventionBanner">
                    <span>⚡</span>
                    <span>Você assumiu o controle - Robô desativado</span>
                </div>

                <div class="messages-container" id="messagesContainer"></div>
                
                <div class="typing-container" id="typingContainer">
                    <div class="typing-bubble">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>

                <div class="input-container">
                    <div class="input-wrapper">
                        <input type="text" id="messageInput" placeholder="Digite uma mensagem" 
                               onkeypress="if(event.key==='Enter') app.sendMessage()" disabled>
                    </div>
                    <button class="send-btn" id="sendBtn" onclick="app.sendMessage()" disabled>
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ==========================================
        // CONFIGURAÇÃO - EDITE AQUI
        // ==========================================
        const CONFIG = {
            // URL do seu webhook - pode ser relativa ou absoluta
            WEBHOOK_URL: '/api/webhook',
            
            // Para teste sem webhook, use dados mockados:
            USE_MOCK_DATA: false, // Mude para true para testar a interface
            
            // Intervalo de polling em ms (2 segundos)
            POLL_INTERVAL: 2000,
            
            // Chave para salvar dados no localStorage
            STORAGE_KEY: 'whatsapp_panel_v2',
            
            // Número máximo de mensagens por conversa
            MAX_MESSAGES: 100
        };

        // ==========================================
        // DADOS DE TESTE (para desenvolvimento)
        // ==========================================
        const MOCK_DATA = {

        // CLASSE PRINCIPAL
        // ==========================================
        class WhatsAppPanel {
            constructor() {
                this.chats = new Map();
                this.currentChat = null;
                this.pollingTimer = null;
                messageInput
                this.isOnline = true;
                this.lastUpdate = 0;
                this.debugMode = false;
                
                this.init();
            }

            async init() {
                this.log('Inicializando painel...');
                
                // Carregar do cache imediatamente
                this.loadFromStorage();
                
                // Renderizar imediatamente (mesmo que vazio)
                this.renderChatList();
                
                // Esconder loading após 500ms
                setTimeout(() => {
                    document.getElementById('loading').classList.add('fade-out');
                }, 500);
                
                // Iniciar conexão
                if (CONFIG.USE_MOCK_DATA) {
                    this.log('Usando dados de teste');
                    this.loadMockData();
                    this.updateConnection('online');
                } else {
                    this.startPolling();
                }
                
                // Atalho debug
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey && e.key === 'd') {
                        e.preventDefault();
                        this.toggleDebug();
                    }
                });
            }

            log(msg, type = 'info') {
                console.log(`[WhatsApp Panel] ${msg}`);
                if (this.debugMode) {
                    const panel = document.getElementById('debugPanel');
                    const time = new Date().toLocaleTimeString();
                    const color = type === 'error' ? '#ff6b6b' : (type === 'success' ? '#4caf50' : 'white');
                    panel.innerHTML += `<div style="color: ${color}; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 2px 0;">[${time}] ${msg}</div>`;
                    panel.scrollTop = panel.scrollHeight;
                }
            }

            toggleDebug() {
                this.debugMode = !this.debugMode;
                document.getElementById('debugPanel').classList.toggle('show', this.debugMode);
                this.log('Debug mode: ' + (this.debugMode ? 'ON' : 'OFF'));
            }

            loadMockData() {
                MOCK_DATA.conversations.forEach(conv => {
                    this.chats.set(conv.phone, {
                        ...conv,
                        messages: MOCK_DATA.messages[conv.phone] || []
                    });
                });
                this.saveToStorage();
                this.renderChatList();
                this.log('Dados de teste carregados: ' + this.chats.size + ' conversas');
            }

            loadFromStorage() {
                try {
                    const data = localStorage.getItem(CONFIG.STORAGE_KEY);
                    if (data) {
                        const parsed = JSON.parse(data);
                        if (parsed.chats) {
                            parsed.chats.forEach(chat => this.chats.set(chat.phone, chat));
                            this.log('Carregado do cache: ' + this.chats.size + ' conversas');
                        }
                    }
                } catch (e) {
                    this.log('Erro ao carregar cache: ' + e.message, 'error');
                }
            }

            saveToStorage() {
                try {
                    const data = {
                        chats: Array.from(this.chats.values()),
                        savedAt: new Date().toISOString()
                    };
                    localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(data));
                } catch (e) {
                    this.log('Erro ao salvar cache: ' + e.message, 'error');
                }
            }

            startPolling() {
                this.log('Iniciando polling...');
                this.fetchData(); // Primeira chamada imediata
                this.pollingTimer = setInterval(() => this.fetchData(), CONFIG.POLL_INTERVAL);
            }

            stopPolling() {
                if (this.pollingTimer) {
                    clearInterval(this.pollingTimer);
                    this.pollingTimer = null;
                }
            }

            async fetchData() {
                try {
                    this.updateConnection('connecting');
                    
                    // Tentar buscar conversas
                    const convResponse = await fetch(`${CONFIG.WEBHOOK_URL}?action=list&t=${Date.now()}`);
                    
                    if (!convResponse.ok) {
                        throw new Error(`HTTP ${convResponse.status}`);
                    }
                    
                    const conversations = await convResponse.json();
                    this.log(`Recebidas ${conversations.length} conversas`, 'success');
                    
                    let hasChanges = false;
                    
                    conversations.forEach(conv => {
                        const existing = this.chats.get(conv.phone);
                        const newChat = {
                            ...existing,
                            ...conv,
                            messages: existing?.messages || []
                        };
                        
                        // Verificar se mudou
                        if (!existing || JSON.stringify(existing) !== JSON.stringify(newChat)) {
                            this.chats.set(conv.phone, newChat);
                            hasChanges = true;
                            
                            // Se é o chat atual, buscar mensagens novas
                            if (this.currentChat === conv.phone) {
                                this.fetchMessages(conv.phone);
                            }
                        }
                    });
                    
                    if (hasChanges) {
                        this.saveToStorage();
                        this.renderChatList();
                    }
                    
                    this.updateConnection('online');
                    this.isOnline = true;
                    
                } catch (error) {
                    this.log('Erro na conexão: ' + error.message, 'error');
                    this.updateConnection('offline');
                    this.isOnline = false;
                    
                    // Mesmo offline, mostrar dados do cache
                    if (this.chats.size === 0) {
                        this.renderChatList();
                    }
                }
            }

            async fetchMessages(phone) {
                if (!phone) return;
                
                try {
                    const response = await fetch(`${CONFIG.WEBHOOK_URL}?action=messages&phone=${encodeURIComponent(phone)}&t=${Date.now()}`);
                    
                    if (!response.ok) throw new Error('Erro ao buscar mensagens');
                    
                    const messages = await response.json();
                    const chat = this.chats.get(phone);
                    
                    if (chat) {
                        // Mesclar mensagens novas com existentes (evitar duplicatas)
                        const existingIds = new Set((chat.messages || []).map(m => m.id || m.timestamp));
                        const newMessages = messages.filter(m => !existingIds.has(m.id || m.timestamp));
                        
                        if (newMessages.length > 0) {
                            chat.messages = [...(chat.messages || []), ...newMessages]
                                .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp))
                                .slice(-CONFIG.MAX_MESSAGES);
                            
                            this.saveToStorage();
                            
                            if (this.currentChat === phone) {
                                this.renderMessages(chat.messages);
                                this.scrollToBottom();
                            }
                            
                            // Atualizar preview na lista
                            const lastMsg = messages[messages.length - 1];
                            if (lastMsg) {
                                chat.lastMessage = lastMsg.content || lastMsg.text;
                                chat.lastMessageAt = lastMsg.timestamp;
                                this.renderChatList();
                            }
                        }
                    }
                } catch (error) {
                    this.log(`Erro ao buscar mensagens de ${phone}: ${error.message}`, 'error');
                }
            }

            updateConnection(status) {
                const badge = document.getElementById('connectionBadge');
                badge.className = 'connection-badge ' + status;
                
                switch(status) {
                    case 'online':
                        badge.textContent = '🟢 Online';
                        break;
                    case 'offline':
                        badge.textContent = '🔴 Offline';
                        break;
                    case 'connecting':
                        badge.textContent = '🟡 Conectando...';
                        break;
                }
            }

                        </div>
                    </div>
                    <div class="chat-actions" id="chatActions"></div>
                </div>

                <div class="intervention-banner" id="interventionBanner">
                    <span>⚠️</span>
                    <span>Você assumiu o controle - Robô desativado</span>
                </div>

                <div class="messages-container" id="messagesContainer"></div>

                <div class="input-container">
                    <div class="input-wrapper">
                        <input type="text" id="messageInput" placeholder="Digite uma mensagem..." 
                               onkeypress="if(event.key==='Enter') app.sendMessage()" disabled>
                    </div>
                    <button class="send-btn" id="sendBtn" onclick="app.sendMessage()" disabled>
                        ➤
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ==========================================
        // CONFIGURAÇÃO - AJUSTE AQUI SEU WEBHOOK
        // ==========================================
        const CONFIG = {
            // URL do seu webhook na Vercel
            WEBHOOK_URL: '/api/webhook', // Ou: 'https://seu-projeto.vercel.app/api/webhook'
            
            // Intervalo de atualização (ms)
            POLL_INTERVAL: 2000,      // 2 segundos para lista de conversas
            CHAT_POLL_INTERVAL: 1500, // 1.5 segundos para chat aberto
            
            // Chave do localStorage
            STORAGE_KEY: 'rc_reforma_panel'
        };

        // ==========================================
        // CLASSE PRINCIPAL
        // ==========================================
        class RCPanel {
            constructor() {
                this.conversations = new Map(); // Mapa de telefone -> dados
                this.currentPhone = null;
                this.pollingTimer = null;
                this.chatPollingTimer = null;
                this.isOnline = true;
                
                this.init();
            }

            async init() {
                console.log('[RC Panel] Inicializando...');
                
                // Carregar cache imediatamente
                this.loadFromCache();
                this.renderList();
                
                // Esconder loading
                setTimeout(() => {
                    document.getElementById('loading').classList.add('fade-out');
                }, 500);
                
                // Iniciar polling
                this.startPolling();
                
                // Primeira carga
                await this.fetchConversations();
            }

            // Carregar do cache
            loadFromCache() {
                try {
                    const cached = localStorage.getItem(CONFIG.STORAGE_KEY);
                    if (cached) {
                        const data = JSON.parse(cached);
                        if (data.conversations) {
                            data.conversations.forEach(c => {
                                this.conversations.set(c.telefone, c);
                            });
                            console.log(`[RC Panel] ${this.conversations.size} conversas do cache`);
                        }
                    }
                } catch (e) {
                    console.error('[RC Panel] Erro cache:', e);
                }
            }

            // Salvar no cache
            saveToCache() {
                try {
                    const data = {
                        conversations: Array.from(this.conversations.values()),
                        savedAt: new Date().toISOString()
                    };
                    localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(data));
                } catch (e) {
                    console.error('[RC Panel] Erro ao salvar:', e);
                }
            }

            // Polling principal
            startPolling() {
                this.fetchConversations();
                this.pollingTimer = setInterval(() => this.fetchConversations(), CONFIG.POLL_INTERVAL);
            }

            stopPolling() {
                if (this.pollingTimer) clearInterval(this.pollingTimer);
            }

            // Buscar conversas do webhook
            async fetchConversations() {
                try {
                    this.updateConnection('connecting');
                    
                    const response = await fetch(`${CONFIG.WEBHOOK_URL}?action=list&_t=${Date.now()}`);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                    const data = await response.json();
                    console.log('[RC Panel] Recebido:', data);
                    
                    if (!data.conversas || !Array.isArray(data.conversas)) {
                        throw new Error('Formato inválido - esperado {conversas: []}');
                    }
                    
                    let hasChanges = false;
                    const currentPhones = new Set();
                    
                    data.conversas.forEach(conv => {
                        currentPhones.add(conv.telefone);
                        const existing = this.conversations.get(conv.telefone);
                        
                        // Se é nova ou mudou
                        if (!existing) {
                            this.conversations.set(conv.telefone, {
                                ...conv,
                                messages: [],
                                unread: true
                            });
                            hasChanges = true;
                            console.log(`[RC Panel] Nova conversa: ${conv.telefone}`);
                        } else {
                            // Verificar mudanças
                            const changed = 
                                existing.etapa !== conv.etapa ||
                                existing.emIntervencao !== conv.emIntervencao ||
                                existing.ultimaAtividade !== conv.ultimaAtividade;
                            
                            if (changed) {
                                Object.assign(existing, conv);
                                hasChanges = true;
                            }
                            
                            // Se tem chat aberto, marcar como não nova
                            if (this.currentPhone === conv.telefone) {
                                existing.unread = false;
                            }
                        }
                    });
                    
                    // Remover conversas antigas não mais presentes (opcional)
                    // this.conversations.forEach((_, phone) => {
                    //     if (!currentPhones.has(phone)) {
                    //         this.conversations.delete(phone);
                    //         hasChanges = true;
                    //     }
                    // });
                    
                    if (hasChanges) {
                        this.saveToCache();
                        this.renderList();
                        
                        // Se tem chat aberto, atualizar mensagens
                        if (this.currentPhone) {
                            this.fetchMessages(this.currentPhone);
                        }
                    }
                    
                    this.updateConnection('online');
                    this.isOnline = true;
                    
                } catch (error) {
                    console.error('[RC Panel] Erro:', error);
                    this.updateConnection('offline');
                    this.isOnline = false;
                }
            }

            // Buscar mensagens de uma conversa
            async fetchMessages(phone) {
                if (!phone) return;
                
                try {
                    const response = await fetch(`${CONFIG.WEBHOOK_URL}?action=messages&phone=${encodeURIComponent(phone)}&_t=${Date.now()}`);
                    
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    
                    const data = await response.json();
                    console.log(`[RC Panel] Mensagens ${phone}:`, data.mensagens?.length || 0);
                    
                    const conv = this.conversations.get(phone);
                    if (!conv) return;
                    
                    // Atualizar dados da conversa
                    if (data.nome) conv.nome = data.nome;
                    if (data.etapa) conv.etapa = data.etapa;
                    conv.emIntervencao = data.emIntervencao;
                    
                    // Atualizar mensagens se houver
                    if (data.mensagens && Array.isArray(data.mensagens)) {
                        const currentCount = conv.messages?.length || 0;
                        const newCount = data.mensagens.length;
                        
                        if (newCount !== currentCount) {
                            conv.messages = data.mensagens;
                            this.saveToCache();
                            
                            // Se é o chat atual, renderizar
                            if (this.currentPhone === phone) {
                                this.renderMessages(data.mensagens);
                            }
                            
                            // Atualizar preview na lista
                            const lastMsg = data.mensagens[data.mensagens.length - 1];
                            if (lastMsg) {
                                conv.ultimaMensagem = lastMsg.mensagem || lastMsg.texto || lastMsg.content;
                                conv.ultimaAtividade = lastMsg.data || new Date().toISOString();
                                this.renderList();
                            }
                        }
                    }
                    
                } catch (error) {
                    console.error(`[RC Panel] Erro mensagens ${phone}:`, error);
                }
            }

            // Renderizar lista de conversas
            renderList() {
                const container = document.getElementById('chatList');
                const searchTerm = (document.getElementById('searchInput')?.value || '').toLowerCase();
                
                const convs = Array.from(this.conversations.values())
                    .filter(c => !searchTerm || 
                        (c.nome?.toLowerCase().includes(searchTerm)) || 
                        c.telefone.includes(searchTerm))
                    .sort((a, b) => {
                        // Ordenar: intervenções primeiro, depois por data
                        if (a.emIntervencao && !b.emIntervencao) return -1;
                        if (!a.emIntervencao && b.emIntervencao) return 1;
                        return new Date(b.ultimaAtividade || 0) - new Date(a.ultimaAtividade || 0);
                    });

                if (convs.length === 0) {
                    container.innerHTML = `
                        <div class="empty-list">
                            <p>${this.isOnline ? 'Nenhuma conversa ativa' : 'Modo offline - sem dados'}</p>
                            <p style="font-size: 12px; margin-top: 10px; opacity: 0.7;">
                                Aguardando novos atendimentos...
                            </p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = convs.map(conv => {
                    const isActive = conv.telefone === this.currentPhone;
                    const isIntervention = conv.emIntervencao;
                    const lastMsg = conv.ultimaMensagem || conv.resumo || 'Sem mensagens';
                    const time = this.formatTime(conv.ultimaAtividade);
                    
                    return `
                        <div class="chat-item ${isActive ? 'active' : ''} ${isIntervention ? 'intervention' : ''}" 
                             onclick="app.openChat('${conv.telefone}')"
                             data-phone="${conv.telefone}">
                            <div class="chat-avatar">${this.getInitials(conv.nome)}</div>
                            <div class="chat-info">
                                <div class="chat-header-row">
                                    <span class="chat-name">${conv.nome || conv.telefone}</span>
                                    <span class="chat-time">${time}</span>
                                </div>
                                <div class="chat-preview">
                                    <span style="flex: 1; overflow: hidden; text-overflow: ellipsis;">
                                        ${isIntervention ? '🔴 ' : ''}${this.escapeHtml(lastMsg.substring(0, 50))}
                                    </span>
                                    <span class="status-badge ${isIntervention ? 'intervention' : 'bot'}">
                                        ${isIntervention ? '⚠️ INTERVENÇÃO' : '🤖 BOT'}
                                    </span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // Abrir chat
            async openChat(phone) {
                console.log(`[RC Panel] Abrindo: ${phone}`);
                this.currentPhone = phone;
                const conv = this.conversations.get(phone);
                
                if (!conv) {
                    console.error(`[RC Panel] Conversa não encontrada: ${phone}`);
                    return;
                }

                // UI
                document.getElementById('sidebar').classList.add('hidden-mobile');
                document.getElementById('chatArea').classList.add('active');
                document.getElementById('emptyChat').style.display = 'none';
                document.getElementById('activeChat').style.display = 'flex';

                // Header
                document.getElementById('chatName').textContent = conv.nome || phone;
                document.getElementById('chatAvatar').textContent = this.getInitials(conv.nome);
                this.updateChatStatus(conv);

                // Renderizar mensagens do cache imediatamente
                if (conv.messages && conv.messages.length > 0) {
                    this.renderMessages(conv.messages);
                } else {
                    document.getElementById('messagesContainer').innerHTML = '';
                }

                // Buscar mensagens atualizadas
                await this.fetchMessages(phone);

                // Iniciar polling rápido para este chat
                this.startChatPolling(phone);

                // Marcar como lida
                conv.unread = false;
                this.renderList();
            }

            // Polling específico do chat
            startChatPolling(phone) {
                if (this.chatPollingTimer) clearInterval(this.chatPollingTimer);
                this.chatPollingTimer = setInterval(() => {
                    if (this.currentPhone === phone) {
                        this.fetchMessages(phone);
                    }
                }, CONFIG.CHAT_POLL_INTERVAL);
            }

            stopChatPolling() {
                if (this.chatPollingTimer) {
                    clearInterval(this.chatPollingTimer);
                    this.chatPollingTimer = null;
                }
            }

            // Fechar chat
            closeChat() {
                this.currentPhone = null;
                this.stopChatPolling();
                
                document.getElementById('sidebar').classList.remove('hidden-mobile');
                document.getElementById('chatArea').classList.remove('active');
                document.getElementById('emptyChat').style.display = 'flex';
                document.getElementById('activeChat').style.display = 'none';
            }

            // Atualizar status do chat
            updateChatStatus(conv) {
                const statusText = conv.emIntervencao ? 
                    '⚠️ Você está no controle' : 
                    `Etapa: ${conv.etapa || 'Início'}`;
                document.getElementById('chatStatus').textContent = statusText;
                
                const banner = document.getElementById('interventionBanner');
                const input = document.getElementById('messageInput');
                const sendBtn = document.getElementById('sendBtn');
                const actions = document.getElementById('chatActions');
                
                if (conv.emIntervencao) {
                    banner.classList.add('active');
                    input.disabled = false;
                    sendBtn.disabled = false;
                    input.placeholder = 'Digite sua mensagem...';
                    input.focus();
                    actions.innerHTML = `
                        <button class="action-btn release" onclick="app.toggleIntervention(false)">
                            🤖 Liberar Robô
                        </button>
                    `;
                } else {
                    banner.classList.remove('active');
                    input.disabled = true;
                    sendBtn.disabled = true;
                    input.placeholder = 'Assuma o controle para responder';
                    input.blur();
                    actions.innerHTML = `
                        <button class="action-btn intervene" onclick="app.toggleIntervention(true)">
                            🚨 Assumir Controle
                        </button>
                    `;
                }
            }

            // Renderizar mensagens
            renderMessages(messages) {
                const container = document.getElementById('messagesContainer');
                
                if (!messages || messages.length === 0) {
                    container.innerHTML = '<div style="text-align: center; color: #666; padding: 40px;">Nenhuma mensagem</div>';
                    return;
                }

                let lastDate = null;
                let html = '';
                
                messages.forEach((msg, index) => {
                    const msgDate = new Date(msg.data || msg.timestamp || Date.now()).toDateString();
                    
                    if (msgDate !== lastDate) {
                        html += `<div class="date-separator">${this.formatDate(msg.data || msg.timestamp)}</div>`;
                        lastDate = msgDate;
                    }
                    
                    // Determinar tipo
                    let type = 'incoming';
                    let sender = 'Cliente';
                    
                    if (msg.tipo === 'bot' || msg.from === 'bot') {
                        type = 'outgoing';
                        sender = 'Robô';
                    } else if (msg.tipo === 'humano' || msg.from === 'humano' || msg.tipo === 'me') {
                        type = 'outgoing';
                        sender = 'Você';
                    } else if (msg.tipo === 'system') {
                        type = 'system';
                        sender = 'Sistema';
                    }
                    
                    const time = this.formatTime(msg.data || msg.timestamp);
                    const content = this.escapeHtml(msg.mensagem || msg.content || msg.text || '');
                    
                    html += `
                        <div class="message ${type}" data-id="${msg.id || index}">
                            ${type !== 'system' ? `<div class="message-sender">${sender}</div>` : ''}
                            <div class="message-content">${content}</div>
                            <div class="message-meta">${time}</div>
                        </div>
                    `;
                });
                
                // Só atualizar se mudou
                if (container.innerHTML !== html) {
                    container.innerHTML = html;
                    this.scrollToBottom();
                }
            }

            // Assumir/liberar controle
            async toggleIntervention(takeControl) {
                if (!this.currentPhone) return;
                
                const action = takeControl ? 'intervene' : 'release';
                const btn = document.querySelector('.action-btn');
                
                console.log(`[RC Panel] ${action}: ${this.currentPhone}`);
                btn.disabled = true;
                btn.textContent = '⏳...';
                
                try {
                    const response = await fetch(`${CONFIG.WEBHOOK_URL}?action=${action}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone: this.currentPhone })
                    });
                    
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    
                    const result = await response.json();
                    console.log(`[RC Panel] Resultado:`, result);
                    
                    // Atualizar localmente
                    const conv = this.conversations.get(this.currentPhone);
                    conv.emIntervencao = takeControl;
                    this.saveToCache();
                    
                    this.updateChatStatus(conv);
                    this.renderList();
                    
                } catch (error) {
                    console.error(`[RC Panel] Erro ${action}:`, error);
                    alert('Erro ao alterar controle. Verifique a conexão.');
                    btn.disabled = false;
                    btn.textContent = takeControl ? '🚨 Assumir Controle' : '🤖 Liberar Robô';
                }
            }

            // Enviar mensagem
            async sendMessage() {
                if (!this.currentPhone) return;
                
                const input = document.getElementById('messageInput');
                const text = input.value.trim();
                if (!text) return;
                
                const conv = this.conversations.get(this.currentPhone);
                if (!conv.emIntervencao) {
                    alert('Assuma o controle primeiro!');
                    return;
                }
                
                input.value = '';
                
                // Adicionar localmente (otimista)
                const newMsg = {
                    mensagem: text,
                    tipo: 'humano',
                    data: new Date().toISOString()
                };
                
                if (!conv.messages) conv.messages = [];
                conv.messages.push(newMsg);
                this.renderMessages(conv.messages);
                this.saveToCache();
                
                // Enviar para servidor
                try {
                    const response = await fetch(`${CONFIG.WEBHOOK_URL}?action=send`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            phone: this.currentPhone,
                            mensagem: text
                        })
                    });
                    
                    if (!response.ok) throw new Error('Falha ao enviar');
                    
                    // Atualizar preview
                    conv.ultimaMensagem = text;
                    conv.ultimaAtividade = new Date().toISOString();
                    this.renderList();
                    
                } catch (error) {
                    console.error('[RC Panel] Erro ao enviar:', error);
                    alert('Mensagem salva localmente. Será sincronizada quando reconectar.');
                }
            }

            // Busca
            search(term) {
                this.renderList();
            }

            // Scroll
            scrollToBottom() {
                const container = document.getElementById('messagesContainer');
                container.scrollTop = container.scrollHeight;
            }

            // Status de conexão
            updateConnection(status) {
                const badge = document.getElementById('connectionBadge');
                badge.className = 'connection-badge ' + status;
                
                switch(status) {
                    case 'online':
                        badge.textContent = '🟢 Online';
                        break;
                    case 'offline':
                        badge.textContent = '🔴 Offline';
                        break;
                    case 'connecting':
                        badge.textContent = '🟡 Atualizando...';
                        break;
                }
            }

            renderChatList() {
                const container = document.getElementById('chatList');
                const searchTerm = (document.getElementById('searchInput')?.value || '').toLowerCase();
                
                const chats = Array.from(this.chats.values())
                    .filter(c => !searchTerm || 
                        (c.name?.toLowerCase().includes(searchTerm)) || 
                        c.phone.includes(searchTerm))
                    .sort((a, b) => {
                        const timeA = new Date(a.lastMessageAt || 0).getTime();
                        const timeB = new Date(b.lastMessageAt || 0).getTime();
                        return timeB - timeA;
                    });

                if (chats.length === 0) {
                    container.innerHTML = `
                        <div class="empty-list">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
                            <p>${searchTerm ? 'Nenhuma conversa encontrada' : 'Nenhuma conversa ainda'}</p>
                            <p style="font-size: 12px; margin-top: 10px; opacity: 0.7;">
                                ${this.isOnline ? 'Aguardando novas mensagens...' : 'Modo offline - dados do cache'}
                            </p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = chats.map(chat => {
                    const isActive = chat.phone === this.currentChat;
                    const isUnread = (chat.unread > 0 || chat.unread === true) && !isActive;
                    const time = this.formatTime(chat.lastMessageAt);
                    const preview = chat.typing ? 
                        '<span class="chat-preview typing">digitando...</span>' : 
                        `<span class="chat-preview">${this.escapeHtml(chat.lastMessage || 'Nenhuma mensagem')}</span>`;
                    
                    return `
                        <div class="chat-item ${isActive ? 'active' : ''} ${isUnread ? 'unread' : ''}" 
                             onclick="app.openChat('${chat.phone}')"
                             data-phone="${chat.phone}">
                            <div class="chat-avatar ${chat.online ? 'online' : ''}">${this.getInitials(chat.name)}</div>
                            <div class="chat-info">
                                <div class="chat-header-row">
                                    <span class="chat-name">${chat.name || chat.phone}</span>
                                    <span class="chat-time">${time}</span>
                                </div>
                                <div style="display: flex; align-items: center;">
                                    ${preview}
                                    ${isUnread ? `<span class="unread-badge">${chat.unread}</span>` : ''}
                                    <span class="status-indicator ${chat.intervention ? 'human' : 'bot'}">
                                        ${chat.intervention ? '🔴 VOCÊ' : '🤖 BOT'}
                                    </span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            openChat(phone) {
                this.log('Abrindo chat: ' + phone);
                this.currentChat = phone;
                const chat = this.chats.get(phone);
                
                if (!chat) {
                    this.log('Chat não encontrado: ' + phone, 'error');
                    return;
                }

                // UI Mobile
                document.getElementById('sidebar').classList.add('hidden-mobile');
                document.getElementById('chatArea').classList.add('active', 'has-chat');
                document.getElementById('chatPlaceholder').style.display = 'none';
                document.getElementById('activeChat').style.display = 'flex';

                // Header
                document.getElementById('chatName').textContent = chat.name || phone;
                document.getElementById('chatAvatar').textContent = this.getInitials(chat.name);
                this.updateChatStatus(chat);

                // Renderizar mensagens imediatamente
                if (chat.messages && chat.messages.length > 0) {
                    this.renderMessages(chat.messages);
                } else {
                    document.getElementById('messagesContainer').innerHTML = '';
                    this.fetchMessages(phone);
                }

                // Marcar como lida
                if (chat.unread) {
                    this.markAsRead(phone);
                }

                // Focar input
                if (chat.intervention) {
                    setTimeout(() => document.getElementById('messageInput').focus(), 100);
                }

                // Iniciar polling específico para este chat
                this.startChatPolling(phone);
            }

            closeChat() {
                this.log('Fechando chat');
                this.currentChat = null;
                this.stopChatPolling();
                
                document.getElementById('sidebar').classList.remove('hidden-mobile');
                document.getElementById('chatArea').classList.remove('active', 'has-chat');
                document.getElementById('chatPlaceholder').style.display = 'flex';
                document.getElementById('activeChat').style.display = 'none';
            }

            startChatPolling(phone) {
                // Polling extra rápido para mensagens do chat atual (1 segundo)
                if (this.chatPollingTimer) clearInterval(this.chatPollingTimer);
                this.chatPollingTimer = setInterval(() => {
                    if (this.currentChat === phone) {
                        this.fetchMessages(phone);
                    }
                }, 1000);
            }

            stopChatPolling() {
                if (this.chatPollingTimer) {
                    clearInterval(this.chatPollingTimer);
                    this.chatPollingTimer = null;
                }
            }

            updateChatStatus(chat) {
                const statusText = chat.intervention ? 
                    'Você está respondendo' : 
                    (chat.online ? 'Online' : 'Robô ativo');
                document.getElementById('chatStatus').textContent = statusText;
                
                const banner = document.getElementById('interventionBanner');
                const input = document.getElementById('messageInput');
                const sendBtn = document.getElementById('sendBtn');
                const actions = document.getElementById('chatActions');
                
                if (chat.intervention) {
                    banner.classList.add('active');
                    input.disabled = false;
                    sendBtn.disabled = false;
                    input.placeholder = 'Digite uma mensagem';
                    input.focus();
                    actions.innerHTML = `
                        <button class="action-btn release" onclick="app.toggleIntervention(false)">
                            🤖 Liberar Robô
                        </button>
                    `;
                } else {
                    banner.classList.remove('active');
                    input.disabled = true;
                    sendBtn.disabled = true;
                    input.placeholder = 'Assuma o controle para responder';
                    input.blur();
                    actions.innerHTML = `
                        <button class="action-btn intervene" onclick="app.toggleIntervention(true)">
                            🚨 Assumir Controle
                        </button>
                    `;
                }
            }

            renderMessages(messages) {
                const container = document.getElementById('messagesContainer');
                
                if (!messages || messages.length === 0) {
                    container.innerHTML = '';
                    return;
                }

                let lastDate = null;
                let html = '';
                
                messages.forEach((msg, index) => {
                    const msgDate = new Date(msg.timestamp || msg.created_at).toDateString();
                    
                    if (msgDate !== lastDate) {
                        html += `<div class="date-separator">${this.formatDate(msg.timestamp || msg.created_at)}</div>`;
                        lastDate = msgDate;
                    }
                    
                    const isOutgoing = msg.from === 'human' || msg.from === 'me' || msg.sender === 'human' || msg.from === 'bot';
                    const type = msg.type === 'system' ? 'system' : (isOutgoing ? 'outgoing' : 'incoming');
                    const time = this.formatTime(msg.timestamp || msg.created_at);
                    const content = this.escapeHtml(msg.content || msg.text || msg.message || '');
                    
                    html += `
                        <div class="message ${type}" data-id="${msg.id || index}">
                            <div class="message-content">${content}</div>
                            <div class="message-meta">${time}</div>
                        </div>
                    `;
                });
                
                // Só atualizar se mudou significativamente
                if (container.innerHTML.length !== html.length) {
                    container.innerHTML = html;
                    this.scrollToBottom();
                }
            }

            async toggleIntervention(takeControl) {
                if (!this.currentChat) return;
                
                const action = takeControl ? 'intervene' : 'release';
                const btn = document.querySelector('.action-btn');
                
                this.log(`${takeControl ? 'Assumindo' : 'Liberando'} controle de ${this.currentChat}`);
                btn.disabled = true;
                btn.textContent = '⏳...';
                
                try {
                    const response = await fetch(`${CONFIG.WEBHOOK_URL}?action=${action}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone: this.currentChat })
                    });
                    
                    if (!response.ok) throw new Error('Falha na requisição');
                    
                    const result = await response.json();
                    
                    // Atualizar localmente
                    const chat = this.chats.get(this.currentChat);
                    chat.intervention = takeControl;
                    this.saveToStorage();
                    this.updateChatStatus(chat);
                    this.renderChatList();
                    
                    this.log('Sucesso: ' + (takeControl ? 'Intervenção ativada' : 'Robô liberado'), 'success');
                    
                } catch (error) {
                    this.log('Erro: ' + error.message, 'error');
                    alert('Erro ao alterar controle. Verifique a conexão.');
                    btn.disabled = false;
                    btn.textContent = takeControl ? '🚨 Assumir Controle' : '🤖 Liberar Robô';
                }
            }

            async sendMessage() {
                if (!this.currentChat) return;
                
                const input = document.getElementById('messageInput');
                const text = input.value.trim();
                if (!text) return;
                
                const chat = this.chats.get(this.currentChat);
                if (!chat.intervention) {
                    alert('Assuma o controle primeiro!');
                    return;
                }
                
                input.value = '';
                
                // Adicionar localmente imediatamente (otimista)
                const tempMsg = {
                    content: text,
                    from: 'human',
                    timestamp: new Date().toISOString(),
                    pending: true
                };
                
                if (!chat.messages) chat.messages = [];
                chat.messages.push(tempMsg);
                this.renderMessages(chat.messages);
                this.saveToStorage();
                
                // Enviar para servidor
                try {
                    const response = await fetch(`${CONFIG.WEBHOOK_URL}?action=send`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            phone: this.currentChat,
                            message: text
                        })
                    });
                    
                    if (!response.ok) throw new Error('Falha ao enviar');
                    
                    // Remover flag pending
                    delete tempMsg.pending;
                    this.saveToStorage();
                    
                    // Atualizar preview
                    chat.lastMessage = text;
                    chat.lastMessageAt = new Date().toISOString();
                    this.renderChatList();
                    
                    this.log('Mensagem enviada', 'success');
                    
                } catch (error) {
                    this.log('Erro ao enviar: ' + error.message, 'error');
                    alert('Erro ao enviar. Mensagem salva localmente.');
                }
            }

            async markAsRead(phone) {
                const chat = this.chats.get(phone);
                if (!chat || !chat.unread) return;
                
                chat.unread = 0;
                this.saveToStorage();
                this.renderChatList();
                
                try {
                    await fetch(`${CONFIG.WEBHOOK_URL}?action=read`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone })
                    });
                } catch (e) {
                    // Silencioso
                }
            }

            search(term) {
                this.renderChatList();
            }

            scrollToBottom() {
                const container = document.getElementById('messagesContainer');
                container.scrollTop = container.scrollHeight;
            }

            getInitials(name) {
                if (!name) return '👤';
                return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
            }

            formatTime(date) {
                if (!date) return '';
                const d = new Date(date);
                return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            }

            formatDate(date) {
                if (!date) return '';
                const d = new Date(date);
                const today = new Date();
                const yesterday = new Date(today);
                yesterday.setDate(yesterday.getDate() - 1);
                
                if (d.toDateString() === today.toDateString()) return 'Hoje';
                if (d.toDateString() === yesterday.toDateString()) return 'Ontem';
                return d.toLocaleDateString('pt-BR', { day: 'numeric', month: 'long' });
            }

            escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML.replace(/\n/g, '<br>');
            }
        }

        // Inicializar
        const app = new WhatsAppPanel();
    </script>
</body>
