<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RC Painel - Intervenção</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        :root {
            --verde: #075e54;
            --verde-claro: #128c7e;
            --fundo: #f0f2f5;
            --chat-bg: #e5ddd5;
        }
        
        body {
            background: var(--fundo);
            height: 100vh;
            overflow: hidden;
        }
        
        /* HEADER */
        .header {
            background: var(--verde);
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            font-size: 18px;
            font-weight: 600;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff00;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* CONTAINER PRINCIPAL */
        .container {
            display: flex;
            height: 100vh;
            padding-top: 50px;
        }
        
        /* LISTA DE CONVERSAS */
        .lista-conversas {
            width: 100%;
            max-width: 400px;
            background: white;
            overflow-y: auto;
            border-right: 1px solid #ddd;
        }
        
        @media (max-width: 768px) {
            .lista-conversas {
                max-width: 100%;
            }
            .lista-conversas.escondido {
                display: none;
            }
        }
        
        .conversa-item {
            padding: 14px 16px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
        }
        
        .conversa-item:hover {
            background: #f5f5f5;
        }
        
        .conversa-item.ativa {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
        }
        
        .conversa-item.intervencao {
            border-left: 4px solid #ff4444;
            background: #fff5f5;
        }
        
        .conversa-item.intervencao.ativa {
            background: #ffebee;
        }
        
        .avatar {
            width: 50px;
            height: 50px;
            background: var(--verde-claro);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            flex-shrink: 0;
        }
        
        .conversa-info {
            flex: 1;
            min-width: 0;
        }
        
        .conversa-titulo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        
        .numero {
            font-weight: 600;
            color: #333;
            font-size: 15px;
        }
        
        .hora {
            font-size: 12px;
            color: #999;
        }
        
        .preview {
            color: #666;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .badge {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 600;
            display: inline-block;
        }
        
        .badge.robo {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .badge.humano {
            background: #ffebee;
            color: #c62828;
            animation: blink 1.5s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .badge.tecnico {
            background: #fff3e0;
            color: #ef6c00;
        }
        
        /* ÁREA DE CHAT */
        .area-chat {
            flex: 1;
            display: none;
            flex-direction: column;
            background: var(--chat-bg);
        }
        
        @media (max-width: 768px) {
            .area-chat {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 200;
                padding-top: 0;
            }
            .area-chat.ativa {
                display: flex;
            }
        }
        
        @media (min-width: 769px) {
            .area-chat.ativa {
                display: flex;
            }
        }
        
        .chat-header {
            background: #f0f0f0;
            padding: 12px 16px;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .btn-voltar {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
            display: none;
        }
        
        @media (max-width: 768px) {
            .btn-voltar {
                display: block;
            }
        }
        
        .chat-info h3 {
            font-size: 16px;
            color: #333;
            margin-bottom: 2px;
        }
        
        .chat-info p {
            font-size: 13px;
            color: #666;
        }
        
        .chat-acoes {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }
        
        .btn-acao {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-intervir {
            background: #ff4444;
            color: white;
        }
        
        .btn-liberar {
            background: #4caf50;
            color: white;
        }
        
        .btn-intervir:disabled, .btn-liberar:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        /* MENSAGENS */
        .mensagens {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .mensagem {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14.5px;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
        }
        
        .mensagem.cliente {
            background: white;
            align-self: flex-start;
            border-top-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        
        .mensagem.robo {
            background: #dcf8c6;
            align-self: flex-end;
            border-top-right-radius: 4px;
        }
        
        .mensagem.humano {
            background: #ff6b6b;
            color: white;
            align-self: flex-end;
            border-top-right-radius: 4px;
        }
        
        .mensagem.tecnico {
            background: #fff3e0;
            align-self: flex-start;
            border-top-left-radius: 4px;
        }
        
        .mensagem.sistema {
            background: rgba(0,0,0,0.05);
            align-self: center;
            font-size: 12px;
            color: #666;
            padding: 6px 12px;
        }
        
        .msg-meta {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
            text-align: right;
        }
        
        .mensagem.humano .msg-meta {
            color: rgba(255,255,255,0.8);
        }
        
        /* INPUT */
        .input-area {
            background: #f0f0f0;
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .input-mensagem {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 24px;
            font-size: 15px;
            outline: none;
            background: white;
        }
        
        .input-mensagem:disabled {
            background: #e0e0e0;
        }
        
        .btn-enviar {
            width: 48px;
            height: 48px;
            background: var(--verde);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-enviar:disabled {
            background: #ccc;
        }
        
        /* AVISO DE INTERVENÇÃO */
        .aviso-intervencao {
            background: #ff4444;
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
        }
        
        /* VAZIO */
        .vazio {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            padding: 40px;
            text-align: center;
        }
        
        .vazio-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        
        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }
        
        /* ANIMAÇÕES */
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .area-chat.ativa {
            animation: slideIn 0.3s ease;
        }
    </style>
</head>

            <div class="header">
                <h1>🤖 RC Painel</h1>
                <div class="status">
                    <span class="status-dot"></span>
                    <span id="contador">0 ativos</span>
                </div>
            </div>

                <div class="vazio">
                    <div class="vazio-icon">💬</div>
                    <p>Carregando conversas...</p>
                </div>
            </div>
        </div>
