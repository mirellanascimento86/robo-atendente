<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #f0f2f5;
            height: 100vh;
            overflow: hidden;
        }
        
        .header { 
            background: #075e54; 
            color: white; 
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .container { 
            display: grid; 
            grid-template-columns: 320px 1fr; 
            height: calc(100vh - 60px);
        }
        
        /* LISTA DE CONVERSAS */
        .lista { 
            background: white;
            border-right: 1px solid #ddd;
            overflow-y: auto;
        }
        
        .conversa { 
            padding: 15px; 
            border-bottom: 1px solid #eee; 
            cursor: pointer;
            transition: 0.2s;
        }
        
        .conversa:hover { background: #f5f5f5; }
        .conversa.ativa { background: #e3f2fd; border-left: 4px solid #2196f3; }
        .conversa.intervencao { border-left: 4px solid #f44336; }
        
        .tel { font-weight: bold; color: #075e54; font-size: 14px; }
        .nome { color: #666; font-size: 12px; }
        .prev { color: #999; font-size: 13px; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .tag { 
            display: inline-block;
            padding: 3px 10px; 
            border-radius: 12px; 
            font-size: 11px; 
            margin-top: 8px;
            font-weight: bold;
        }
        .tag.robo { background: #4caf50; color: white; }
        .tag.humano { background: #f44336; color: white; }
        
        /* ÁREA DO CHAT */
        .chat { 
            display: flex; 
            flex-direction: column;
            background: #e5ddd5;
        }
        
        .chat-header { 
            background: #f0f0f0; 
            padding: 15px 20px; 
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .info h3 { color: #075e54; }
        .info p { color: #666; font-size: 13px; margin-top: 5px; }
        
        .botoes button {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 10px;
        }
        
        .btn-vermelho { background: #f44336; color: white; }
        .btn-verde { background: #4caf50; color: white; }
        .btn-cinza { background: #ccc; cursor: not-allowed; }
        
        .mensagens { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .msg { 
            max-width: 75%; 
            padding: 12px 15px; 
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.4;
        }
        
        .msg.cliente { 
            background: white; 
            align-self: flex-start;
            border-top-left-radius: 2px;
        }
        
        .msg.robo { 
            background: #dcf8c6; 
            align-self: flex-end;
            border-top-right-radius: 2px;
        }
        
        .msg.humano { 
            background: #ff6b6b; 
            color: white;
            align-self: flex-end;
            border-top-right-radius: 2px;
        }
        
        .hora {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
            text-align: right;
        }
        
        .msg.humano .hora { color: rgba(255,255,255,0.8); }
        
        .input-area {
            background: #f0f0f0;
            padding: 15px;
            display: flex;
            gap: 10px;
        }
        
        .input-area input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 20px;
            outline: none;
            font-size: 15px;
        }
        
        .input-area button {
            padding: 12px 25px;
            background: #075e54;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .input-area button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .aviso {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin: 20px;
            border-radius: 5px;
        }
        
        .vazio {
            text-align: center;
            color: #999;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>🤖 Painel de Controle</h2>
        <span>🟢 Online</span>
    </div>
    
    <div class="container">
        <!-- LISTA -->
        <div class="lista" id="lista">
            <div class="vazio">Nenhuma conversa ainda.<br>Envie uma mensagem de teste.</div>
        </div>
        
        <!-- CHAT -->
        <div class="chat">
            <div class="chat-header" id="header" style="display: none;">
                <div class="info">
                    <h3 id="titulo">Selecione uma conversa</h3>
                    <p id="subtitulo">-</p>
                </div>
                <div class="botoes" id="botoes"></div>
            </div>
            
            <div class="mensagens" id="mensagens">
                <div class="vazio">Clique em uma conversa à esquerda</div>
            </div>
            
            <div class="input-area" id="input" style="display: none;">
                <input type="text" id="campo" placeholder="Digite sua mensagem..." onkeypress="if(event.key==='Enter') enviar()">
                <button onclick="enviar()" id="btn-enviar">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        const API = window.location.origin + '/api/webhook';
        let atual = null;
        let intervencaoAtiva = false;
        
        // Carregar conversas a cada 2 segundos
        setInterval(carregar, 2000);
        carregar();
        
        // Se tiver conversa selecionada, recarregar mensagens
        setInterval(() => {
            if (atual) carregarMensagens(atual);
        }, 1500);
        
        async function carregar() {
            try {
                const res = await fetch(`${API}?acao=conversas`);
                const dados = await res.json();
                
                const lista = document.getElementById('lista');
                
                if (dados.length === 0) {
                    lista.innerHTML = '<div class="vazio">Nenhuma conversa ainda.<br>Envie uma mensagem de teste.</div>';
                    return;
                }
                
                lista.innerHTML = '';
                dados.forEach(c => {
                    const div = document.createElement('div');
                    div.className = `conversa ${c.telefone === atual ? 'ativa' : ''} ${c.intervencao ? 'intervencao' : ''}`;
                    div.onclick = () => abrir(c.telefone, c.nome, c.intervencao);
                    
                    div.innerHTML = `
                        <div class="tel">${c.telefone}</div>
                        <div class="nome">${c.nome}</div>
                        <div class="prev">${c.ultima}</div>
                        <span class="tag ${c.intervencao ? 'humano' : 'robo'}">
                            ${c.intervencao ? '🔴 VOCÊ' : '🟢 ROBÔ'}
                        </span>
                    `;
                    
                    lista.appendChild(div);
                });
                
            } catch (e) {
                console.log('Erro ao carregar:', e);
            }
        }
        
        function abrir(telefone, nome, intervencao) {
            atual = telefone;
            intervencaoAtiva = intervencao;
            
            document.getElementById('header').style.display = 'flex';
            document.getElementById('titulo').textContent = telefone;
            document.getElementById('subtitulo').textContent = nome || 'Cliente';
            document.getElementById('input').style.display = 'flex';
            
            atualizarBotoes();
            carregarMensagens(telefone);
        }
        
        function atualizarBotoes() {
            const div = document.getElementById('botoes');
            
            if (intervencaoAtiva) {
                div.innerHTML = `
                    <button class="btn-verde" onclick="liberar()">
                        🤖 LIBERAR ROBÔ
                    </button>
                `;
                document.getElementById('subtitulo').innerHTML += ' <span style="color:#f44336;font-weight:bold">(VOCÊ ESTÁ NO CONTROLE)</span>';
            } else {
                div.innerHTML = `
                    <button class="btn-vermelho" onclick="intervir()">
                        🚨 ASSUMIR CONTROLE
                    </button>
                `;
            }
        }
        
        async function carregarMensagens(telefone) {
            try {
                const res = await fetch(`${API}?acao=mensagens&telefone=${telefone}`);
                const msgs = await res.json();
                
                const area = document.getElementById('mensagens');
                
                if (msgs.length === 0) {
                    area.innerHTML = '<div class="vazio">Nenhuma mensagem ainda</div>';
                    return;
                }
                
                area.innerHTML = '';
                msgs.forEach(m => {
                    const div = document.createElement('div');
                    div.className = `msg ${m.tipo}`;
                    div.innerHTML = `
                        ${m.texto.replace(/\n/g, '<br>')}
                        <div class="hora">${m.nome} • ${m.hora}</div>
                    `;
                    area.appendChild(div);
                });
                
                area.scrollTop = area.scrollHeight;
                
            } catch (e) {
                console.log('Erro mensagens:', e);
            }
        }
        
        async function intervir() {
            if (!atual) return;
            
            try {
                await fetch(`${API}?acao=intervir`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telefone: atual })
                });
                
                intervencaoAtiva = true;
                atualizarBotoes();
                carregarMensagens(atual);
                
            } catch (e) {
                alert('Erro ao assumir controle');
            }
        }
        
        async function liberar() {
            if (!atual) return;
            
            try {
                await fetch(`${API}?acao=liberar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telefone: atual })
                });
                
                intervencaoAtiva = false;
                atualizarBotoes();
                carregarMensagens(atual);
                
            } catch (e) {
                alert('Erro ao liberar');
            }
        }
        
        async function enviar() {
            if (!atual) return;
            
            if (!intervencaoAtiva) {
                alert('⚠️ Clique em "ASSUMIR CONTROLE" primeiro!');
                return;
            }
            
            const campo = document.getElementById('campo');
            const texto = campo.value.trim();
            
            if (!texto) return;
            
            try {
                await fetch(`${API}?acao=enviar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        telefone: atual, 
                        mensagem: texto 
                    })
                });
                
                campo.value = '';
                carregarMensagens(atual);
                
            } catch (e) {
                alert('Erro ao enviar');
            }
        }
    </script>
</body>
</html>
