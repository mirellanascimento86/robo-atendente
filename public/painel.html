<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <title>GloriApp Pro</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        :root {
            --primary: #1a1a2e;
            --primary-dark: #16213e;
            --secondary: #e94560;
            --accent: #0f3460;
            --bg: #0f0f1a;
            --sidebar-bg: #16162a;
            --chat-bg: #0f0f1a;
            --incoming: #242442;
            --outgoing: #e94560;
            --text: #eaeaea;
            --text-secondary: #a0a0b0;
            --border: #2a2a4a;
            --danger: #ff4757;
            --warning: #ffa502;
            --success: #2ed573;
        }
        
        body {
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        
        #loading {
            position: fixed;
            inset: 0;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        #loading.fade-out { opacity: 0; pointer-events: none; }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(233, 69, 96, 0.2);
            border-top-color: var(--secondary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading p { color: var(--text); font-size: 16px; }
        
        #app {
            display: flex;
            height: 100%;
            width: 100%;
        }
        
        .sidebar {
            width: 100%;
            height: 100%;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }
        
        .sidebar.hidden-mobile {
            transform: translateX(-100%);
            position: absolute;
        }
        
        @media (min-width: 900px) {
            .sidebar {
                width: 380px;
                border-right: 1px solid var(--border);
                position: relative;
                transform: none !important;
            }
            .sidebar.hidden-mobile {
                transform: none;
                position: relative;
            }
        }
        
        .header {
            background: var(--sidebar-bg);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }
        .header h1 { 
            font-size: 20px; 
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
        }
        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .icon-btn:hover { background: rgba(233, 69, 96, 0.1); color: var(--secondary); }
        .icon-btn svg { width: 24px; height: 24px; }
        
        .connection-badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 12px;
            background: var(--success);
            color: white;
            font-weight: 600;
        }
        .connection-badge.offline { background: var(--danger); }
        
        .search-container {
            padding: 8px 12px;
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--border);
        }
        .search-box {
            background: var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 8px 12px;
            gap: 10px;
        }
        .search-box input {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 15px;
            outline: none;
        }
        .search-box input::placeholder { color: var(--text-secondary); }
        
        .chat-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 8px 0;
        }
        
        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .chat-item:hover { background: rgba(233, 69, 96, 0.05); }
        .chat-item.active { background: var(--accent); }
        
        .chat-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--secondary) 0%, #ff6b81 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 600;
            color: white;
            margin-right: 14px;
            flex-shrink: 0;
        }
        
        .chat-info {
            flex: 1;
            min-width: 0;
        }
        .chat-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .chat-name {
            font-weight: 500;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
        }
        .chat-time {
            font-size: 12px;
            color: var(--secondary);
            flex-shrink: 0;
        }
        
        .chat-preview {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 8px;
            font-weight: 600;
        }
        .status-indicator.bot { background: rgba(46, 213, 115, 0.15); color: var(--success); }
        .status-indicator.human { background: rgba(233, 69, 96, 0.15); color: var(--secondary); }
        
        .chat-area {
            flex: 1;
            display: none;
            flex-direction: column;
            background: var(--chat-bg);
            width: 100%;
            height: 100%;
        }
        .chat-area.active { display: flex; }
        
        @media (min-width: 900px) {
            .chat-area { display: flex; }
            .chat-area:not(.has-chat) .chat-placeholder { display: flex; }
        }
        
        .chat-header {
            background: var(--sidebar-bg);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            min-height: 60px;
        }
        
        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            min-width: 0;
        }
        
        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: -8px;
        }
        @media (min-width: 900px) { .back-btn { display: none; } }
        
        .chat-title { flex: 1; min-width: 0; }
        .chat-title h3 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-title p {
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .chat-actions {
            display: flex;
            gap: 8px;
        }
        
        .action-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .action-btn.intervene { background: var(--secondary); color: white; }
        .action-btn.release { background: var(--success); color: #111; }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .intervention-banner {
            background: linear-gradient(90deg, var(--secondary), #ff6b81);
            color: white;
            padding: 12px 16px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .intervention-banner.active { display: flex; }
        
        .messages-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            background: var(--chat-bg);
        }
        
        .message {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14.5px;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
        }
        
        .message.incoming {
            background: var(--incoming);
            align-self: flex-start;
            border-top-left-radius: 2px;
            color: var(--text);
        }
        .message.outgoing {
            background: var(--outgoing);
            align-self: flex-end;
            border-top-right-radius: 2px;
            color: white;
        }
        .message.system {
            background: rgba(255, 165, 2, 0.15);
            align-self: center;
            font-size: 12.5px;
            color: var(--warning);
            padding: 8px 16px;
            border-radius: 16px;
            max-width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 165, 2, 0.3);
        }
        
        .message-content { margin-bottom: 4px; }
        
        .message-meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            font-size: 11px;
            opacity: 0.7;
            margin-top: 2px;
        }
        .message.outgoing .message-meta { color: rgba(255,255,255,0.8); }
        
        .date-separator {
            align-self: center;
            background: var(--accent);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
            margin: 16px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .input-container {
            background: var(--sidebar-bg);
            padding: 10px 16px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            border-top: 1px solid var(--border);
        }
        
        .input-wrapper {
            flex: 1;
            background: var(--accent);
            border-radius: 24px;
            padding: 12px 20px;
            max-height: 120px;
            overflow-y: auto;
        }
        
        .input-wrapper input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);
            font-size: 15.5px;
            line-height: 1.4;
        }
        .input-wrapper input::placeholder { color: var(--text-secondary); }
        .input-wrapper input:disabled { opacity: 0.5; }
        
        .send-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: var(--secondary);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .send-btn:hover:not(:disabled) { background: #ff6b81; transform: scale(1.05); }
        .send-btn:active:not(:disabled) { transform: scale(0.95); }
        .send-btn:disabled { background: #374248; cursor: not-allowed; }
        .send-btn svg { width: 24px; height: 24px; margin-left: 2px; }
        
        .chat-placeholder {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            text-align: center;
            padding: 40px;
        }
        .chat-placeholder .lion-icon {
            width: 120px;
            height: 120px;
            margin-bottom: 24px;
            opacity: 0.3;
        }
        .chat-placeholder h3 {
            font-size: 32px;
            font-weight: 300;
            margin-bottom: 16px;
            color: var(--text-secondary);
        }
        .chat-placeholder p { font-size: 14px; max-width: 400px; line-height: 1.6; }
        
        .empty-list {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }
        
        @media (max-width: 899px) {
            .message { max-width: 92%; font-size: 15.5px; }
            .chat-avatar { width: 48px; height: 48px; font-size: 20px; }
            .chat-name { font-size: 15px; }
            .action-btn { padding: 8px 16px; font-size: 13px; }
        }
        
        @supports (-webkit-touch-callout: none) {
            input, textarea { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p>Conectando ao painel...</p>
    </div>

    <div id="app">
        <aside class="sidebar" id="sidebar">
            <div class="header">
                <h1>
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2L14.5 9H22L16 13.5L18.5 21L12 16.5L5.5 21L8 13.5L2 9H9.5L12 2Z"/>
                        <circle cx="12" cy="12" r="3" fill="#e94560"/>
                    </svg>
                    GloriApp Pro
                </h1>
                <div class="header-actions">
                    <span class="connection-badge" id="connectionBadge">Iniciando...</span>
                </div>
            </div>
            
            <div class="search-container">
                <div class="search-box">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#a0a0b0">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Pesquisar..." oninput="app.search(this.value)">
                </div>
            </div>
            
            <div class="chat-list" id="chatList">
                <div class="empty-list">
                    <p>Aguardando conversas...</p>
                </div>
            </div>
        </aside>

        <main class="chat-area" id="chatArea">
            <div class="chat-placeholder" id="chatPlaceholder">
                <svg class="lion-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L14.5 9H22L16 13.5L18.5 21L12 16.5L5.5 21L8 13.5L2 9H9.5L12 2Z"/>
                    <circle cx="12" cy="12" r="3" fill="#e94560"/>
                </svg>
                <h3>GloriApp Web</h3>
                <p>Selecione uma conversa para começar</p>
            </div>

            <div id="activeChat" style="display: none; flex-direction: column; height: 100%;">
                <div class="chat-header">
                    <div class="chat-header-info">
                        <button class="back-btn" onclick="app.closeChat()">←</button>
                        <div class="chat-avatar" id="chatAvatar">👤</div>
                        <div class="chat-title">
                            <h3 id="chatName">-</h3>
                            <p id="chatStatus">-</p>
                        </div>
                    </div>
                    <div class="chat-actions" id="chatActions"></div>
                </div>

                <div class="intervention-banner" id="interventionBanner">
                    <span>⚡</span>
                    <span>Você assumiu o controle - Robô desativado</span>
                </div>

                <div class="messages-container" id="messagesContainer"></div>

                <div class="input-container">
                    <div class="input-wrapper">
                        <input type="text" id="messageInput" placeholder="Digite uma mensagem..." 
                               onkeypress="if(event.key==='Enter') app.sendMessage()" disabled>
                    </div>
                    <button class="send-btn" id="sendBtn" onclick="app.sendMessage()" disabled>
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ==========================================
        // CONFIGURAÇÃO
        // ==========================================
        const CONFIG = {
            WEBHOOK_URL: window.location.origin + '/api/webhook',
            POLL_INTERVAL: 5000,
            CHAT_POLL_INTERVAL: 3000
        };

        // ==========================================
        // APLICAÇÃO
        // ==========================================
        class GloriAppPanel {
            constructor() {
                this.chats = new Map();
                this.currentPhone = null;
                this.isLoadingMessages = false;
                
                this.loadFromStorage();
                this.init();
            }

            init() {
                setTimeout(() => {
                    document.getElementById('loading').classList.add('fade-out');
                }, 500);
                
                this.fetchConversations();
                setInterval(() => this.fetchConversations(), CONFIG.POLL_INTERVAL);
                
                // Poll de mensagens
                setInterval(() => {
                    if (this.currentPhone && !this.isLoadingMessages) {
                        this.fetchMessages(this.currentPhone);
                    }
                }, CONFIG.CHAT_POLL_INTERVAL);
                
                window.addEventListener('beforeunload', () => {
                    this.saveToStorage();
                });
            }

            // ==========================================
            // LOCAL STORAGE
            // ==========================================
            saveToStorage() {
                try {
                    const data = {
                        chats: Array.from(this.chats.entries()),
                        timestamp: Date.now()
                    };
                    localStorage.setItem('gloriapp_panel_data', JSON.stringify(data));
                } catch (e) {
                    console.error('Erro ao salvar:', e);
                }
            }

            loadFromStorage() {
                try {
                    const saved = localStorage.getItem('gloriapp_panel_data');
                    if (saved) {
                        const data = JSON.parse(saved);
                        if (data.chats && Array.isArray(data.chats)) {
                            this.chats = new Map(data.chats);
                        }
                    }
                } catch (e) {
                    console.error('Erro ao carregar:', e);
                }
            }

            // ==========================================
            // BUSCAR CONVERSAS
            // ==========================================
            async fetchConversations() {
                try {
                    this.updateStatus('online');
                    
                    const url = `${CONFIG.WEBHOOK_URL}?action=list&_t=${Date.now()}`;
                    const response = await fetch(url);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                    const data = await response.json();
                    const conversas = data.conversas || data;
                    
                    if (!Array.isArray(conversas)) {
                        throw new Error('Resposta não é array');
                    }
                    
                    conversas.forEach(conv => {
                        const phone = conv.telefone;
                        const existing = this.chats.get(phone);
                        
                        if (!existing) {
                            this.chats.set(phone, {
                                ...conv,
                                messages: []
                            });
                        } else {
                            // Atualizar apenas dados da conversa, NUNCA tocar nas mensagens
                            existing.nome = conv.nome || existing.nome;
                            existing.etapa = conv.etapa;
                            existing.ultimaAtividade = conv.ultimaAtividade;
                            existing.ultima = conv.ultima || existing.ultima;
                            existing.emIntervencao = conv.emIntervencao !== undefined ? conv.emIntervencao : existing.emIntervencao;
                        }
                    });
                    
                    this.renderList();
                    this.saveToStorage();
                    
                } catch (error) {
                    this.updateStatus('offline');
                    console.error('Erro fetchConversations:', error);
                }
            }

            // ==========================================
            // BUSCAR MENSAGENS
            // ==========================================
            async fetchMessages(phone) {
                if (this.isLoadingMessages) return;
                this.isLoadingMessages = true;
                
                try {
                    const url = `${CONFIG.WEBHOOK_URL}?action=messages&phone=${encodeURIComponent(phone)}&_t=${Date.now()}`;
                    const response = await fetch(url);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                    const data = await response.json();
                    const mensagens = data.mensagens || data;
                    
                    if (!Array.isArray(mensagens)) {
                        this.isLoadingMessages = false;
                        return;
                    }
                    
                    const chat = this.chats.get(phone);
                    if (!chat) {
                        this.isLoadingMessages = false;
                        return;
                    }
                    
                    // Processar mensagens do servidor
                    chat.messages = mensagens.map(msg => ({
                        id: msg.id || msg._id || `${phone}_${Date.now()}_${Math.random()}`,
                        mensagem: msg.mensagem || msg.texto || msg.content || msg.message || '',
                        tipo: (msg.tipo || msg.from || 'cliente').toLowerCase(),
                        data: msg.data || msg.timestamp || msg.created_at || new Date().toISOString(),
                        nome: msg.nome || msg.sender || (msg.tipo === 'bot' || msg.from === 'bot' ? 'Robô' : 'Cliente')
                    }));
                    
                    // Ordenar por data
                    chat.messages.sort((a, b) => {
                        return new Date(a.data || 0) - new Date(b.data || 0);
                    });
                    
                    // Renderizar se é o chat atual
                    if (this.currentPhone === phone) {
                        this.renderMessages(chat.messages);
                    }
                    
                    // Atualizar preview
                    if (chat.messages.length > 0) {
                        const last = chat.messages[chat.messages.length - 1];
                        chat.ultima = last.mensagem || 'Nova mensagem';
                        this.renderList();
                    }
                    
                    this.saveToStorage();
                    
                } catch (error) {
                    console.error('Erro fetchMessages:', error);
                } finally {
                    this.isLoadingMessages = false;
                }
            }

            // ==========================================
            // RENDERIZAR LISTA
            // ==========================================
            renderList() {
                const container = document.getElementById('chatList');
                const searchTerm = (document.getElementById('searchInput')?.value || '').toLowerCase();
                
                const chats = Array.from(this.chats.values())
                    .filter(c => !searchTerm || 
                        (c.nome?.toLowerCase().includes(searchTerm)) || 
                        c.telefone.includes(searchTerm))
                    .sort((a, b) => {
                        if (a.emIntervencao && !b.emIntervencao) return -1;
                        if (!a.emIntervencao && b.emIntervencao) return 1;
                        return new Date(b.ultimaAtividade || 0) - new Date(a.ultimaAtividade || 0);
                    });

                if (chats.length === 0) {
                    container.innerHTML = '<div class="empty-list"><p>Aguardando conversas...</p></div>';
                    return;
                }

                container.innerHTML = chats.map(c => {
                    const isActive = c.telefone === this.currentPhone;
                    const time = this.formatTime(c.ultimaAtividade);
                    const lastMessage = c.ultima || (c.messages && c.messages.length > 0 ? 
                        c.messages[c.messages.length - 1].mensagem : 'Sem mensagens');
                    
                    return `
                        <div class="chat-item ${isActive ? 'active' : ''}" 
                             onclick="app.selectChat('${c.telefone}')"
                             data-phone="${c.telefone}">
                            <div class="chat-avatar">${this.getInitials(c.nome)}</div>
                            <div class="chat-info">
                                <div class="chat-header-row">
                                    <span class="chat-name">${c.nome || c.telefone}</span>
                                    <span class="chat-time">${time}</span>
                                </div>
                                <div class="chat-preview">
                                    <span style="flex:1;overflow:hidden;text-overflow:ellipsis;">
                                        ${this.escapeHtml(lastMessage)}
                                    </span>
                                    <span class="status-indicator ${c.emIntervencao ? 'human' : 'bot'}">
                                        ${c.emIntervencao ? '🔴 VOCÊ' : '🤖 BOT'}
                                    </span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // ==========================================
            // SELECIONAR CHAT
            // ==========================================
            selectChat(phone) {
                // Evitar re-selecionar o mesmo chat
                if (this.currentPhone === phone) {
                    if (window.innerWidth < 900) {
                        document.getElementById('sidebar').classList.add('hidden-mobile');
                        document.getElementById('chatArea').classList.add('active', 'has-chat');
                    }
                    return;
                }
                
                this.currentPhone = phone;
                const chat = this.chats.get(phone);
                
                if (!chat) return;

                // UI
                document.getElementById('sidebar').classList.add('hidden-mobile');
                document.getElementById('chatArea').classList.add('active', 'has-chat');
                document.getElementById('chatPlaceholder').style.display = 'none';
                document.getElementById('activeChat').style.display = 'flex';
                
                // Header
                document.getElementById('chatName').textContent = chat.nome || phone;
                document.getElementById('chatAvatar').textContent = this.getInitials(chat.nome);
                
                // Atualizar UI de intervenção
                this.updateInterventionUI(chat);
                
                // Renderizar mensagens se existirem
                if (chat.messages && chat.messages.length > 0) {
                    this.renderMessages(chat.messages);
                } else {
                    document.getElementById('messagesContainer').innerHTML = 
                        '<div style="text-align:center;color:#a0a0b0;padding:40px;">Carregando mensagens...</div>';
                }
                
                // Buscar mensagens atualizadas
                this.fetchMessages(phone);
                
                // Re-renderizar lista
                this.renderList();
            }

            closeChat() {
                this.currentPhone = null;
                document.getElementById('sidebar').classList.remove('hidden-mobile');
                document.getElementById('chatArea').classList.remove('active', 'has-chat');
                document.getElementById('chatPlaceholder').style.display = 'flex';
                document.getElementById('activeChat').style.display = 'none';
                this.renderList();
            }

            // ==========================================
            // ATUALIZAR UI DE INTERVENÇÃO - APENAS UI, NÃO MENSAGENS
            // ==========================================
            updateInterventionUI(chat) {
                const banner = document.getElementById('interventionBanner');
                const input = document.getElementById('messageInput');
                const sendBtn = document.getElementById('sendBtn');
                const actions = document.getElementById('chatActions');
                const status = document.getElementById('chatStatus');
                
                const emIntervencao = chat.emIntervencao === true || chat.emIntervencao === 'true' || chat.emIntervencao === 1;
                
                if (emIntervencao) {
                    banner.classList.add('active');
                    input.disabled = false;
                    sendBtn.disabled = false;
                    input.placeholder = 'Digite uma mensagem...';
                    actions.innerHTML = `<button class="action-btn release" onclick="app.release('${chat.telefone}')">🤖 Liberar Robô</button>`;
                    status.textContent = 'Você está no controle';
                    setTimeout(() => input.focus(), 100);
                } else {
                    banner.classList.remove('active');
                    input.disabled = true;
                    sendBtn.disabled = true;
                    input.placeholder = 'Assuma o controle para responder';
                    actions.innerHTML = `<button class="action-btn intervene" onclick="app.intervene('${chat.telefone}')">🚨 Assumir Controle</button>`;
                    status.textContent = 'Robô ativo';
                }
            }

            // ==========================================
            // RENDERIZAR MENSAGENS
            // ==========================================
            renderMessages(messages) {
                const container = document.getElementById('messagesContainer');
                
                if (!messages || messages.length === 0) {
                    container.innerHTML = '<div style="text-align:center;color:#a0a0b0;padding:40px;">Nenhuma mensagem</div>';
                    return;
                }

                let lastDate = null;
                let html = '';
                
                messages.forEach((msg) => {
                    const msgDate = new Date(msg.data || Date.now()).toDateString();
                    
                    if (msgDate !== lastDate) {
                        html += `<div class="date-separator">${this.formatDate(msg.data)}</div>`;
                        lastDate = msgDate;
                    }
                    
                    const tipo = (msg.tipo || '').toLowerCase();
                    const from = (msg.from || '').toLowerCase();
                    
                    let type = 'incoming';
                    
                    if (tipo === 'bot' || tipo === 'robo' || tipo === 'humano' || tipo === 'atendente' || tipo === 'me') {
                        type = 'outgoing';
                    } else if (from === 'bot' || from === 'robo' || from === 'humano' || from === 'atendente') {
                        type = 'outgoing';
                    } else if (tipo === 'system' || tipo === 'sistema') {
                        type = 'system';
                    }
                    
                    const content = this.escapeHtml(msg.mensagem || '');
                    const time = this.formatTime(msg.data);
                    
                    let sender = 'Cliente';
                    if (type === 'outgoing') {
                        sender = msg.nome || (tipo === 'humano' || from === 'humano' ? 'Você' : 'Robô');
                    }
                    
                    html += `
                        <div class="message ${type}">
                            <div class="message-content">${content}</div>
                            <div class="message-meta">${sender} • ${time}</div>
                        </div>
                    `;
                });
                
                container.innerHTML = html;
                this.scrollToBottom();
            }

            // ==========================================
            // INTERVENÇÃO - APENAS MUDA ESTADO, NÃO TOCA EM MENSAGENS
            // ==========================================
            async intervene(phone) {
                const btn = document.querySelector('.action-btn');
                if (btn) {
                    btn.disabled = true;
                    btn.textContent = '⏳...';
                }
                
                try {
                    const response = await fetch(`${CONFIG.WEBHOOK_URL}?action=intervene`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone: phone })
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                    const result = await response.json();
                    console.log('Intervenção resposta:', result);
                    
                    // Apenas atualizar estado local - NÃO recarregar mensagens
                    const chat = this.chats.get(phone);
                    if (chat) {
                        chat.emIntervencao = true;
                        this.updateInterventionUI(chat);
                        this.renderList();
                        this.saveToStorage();
                    }
                    
                } catch (error) {
                    console.error('Erro intervene:', error);
                    alert('Erro ao assumir controle: ' + error.message);
                    if (btn) {
                        btn.disabled = false;
                        btn.textContent = '🚨 Assumir Controle';
                    }
                }
            }

            async release(phone) {
                const btn = document.querySelector('.action-btn');
                if (btn) {
                    btn.disabled = true;
                    btn.textContent = '⏳...';
                }
                
                try {
                    const response = await fetch(`${CONFIG.WEBHOOK_URL}?action=release`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone: phone })
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                    const result = await response.json();
                    console.log('Release resposta:', result);
                    
                    // Apenas atualizar estado local - NÃO recarregar mensagens
                    const chat = this.chats.get(phone);
                    if (chat) {
                        chat.emIntervencao = false;
                        this.updateInterventionUI(chat);
                        this.renderList();
                        this.saveToStorage();
                    }
                    
                } catch (error) {
                    console.error('Erro release:', error);
                    alert('Erro ao liberar robô: ' + error.message);
                    if (btn) {
                        btn.disabled = false;
                        btn.textContent = '🤖 Liberar Robô';
                    }
                }
            }

            // ==========================================
            // ENVIAR MENSAGEM
            // ==========================================
            async sendMessage() {
                if (!this.currentPhone) return;
                
                const input = document.getElementById('messageInput');
                const text = input.value.trim();
                if (!text) return;
                
                const chat = this.chats.get(this.currentPhone);
                if (!chat) {
                    alert('Chat não encontrado!');
                    return;
                }
                
                // Verificar intervenção
                const emIntervencao = chat.emIntervencao === true || chat.emIntervencao === 'true';
                if (!emIntervencao) {
                    alert('Assuma o controle primeiro!');
                    return;
                }
                
                // Limpar input
                input.value = '';
                
                // Adicionar mensagem localmente imediatamente
                const newMessage = {
                    id: 'local_' + Date.now(),
                    mensagem: text,
                    tipo: 'humano',
                    from: 'humano',
                    data: new Date().toISOString(),
                    nome: 'Você'
                };
                
                if (!chat.messages) chat.messages = [];
                chat.messages.push(newMessage);
                this.renderMessages(chat.messages);
                this.saveToStorage();
                
                try {
                    const response = await fetch(`${CONFIG.WEBHOOK_URL}?action=send`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            phone: this.currentPhone,
                            message: text,
                            tipo: 'humano'
                        })
                    });
                    
                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`HTTP ${response.status}: ${errorText}`);
                    }
                    
                    const result = await response.json();
                    console.log('Mensagem enviada:', result);
                    
                    // Atualizar preview
                    chat.ultima = text;
                    this.renderList();
                    
                    // Recarregar mensagens após 1 segundo
                    setTimeout(() => {
                        this.fetchMessages(this.currentPhone);
                    }, 1000);
                    
                } catch (error) {
                    console.error('Erro enviar:', error);
                    alert('Erro ao enviar: ' + error.message);
                    input.value = text;
                }
            }

            search(term) {
                this.renderList();
            }

            scrollToBottom() {
                const container = document.getElementById('messagesContainer');
                container.scrollTop = container.scrollHeight;
            }

            updateStatus(status) {
                const badge = document.getElementById('connectionBadge');
                badge.className = 'connection-badge ' + (status === 'online' ? '' : 'offline');
                badge.textContent = status === 'online' ? '🟢 Online' : '🔴 Offline';
            }

            getInitials(name) {
                if (!name) return '👤';
                return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
            }

            formatTime(date) {
                if (!date) return '';
                const d = new Date(date);
                return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            }

            formatDate(date) {
                if (!date) return '';
                const d = new Date(date);
                const today = new Date();
                const yesterday = new Date(today);
                yesterday.setDate(yesterday.getDate() - 1);
                
                if (d.toDateString() === today.toDateString()) return 'Hoje';
                if (d.toDateString() === yesterday.toDateString()) return 'Ontem';
                return d.toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' });
            }

            escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // Inicializar
        const app = new GloriAppPanel();
    </script>
</body>
</html>
