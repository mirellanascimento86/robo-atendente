<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#075e54">
    <title>WhatsApp Pro</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        :root {
            --primary: #075e54;
            --primary-dark: #054d44;
            --secondary: #128c7e;
            --accent: #25d366;
            --bg: #0a1014;
            --sidebar-bg: #111b21;
            --chat-bg: #0a1014;
            --incoming: #202c33;
            --outgoing: #005c4b;
            --text: #e9edef;
            --text-secondary: #8696a0;
            --border: #2a3942;
            --danger: #f15c6d;
            --warning: #ffd700;
        }
        
        body {
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        
        /* Loading */
        #loading {
            position: fixed;
            inset: 0;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        #loading.fade-out { opacity: 0; pointer-events: none; }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading p { color: white; font-size: 16px; }
        
        /* Debug Panel */
        #debugPanel {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #ff4444;
            color: white;
            padding: 10px;
            font-size: 12px;
            z-index: 10000;
            display: none;
            max-height: 200px;
            overflow-y: auto;
        }
        #debugPanel.show { display: block; }
        
        /* App Container - Mobile First */
        #app {
            display: flex;
            height: 100%;
            width: 100%;
        }
        
        /* Sidebar */
        .sidebar {
            width: 100%;
            height: 100%;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }
        
        .sidebar.hidden-mobile {
            transform: translateX(-100%);
            position: absolute;
        }
        
        @media (min-width: 900px) {
            .sidebar {
                width: 380px;
                border-right: 1px solid var(--border);
                position: relative;
                transform: none !important;
            }
            .sidebar.hidden-mobile {
                transform: none;
                position: relative;
            }
        }
        
        /* Header */
        .header {
            background: var(--sidebar-bg);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }
        .header h1 { 
            font-size: 20px; 
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }
        .icon-btn svg { width: 24px; height: 24px; }
        
        .connection-badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 12px;
            background: var(--accent);
            color: white;
            font-weight: 600;
        }
        .connection-badge.offline { background: var(--danger); }
        .connection-badge.connecting { background: var(--warning); color: #000; }
        
        /* Search */
        .search-container {
            padding: 8px 12px;
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--border);
        }
        .search-box {
            background: #202c33;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 8px 12px;
            gap: 10px;
        }
        .search-box input {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 15px;
            outline: none;
        }
        .search-box input::placeholder { color: var(--text-secondary); }
        
        /* Chat List */
        .chat-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 8px 0;
        }
        
        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .chat-item:hover { background: rgba(255,255,255,0.05); }
        .chat-item.active { background: #2a3942; }
        
        .chat-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667781 0%, #8696a0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 600;
            color: white;
            margin-right: 14px;
            flex-shrink: 0;
            position: relative;
        }
        .chat-avatar.online::after {
            content: '';
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            background: var(--accent);
            border-radius: 50%;
            border: 2px solid var(--sidebar-bg);
        }
        
        .chat-info {
            flex: 1;
            min-width: 0;
        }
        .chat-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .chat-name {
            font-weight: 500;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
        }
        .chat-time {
            font-size: 12px;
            color: var(--accent);
            flex-shrink: 0;
        }
        .chat-item:not(.unread) .chat-time { color: var(--text-secondary); }
        
        .chat-preview {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-preview.typing { color: var(--accent); font-style: italic; }
        
        .unread-badge {
            background: var(--accent);
            color: white;
            font-size: 12px;
            font-weight: 600;
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
            margin-left: 8px;
        }
        
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 8px;
            font-weight: 600;
        }
        .status-indicator.bot { background: rgba(37, 211, 102, 0.15); color: var(--accent); }
        .status-indicator.human { background: rgba(241, 92, 109, 0.15); color: var(--danger); }
        
        /* Chat Area */
        .chat-area {
            flex: 1;
            display: none;
            flex-direction: column;
            background: var(--chat-bg);
            width: 100%;
            height: 100%;
        }
        .chat-area.active { display: flex; }
        
        @media (min-width: 900px) {
            .chat-area { display: flex; }
            .chat-area:not(.has-chat) .chat-placeholder { display: flex; }
        }
        
        .chat-header {
            background: var(--sidebar-bg);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            min-height: 60px;
        }
        
        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            min-width: 0;
        }
        
        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: -8px;
        }
        @media (min-width: 900px) { .back-btn { display: none; } }
        
        .chat-title { flex: 1; min-width: 0; }
        .chat-title h3 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-title p {
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .chat-actions {
            display: flex;
            gap: 8px;
        }
        
        .action-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .action-btn.intervene { background: var(--danger); color: white; }
        .action-btn.intervene:hover { background: #d94a5b; }
        .action-btn.release { background: var(--accent); color: #111; }
        .action-btn.release:hover { background: #20c05a; }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Intervention Banner */
        .intervention-banner {
            background: linear-gradient(90deg, var(--danger), #ff6b6b);
            color: white;
            padding: 12px 16px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            animation: pulse 2s infinite;
        }
        .intervention-banner.active { display: flex; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        
        /* Messages */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            background-image: url("data:image/svg+xml,%3Csvg width='400' height='400' viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h400v400H0z' fill='%230a1014'/%3E%3Cpath d='M0 0h400v400H0z' fill='none' stroke='%23111b21' stroke-width='2'/%3E%3C/svg%3E");
        }
        
        .message {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14.5px;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
            animation: messageIn 0.3s ease;
        }
        @keyframes messageIn {
            from { opacity: 0; transform: translateY(20px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .message.incoming {
            background: var(--incoming);
            align-self: flex-start;
            border-top-left-radius: 2px;
            color: var(--text);
        }
        .message.outgoing {
            background: var(--outgoing);
            align-self: flex-end;
            border-top-right-radius: 2px;
            color: white;
        }
        .message.system {
            background: rgba(255, 193, 7, 0.15);
            align-self: center;
            font-size: 12.5px;
            color: #ffd700;
            padding: 8px 16px;
            border-radius: 16px;
            max-width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 193, 7, 0.3);
        }
        
        .message-content { margin-bottom: 4px; }
        
        .message-meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            font-size: 11px;
            opacity: 0.7;
            margin-top: 2px;
        }
        .message.outgoing .message-meta { color: #a5f3c5; }
        
        .date-separator {
            align-self: center;
            background: #1e2a30;
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
            margin: 16px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Typing Indicator */
        .typing-container {
            display: none;
            padding: 12px 16px;
            margin-bottom: 8px;
        }
        .typing-container.active { display: block; }
        
        .typing-bubble {
            background: var(--incoming);
            padding: 14px 20px;
            border-radius: 16px;
            border-top-left-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            width: fit-content;
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
        
        /* Input Area */
        .input-container {
            background: var(--sidebar-bg);
            padding: 10px 16px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            border-top: 1px solid var(--border);
        }
        
        .input-wrapper {
            flex: 1;
            background: #2a3942;
            border-radius: 24px;
            padding: 12px 20px;
            max-height: 120px;
            overflow-y: auto;
        }
        
        .input-wrapper input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);
            font-size: 15.5px;
            line-height: 1.4;
        }
        .input-wrapper input::placeholder { color: var(--text-secondary); }
        .input-wrapper input:disabled { opacity: 0.5; }
        
        .send-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: var(--secondary);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .send-btn:hover:not(:disabled) { background: var(--accent); transform: scale(1.05); }
        .send-btn:active:not(:disabled) { transform: scale(0.95); }
        .send-btn:disabled { background: #374248; cursor: not-allowed; }
        .send-btn svg { width: 24px; height: 24px; margin-left: 2px; }
        
        /* Placeholder */
        .chat-placeholder {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            text-align: center;
            padding: 40px;
        }
        .chat-placeholder svg {
            width: 120px;
            height: 120px;
            margin-bottom: 24px;
            opacity: 0.2;
        }
        .chat-placeholder h3 {
            font-size: 32px;
            font-weight: 300;
            margin-bottom: 16px;
            color: var(--text-secondary);
        }
        .chat-placeholder p { font-size: 14px; max-width: 400px; line-height: 1.6; }
        
        /* Empty State List */
        .empty-list {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .empty-list svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374248; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #4a5a63; }
        
        /* Mobile Optimizations */
        @media (max-width: 899px) {
            .message { max-width: 92%; font-size: 15.5px; }
            .chat-avatar { width: 48px; height: 48px; font-size: 20px; }
            .chat-name { font-size: 15px; }
            .action-btn { padding: 8px 16px; font-size: 13px; }
        }
        
        /* Prevent zoom on iOS */
        @supports (-webkit-touch-callout: none) {
            input, textarea { font-size: 16px; }
        }
    </style>
</head>
<body>
    <!-- Debug Panel (pressione Ctrl+D para mostrar) -->
    <div id="debugPanel"></div>
    
    <!-- Loading -->
    <div id="loading">
        <div class="spinner"></div>
        <p>Conectando ao painel...</p>
    </div>

    <div id="app">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="header">
                <h1>
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20.52 3.45A11.83 11.83 0 0 0 12 0 12 12 0 0 0 0 12a12 12 0 0 0 1.74 6.15L0 24l6.33-1.5A12 12 0 0 0 12 24a12 12 0 0 0 12-12 12 12 0 0 0-3.48-8.55zM12 22a9.89 9.89 0 0 1-5-1.35l-.36-.22-3.76.89.89-3.66-.23-.37A10 10 0 0 1 12 2a10 10 0 0 1 10 10 10 10 0 0 1-10 10zm5.4-7.4c-.3-.15-1.77-.87-2.05-1-.27-.1-.47-.15-.67.15s-.77 1-.95 1.2-.35.23-.65.08a8.2 8.2 0 0 1-2.4-1.5 9 9 0 0 1-1.67-2.08c-.17-.3 0-.47.13-.62s.3-.35.45-.53a2 2 0 0 0 .3-.5.55.55 0 0 0 0-.52c-.08-.15-.67-1.6-.92-2.2s-.48-.5-.67-.51h-.57a1.1 1.1 0 0 0-.8.37c-.28.3-1 1-1 2.43s1.03 2.82 1.17 3s1.35 2.06 3.27 2.89 1.9.85 2.25.89a2 2 0 0 0 1.53-.71 1.6 1.6 0 0 0 .36-1.03c0-.15-.12-.27-.4-.42z"/>
                    </svg>
                    WhatsApp Pro
                </h1>
                <div class="header-actions">
                    <span class="connection-badge" id="connectionBadge">Conectando...</span>
                    <button class="icon-btn" onclick="app.toggleDebug()" title="Debug">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                    </button>
                </div>
            </div>
            
            <div class="search-container">
                <div class="search-box">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#8696a0">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Pesquisar ou começar nova conversa" oninput="app.search(this.value)">
                </div>
            </div>
            
            <div class="chat-list" id="chatList">
                <div class="empty-list">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
                    <p>Carregando conversas...</p>
                </div>
            </div>
        </aside>

        <!-- Chat Area -->
        <main class="chat-area" id="chatArea">
            <div class="chat-placeholder" id="chatPlaceholder">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                <h3>WhatsApp Web</h3>
                <p>Envie e receba mensagens sem precisar manter seu celular conectado.<br>Use em até 4 dispositivos e 1 celular simultaneamente.</p>
            </div>

            <div id="activeChat" style="display: none; flex-direction: column; height: 100%;">
                <div class="chat-header">
                    <div class="chat-header-info">
                        <button class="back-btn" onclick="app.closeChat()">←</button>
                        <div class="chat-avatar" id="chatAvatar">👤</div>
                        <div class="chat-title">
                            <h3 id="chatName">-</h3>
                            <p id="chatStatus">-</p>
                        </div>
                    </div>
                    <div class="chat-actions" id="chatActions"></div>
                </div>

                <div class="intervention-banner" id="interventionBanner">
                    <span>⚡</span>
                    <span>Você assumiu o controle - Robô desativado</span>
                </div>

                <div class="messages-container" id="messagesContainer"></div>
                
                <div class="typing-container" id="typingContainer">
                    <div class="typing-bubble">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>

                <div class="input-container">
                    <div class="input-wrapper">
                        <input type="text" id="messageInput" placeholder="Digite uma mensagem" 
                               onkeypress="if(event.key==='Enter') app.sendMessage()" disabled>
                    </div>
                    <button class="send-btn" id="sendBtn" onclick="app.sendMessage()" disabled>
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ==========================================
        // CONFIGURAÇÃO - AJUSTE AQUI SEU WEBHOOK
        // ==========================================
        const CONFIG = {
            // URL do seu webhook RC Reforma
            WEBHOOK_URL: '/api/webhook',
            
            // Intervalo de polling (2 segundos para lista, 1.5s para chat aberto)
            POLL_INTERVAL: 2000,
            CHAT_POLL_INTERVAL: 1500,
            
            // Chave do localStorage
            STORAGE_KEY: 'rc_reforma_panel',
            
            // Para testar sem webhook, mude para true
            USE_MOCK_DATA: true
        };

        // ==========================================
        // CLASSE PRINCIPAL - CONECTADA AO SEU WEBHOOK
        // ==========================================
        class WhatsAppPanel {
            constructor() {
                this.conversations = new Map(); // telefone -> dados
                this.currentPhone = null;
                this.pollingTimer = null;
                this.chatPollingTimer = null;
                this.isOnline = true;
                this.debugMode = false;
                
                this.init();
            }

            async init() {
                console.log('[Painel] Inicializando...');
                
                // Carregar do cache imediatamente
                this.loadFromCache();
                this.renderList();
                
                // Esconder loading
                setTimeout(() => {
                    document.getElementById('loading').classList.add('fade-out');
                }, 500);
                
                // Iniciar
                if (CONFIG.USE_MOCK_DATA) {
                    this.loadMockData();
                } else {
                    this.startPolling();
                }
                
                // Debug com Ctrl+D
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey && e.key === 'd') {
                        e.preventDefault();
                        this.toggleDebug();
                    }
                });
            }

            log(msg, type = 'info') {
                console.log(`[Painel] ${msg}`);
                if (this.debugMode) {
                    const panel = document.getElementById('debugPanel');
                    const time = new Date().toLocaleTimeString();
                    const color = type === 'error' ? '#ff6b6b' : (type === 'success' ? '#4caf50' : 'white');
                    panel.innerHTML += `<div style="color: ${color}; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 2px 0;">[${time}] ${msg}</div>`;
                    panel.scrollTop = panel.scrollHeight;
                }
            }

            toggleDebug() {
                this.debugMode = !this.debugMode;
                document.getElementById('debugPanel').classList.toggle('show', this.debugMode);
                this.log('Debug: ' + (this.debugMode ? 'ON' : 'OFF'));
            }

            loadMockData() {
                // Dados de teste
                const mockConvs = [
                    {
                        telefone: "5511999999999",
                        nome: "João Teste",
                        etapa: "INICIO",
                        emIntervencao: false,
                        ultimaAtividade: new Date().toISOString(),
                        resumo: "Olá, quero uma reforma"
                    }
                ];
                
                mockConvs.forEach(c => {
                    c.messages = [
                        { tipo: 'cliente', mensagem: 'Olá, quero uma reforma', data: new Date().toISOString() }
                    ];
                    this.conversations.set(c.telefone, c);
                });
                
                this.saveToCache();
                this.renderList();
                this.updateConnection('online');
                this.log('Dados de teste carregados', 'success');
            }

            loadFromCache() {
                try {
                    const cached = localStorage.getItem(CONFIG.STORAGE_KEY);
                    if (cached) {
                        const data = JSON.parse(cached);
                        if (data.conversations) {
                            data.conversations.forEach(c => this.conversations.set(c.telefone, c));
                            this.log(`Cache: ${this.conversations.size} conversas`);
                        }
                    }
                } catch (e) {
                    this.log('Erro cache: ' + e.message, 'error');
                }
            }

            saveToCache() {
                try {
                    const data = {
                        conversations: Array.from(this.conversations.values()),
                        savedAt: new Date().toISOString()
                    };
                    localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(data));
                } catch (e) {
                    this.log('Erro ao salvar: ' + e.message, 'error');
                }
            }

            startPolling() {
                this.fetchConversations(); // Primeira imediata
                this.pollingTimer = setInterval(() => this.fetchConversations(), CONFIG.POLL_INTERVAL);
            }

            stopPolling() {
                if (this.pollingTimer) clearInterval(this.pollingTimer);
            }

            startChatPolling(phone) {
                if (this.chatPollingTimer) clearInterval(this.chatPollingTimer);
                this.chatPollingTimer = setInterval(() => {
                    if (this.currentPhone === phone) {
                        this.fetchMessages(phone);
                    }
                }, CONFIG.CHAT_POLL_INTERVAL);
            }

            stopChatPolling() {
                if (this.chatPollingTimer) {
                    clearInterval(this.chatPollingTimer);
                    this.chatPollingTimer = null;
                }
            }

            // ==========================================
            // BUSCAR CONVERSAS DO SEU WEBHOOK
            // ==========================================
            async fetchConversations() {
                try {
                    this.updateConnection('connecting');
                    
                    const response = await fetch(`${CONFIG.WEBHOOK_URL}?action=list&_t=${Date.now()}`);
                    
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    
                    const data = await response.json();
                    this.log('Recebido do webhook: ' + JSON.stringify(data).substring(0, 200), 'success');
                    
                    // Seu webhook retorna { conversas: [...] }
                    const conversas = data.conversas || [];
                    
                    let hasChanges = false;
                    
                    conversas.forEach(conv => {
                        const existing = this.conversations.get(conv.telefone);
                        
                        // Criar ou atualizar
                        if (!existing) {
                            // Nova conversa
                            this.conversations.set(conv.telefone, {
                                ...conv,
                                messages: [],
                                unread: true
                            });
                            hasChanges = true;
                            this.log('Nova conversa: ' + conv.telefone);
                        } else {
                            // Verificar mudanças
                            const changed = 
                                existing.etapa !== conv.etapa ||
                                existing.emIntervencao !== conv.emIntervencao ||
                                existing.ultimaAtividade !== conv.ultimaAtividade;
                            
                            if (changed) {
                                Object.assign(existing, conv);
                                hasChanges = true;
                            }
                            
                            // Se é o chat atual, buscar mensagens
                            if (this.currentPhone === conv.telefone) {
                                this.fetchMessages(conv.telefone);
                            }
                        }
                    });
                    
                    if (hasChanges) {
                        this.saveToCache();
                        this.renderList();
                    }
                    
                    this.updateConnection('online');
                    this.isOnline = true;
                    
                } catch (error) {
                    this.log('Erro: ' + error.message, 'error');
                    this.updateConnection('offline');
                    this.isOnline = false;
                }
            }

            // ==========================================
            // BUSCAR MENSAGENS DO SEU WEBHOOK
            // ==========================================
            async fetchMessages(phone) {
                if (!phone) return;
                
                try {
                    const response = await fetch(`${CONFIG.WEBHOOK_URL}?action=messages&phone=${encodeURIComponent(phone)}&_t=${Date.now()}`);
                    
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    
                    const data = await response.json();
                    
                    // Seu webhook retorna { mensagens: [...], nome, etapa, emIntervencao, ... }
                    const msgs = data.mensagens || [];
                    
                    const conv = this.conversations.get(phone);
                    if (!conv) return;
                    
                    // Atualizar dados da conversa
                    if (data.nome) conv.nome = data.nome;
                    if (data.etapa) conv.etapa = data.etapa;
                    if (data.emIntervencao !== undefined) conv.emIntervencao = data.emIntervencao;
                    
                    // Verificar se há mensagens novas
                    const currentCount = conv.messages?.length || 0;
                    
                    if (msgs.length !== currentCount) {
                        conv.messages = msgs;
                        this.saveToCache();
                        
                        // Se é o chat atual, renderizar
                        if (this.currentPhone === phone) {
                            this.renderMessages(msgs);
                        }
                        
                        // Atualizar preview na lista
                        if (msgs.length > 0) {
                            const last = msgs[msgs.length - 1];
                            conv.resumo = last.mensagem || last.content || 'Nova mensagem';
                            conv.ultimaAtividade = last.data || new Date().toISOString();
                            this.renderList();
                        }
                    }
                    
                } catch (error) {
                    this.log(`Erro mensagens ${phone}: ${error.message}`, 'error');
                }
            }

            updateConnection(status) {
                const badge = document.getElementById('connectionBadge');
                badge.className = 'connection-badge ' + status;
                
                switch(status) {
                    case 'online': badge.textContent = '🟢 Online'; break;
                    case 'offline': badge.textContent = '🔴 Offline'; break;
                    case 'connecting': badge.textContent = '🟡 Atualizando...'; break;
                }
            }

            // ==========================================
            // RENDERIZAR LISTA DE CONVERSAS
            // ==========================================
            renderList() {
                const container = document.getElementById('chatList');
                const searchTerm = (document.getElementById('searchInput')?.value || '').toLowerCase();
                
                const convs = Array.from(this.conversations.values())
                    .filter(c => !searchTerm || 
                        (c.nome?.toLowerCase().includes(searchTerm)) || 
                        c.telefone.includes(searchTerm))
                    .sort((a, b) => {
                        // Intervenções primeiro, depois por data
                        if (a.emIntervencao && !b.emIntervencao) return -1;
                        if (!a.emIntervencao && b.emIntervencao) return 1;
                        return new Date(b.ultimaAtividade || 0) - new Date(a.ultimaAtividade || 0);
                    });

                if (convs.length === 0) {
                    container.innerHTML = `
                        <div class="empty-list">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
                            <p>${this.isOnline ? 'Nenhuma conversa ativa' : 'Modo offline'}</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = convs.map(conv => {
                    const isActive = conv.telefone === this.currentPhone;
                    const isUnread = conv.unread && !isActive;
                    const time = this.formatTime(conv.ultimaAtividade);
                    const preview = conv.resumo || 'Sem mensagens';
                    const isIntervention = conv.emIntervencao;
                    
                    return `
                        <div class="chat-item ${isActive ? 'active' : ''} ${isUnread ? 'unread' : ''}" 
                             onclick="app.openChat('${conv.telefone}')"
                             data-phone="${conv.telefone}">
                            <div class="chat-avatar">${this.getInitials(conv.nome)}</div>
                            <div class="chat-info">
                                <div class="chat-header-row">
                                    <span class="chat-name">${conv.nome || conv.telefone}</span>
                                    <span class="chat-time">${time}</span>
                                </div>
                                <div class="chat-preview">
                                    <span style="flex: 1; overflow: hidden; text-overflow: ellipsis;">
                                        ${isIntervention ? '🔴 ' : ''}${this.escapeHtml(preview.substring(0, 50))}
                                    </span>
                                    <span class="status-indicator ${isIntervention ? 'human' : 'bot'}">
                                        ${isIntervention ? 'VOCÊ' : 'BOT'}
                                    </span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // ==========================================
            // ABRIR CHAT
            // ==========================================
            async openChat(phone) {
                this.log('Abrindo: ' + phone);
                this.currentPhone = phone;
                const conv = this.conversations.get(phone);
                
                if (!conv) {
                    this.log('Conversa não encontrada!', 'error');
                    return;
                }

                // UI
                document.getElementById('sidebar').classList.add('hidden-mobile');
                document.getElementById('chatArea').classList.add('active', 'has-chat');
                document.getElementById('chatPlaceholder').style.display = 'none';
                document.getElementById('activeChat').style.display = 'flex';

                // Header
                document.getElementById('chatName').textContent = conv.nome || phone;
                document.getElementById('chatAvatar').textContent = this.getInitials(conv.nome);
                this.updateChatStatus(conv);

                // Renderizar mensagens do cache imediatamente
                if (conv.messages && conv.messages.length > 0) {
                    this.renderMessages(conv.messages);
                } else {
                    document.getElementById('messagesContainer').innerHTML = '';
                }

                // Buscar mensagens atualizadas
                await this.fetchMessages(phone);

                // Marcar como lida
                conv.unread = false;
                this.renderList();

                // Iniciar polling rápido
                this.startChatPolling(phone);

                // Focar se em intervenção
                if (conv.emIntervencao) {
                    setTimeout(() => document.getElementById('messageInput').focus(), 100);
                }
            }

            closeChat() {
                this.currentPhone = null;
                this.stopChatPolling();
                
                document.getElementById('sidebar').classList.remove('hidden-mobile');
                document.getElementById('chatArea').classList.remove('active', 'has-chat');
                document.getElementById('chatPlaceholder').style.display = 'flex';
                document.getElementById('activeChat').style.display = 'none';
            }

            updateChatStatus(conv) {
                const statusText = conv.emIntervencao ? 
                    '⚠️ Você está no controle' : 
                    `Etapa: ${conv.etapa || 'Início'}`;
                document.getElementById('chatStatus').textContent = statusText;
                
                const banner = document.getElementById('interventionBanner');
                const input = document.getElementById('messageInput');
                const sendBtn = document.getElementById('sendBtn');
                const actions = document.getElementById('chatActions');
                
                if (conv.emIntervencao) {
                    banner.classList.add('active');
                    input.disabled = false;
                    sendBtn.disabled = false;
                    input.placeholder = 'Digite uma mensagem';
                    actions.innerHTML = `
                        <button class="action-btn release" onclick="app.toggleIntervention(false)">
                            🤖 Liberar Robô
                        </button>
                    `;
                } else {
                    banner.classList.remove('active');
                    input.disabled = true;
                    sendBtn.disabled = true;
                    input.placeholder = 'Assuma o controle para responder';
                    actions.innerHTML = `
                        <button class="action-btn intervene" onclick="app.toggleIntervention(true)">
                            🚨 Assumir Controle
                        </button>
                    `;
                }
            }

            // ==========================================
            // RENDERIZAR MENSAGENS
            // ==========================================
            renderMessages(messages) {
                const container = document.getElementById('messagesContainer');
                
                if (!messages || messages.length === 0) {
                    container.innerHTML = '<div style="text-align: center; color: #8696a0; padding: 40px;">Nenhuma mensagem</div>';
                    return;
                }

                let lastDate = null;
                let html = '';
                
                messages.forEach((msg, index) => {
                    const msgDate = new Date(msg.data || msg.timestamp || Date.now()).toDateString();
                    
                    if (msgDate !== lastDate) {
                        html += `<div class="date-separator">${this.formatDate(msg.data || msg.timestamp)}</div>`;
                        lastDate = msgDate;
                    }
                    
                    // Determinar tipo baseado no seu webhook
                    // Seu webhook retorna: tipo: 'cliente' | 'bot' | 'humano' | 'system'
                    let type = 'incoming';
                    let sender = 'Cliente';
                    
                    const tipo = msg.tipo || msg.from;
                    
                    if (tipo === 'bot') {
                        type = 'outgoing';
                        sender = 'Robô';
                    } else if (tipo === 'humano' || tipo === 'me') {
                        type = 'outgoing';
                        sender = 'Você';
                    } else if (tipo === 'system') {
                        type = 'system';
                        sender = 'Sistema';
                    }
                    
                    const time = this.formatTime(msg.data || msg.timestamp);
                    const content = this.escapeHtml(msg.mensagem || msg.content || msg.text || '');
                    
                    html += `
                        <div class="message ${type}" data-id="${msg.id || index}">
                            <div class="message-content">${content}</div>
                            <div class="message-meta">${time}</div>
                        </div>
                    `;
                });
                
                // Só atualizar se mudou
                if (container.innerHTML !== html) {
                    container.innerHTML = html;
                    this.scrollToBottom();
                }
            }

            // ==========================================
            // AÇÕES: INTERVENÇÃO E ENVIAR
            // ==========================================
            async toggleIntervention(takeControl) {
                if (!this.currentPhone) return;
                
                const action = takeControl ? 'intervene' : 'release';
                const btn = document.querySelector('.action-btn');
                
                this.log(`${action}: ${this.currentPhone}`);
                btn.disabled = true;
                btn.textContent = '⏳...';
                
                try {
                    const response = await fetch(`${CONFIG.WEBHOOK_URL}?action=${action}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone: this.currentPhone })
                    });
                    
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    
                    const result = await response.json();
                    this.log('Sucesso: ' + JSON.stringify(result), 'success');
                    
                    // Atualizar localmente
                    const conv = this.conversations.get(this.currentPhone);
                    conv.emIntervencao = takeControl;
                    this.saveToCache();
                    this.updateChatStatus(conv);
                    this.renderList();
                    
                } catch (error) {
                    this.log('Erro: ' + error.message, 'error');
                    alert('Erro ao alterar controle');
                    btn.disabled = false;
                    btn.textContent = takeControl ? '🚨 Assumir Controle' : '🤖 Liberar Robô';
                }
            }

            async sendMessage() {
                if (!this.currentPhone) return;
                
                const input = document.getElementById('messageInput');
                const text = input.value.trim();
                if (!text) return;
                
                const conv = this.conversations.get(this.currentPhone);
                if (!conv.emIntervencao) {
                    alert('Assuma o controle primeiro!');
                    return;
                }
                
                input.value = '';
                
                // Adicionar localmente (otimista)
                const newMsg = {
                    tipo: 'humano',
                    mensagem: text,
                    data: new Date().toISOString()
                };
                
                if (!conv.messages) conv.messages = [];
                conv.messages.push(newMsg);
                this.renderMessages(conv.messages);
                this.saveToCache();
                
                // Enviar para servidor
                try {
                    const response = await fetch(`${CONFIG.WEBHOOK_URL}?action=send`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            phone: this.currentPhone,
                            mensagem: text
                        })
                    });
                    
                    if (!response.ok) throw new Error('Falha ao enviar');
                    
                    // Atualizar preview
                    conv.resumo = text;
                    conv.ultimaAtividade = new Date().toISOString();
                    this.renderList();
                    
                    this.log('Mensagem enviada', 'success');
                    
                } catch (error) {
                    this.log('Erro ao enviar: ' + error.message, 'error');
                    alert('Erro ao enviar. Salvo localmente.');
                }
            }

            search(term) {
                this.renderList();
            }

            scrollToBottom() {
                const container = document.getElementById('messagesContainer');
                container.scrollTop = container.scrollHeight;
            }

            getInitials(name) {
                if (!name) return '👤';
                return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
            }

            formatTime(date) {
                if (!date) return '';
                const d = new Date(date);
                return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            }

            formatDate(date) {
                if (!date) return '';
                const d = new Date(date);
                const today = new Date();
                const yesterday = new Date(today);
                yesterday.setDate(yesterday.getDate() - 1);
                
                if (d.toDateString() === today.toDateString()) return 'Hoje';
                if (d.toDateString() === yesterday.toDateString()) return 'Ontem';
                return d.toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' });
            }

            escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML.replace(/\n/g, '<br>');
            }
        }

        // Inicializar
        const app = new WhatsAppPanel();
    </script>
</body>
</html>
