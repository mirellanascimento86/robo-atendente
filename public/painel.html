<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Controle</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #f0f2f5; height: 100vh; overflow: hidden; }
        
        .header { background: #075e54; color: white; padding: 15px; text-align: center; }
        
        .container { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 50px); }
        
        .lista { background: white; border-right: 1px solid #ddd; overflow-y: auto; }
        
        .conversa { 
            padding: 15px; 
            border-bottom: 1px solid #eee; 
            cursor: pointer;
        }
        .conversa:hover { background: #f5f5f5; }
        .conversa.ativa { background: #e3f2fd; border-left: 4px solid #2196f3; }
        .conversa.intervencao { border-left: 4px solid #f44336; }
        
        .tel { font-weight: bold; color: #075e54; }
        .nome { color: #666; font-size: 12px; }
        .prev { color: #999; font-size: 12px; margin-top: 5px; }
        
        .tag { 
            display: inline-block;
            padding: 2px 8px; 
            border-radius: 10px; 
            font-size: 11px; 
            margin-top: 5px;
        }
        .tag.robo { background: #4caf50; color: white; }
        .tag.humano { background: #f44336; color: white; }
        
        .chat { display: flex; flex-direction: column; background: #e5ddd5; }
        
        .chat-header { 
            background: #f0f0f0; 
            padding: 15px; 
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .botoes button {
            padding: 10px 15px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 10px;
        }
        .btn-intervir { background: #f44336; color: white; }
        .btn-liberar { background: #4caf50; color: white; }
        
        .mensagens { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px;
        }
        
        .msg { 
            max-width: 70%; 
            padding: 10px 15px; 
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .msg.cliente { background: white; margin-right: auto; }
        .msg.robo { background: #dcf8c6; margin-left: auto; }
        .msg.humano { background: #ff6b6b; color: white; margin-left: auto; }
        
        .hora { font-size: 11px; color: #999; margin-top: 5px; text-align: right; }
        .msg.humano .hora { color: rgba(255,255,255,0.8); }
        
        .input-area {
            background: #f0f0f0;
            padding: 15px;
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 20px;
            outline: none;
        }
        .input-area button {
            padding: 12px 25px;
            background: #075e54;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
        .input-area button:disabled { background: #ccc; }
        
        .aviso {
            background: #ff6b6b;
            color: white;
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }
        
        .vazio {
            text-align: center;
            color: #999;
            padding: 50px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>🤖 Painel de Intervenção</h2>
    </div>
    
    <div class="container">
        <div class="lista" id="lista">
            <div class="vazio">Carregando...</div>
        </div>
        
        <div class="chat">
            <div class="chat-header" id="header" style="display: none;">
                <div>
                    <h3 id="titulo">-</h3>
                    <p id="subtitulo">-</p>
                </div>
                <div class="botoes" id="botoes"></div>
            </div>
            
            <div id="aviso" class="aviso" style="display: none;">
                🚨 VOCÊ ESTÁ NO CONTROLE
            </div>
            
            <div class="mensagens" id="mensagens">
                <div class="vazio">Selecione uma conversa</div>
            </div>
            
            <div class="input-area" id="input" style="display: none;">
                <input type="text" id="campo" placeholder="Digite..." onkeypress="if(event.key==='Enter') enviar()">
                <button onclick="enviar()" id="btn-enviar">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        const API = window.location.origin + '/api/webhook';
        let atual = null;
        let intervencao = false;
        
        // Carregar a cada 2 segundos
        setInterval(carregar, 2000);
        carregar();
        
        setInterval(() => {
            if (atual) carregarMsg(atual);
        }, 1500);
        
        async function carregar() {
            try {
                const res = await fetch(API + '?acao=listar');
                const dados = await res.json();
                
                const lista = document.getElementById('lista');
                
                if (dados.length === 0) {
                    lista.innerHTML = '<div class="vazio">Nenhuma conversa.<br>Envie mensagem de teste.</div>';
                    return;
                }
                
                lista.innerHTML = '';
                dados.forEach(c => {
                    const div = document.createElement('div');
                    div.className = `conversa ${c.telefone === atual ? 'ativa' : ''} ${c.intervencao ? 'intervencao' : ''}`;
                    div.onclick = () => abrir(c.telefone, c.nome, c.intervencao);
                    
                    div.innerHTML = `
                        <div class="tel">${c.telefone}</div>
                        <div class="nome">${c.nome}</div>
                        <div class="prev">${c.ultima}</div>
                        <span class="tag ${c.intervencao ? 'humano' : 'robo'}">
                            ${c.intervencao ? '🔴 VOCÊ' : '🟢 ROBÔ'}
                        </span>
                    `;
                    
                    lista.appendChild(div);
                });
                
            } catch (e) {
                console.log('Erro:', e);
            }
        }
        
        function abrir(tel, nome, interv) {
            atual = tel;
            intervencao = interv;
            
            document.getElementById('header').style.display = 'flex';
            document.getElementById('titulo').textContent = tel;
            document.getElementById('subtitulo').textContent = nome || 'Cliente';
            document.getElementById('input').style.display = 'flex';
            
            atualizarBotoes();
            carregarMsg(tel);
        }
        
        function atualizarBotoes() {
            const div = document.getElementById('botoes');
            const aviso = document.getElementById('aviso');
            const campo = document.getElementById('campo');
            const btn = document.getElementById('btn-enviar');
            
            if (intervencao) {
                div.innerHTML = '<button class="btn-liberar" onclick="liberar()">🤖 LIBERAR</button>';
                aviso.style.display = 'block';
                campo.placeholder = 'Digite sua mensagem...';
                campo.disabled = false;
                btn.disabled = false;
            } else {
                div.innerHTML = '<button class="btn-intervir" onclick="intervir()">🚨 ASSUMIR</button>';
                aviso.style.display = 'none';
                campo.placeholder = 'Clique em ASSUMIR primeiro...';
                campo.disabled = true;
                btn.disabled = true;
            }
        }
        
        async function carregarMsg(tel) {
            try {
                const res = await fetch(API + '?acao=mensagens&telefone=' + tel);
                const msgs = await res.json();
                
                const area = document.getElementById('mensagens');
                
                if (msgs.length === 0) {
                    area.innerHTML = '<div class="vazio">Sem mensagens</div>';
                    return;
                }
                
                area.innerHTML = '';
                msgs.forEach(m => {
                    const div = document.createElement('div');
                    div.className = 'msg ' + m.tipo;
                    div.innerHTML = m.texto.replace(/\n/g, '<br>') + 
                        '<div class="hora">' + m.nome + ' • ' + m.hora + '</div>';
                    area.appendChild(div);
                });
                
                area.scrollTop = area.scrollHeight;
                
            } catch (e) {}
        }
        
        async function intervir() {
            if (!atual) return;
            
            try {
                await fetch(API + '?acao=intervir', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telefone: atual })
                });
                
                intervencao = true;
                atualizarBotoes();
                carregarMsg(atual);
                
            } catch (e) {
                alert('Erro');
            }
        }
        
        async function liberar() {
            if (!atual) return;
            
            try {
                await fetch(API + '?acao=liberar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telefone: atual })
                });
                
                intervencao = false;
                atualizarBotoes();
                carregarMsg(atual);
                
            } catch (e) {
                alert('Erro');
            }
        }
        
        async function enviar() {
            if (!atual || !intervencao) {
                alert('Assuma o controle primeiro!');
                return;
            }
            
            const campo = document.getElementById('campo');
            const texto = campo.value.trim();
            if (!texto) return;
            
            campo.value = '';
            
            try {
                await fetch(API + '?acao=enviar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telefone: atual, mensagem: texto })
                });
                
                setTimeout(() => carregarMsg(atual), 500);
                
            } catch (e) {
                campo.value = texto;
                alert('Erro ao enviar');
            }
        }
    </script>
</body>
</html>
