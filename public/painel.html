<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Intervenção</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #f0f2f5;
            height: 100vh;
            overflow: hidden;
        }
        
        .header { 
            background: #075e54; 
            color: white; 
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .container { 
            display: grid; 
            grid-template-columns: 320px 1fr; 
            height: calc(100vh - 60px);
        }
        
        /* LISTA - Estável, não pisca */
        .lista { 
            background: white;
            border-right: 1px solid #ddd;
            overflow-y: auto;
        }
        
        .conversa { 
            padding: 15px; 
            border-bottom: 1px solid #eee; 
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .conversa:hover { background: #f5f5f5; }
        .conversa.ativa { 
            background: #e3f2fd !important; 
            border-left: 4px solid #2196f3; 
        }
        .conversa.intervencao { border-left: 4px solid #f44336; }
        
        .tel { font-weight: bold; color: #075e54; font-size: 14px; }
        .nome { color: #666; font-size: 12px; }
        .prev { color: #999; font-size: 13px; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .tag { 
            display: inline-block;
            padding: 3px 10px; 
            border-radius: 12px; 
            font-size: 11px; 
            margin-top: 8px;
            font-weight: bold;
        }
        .tag.robo { background: #4caf50; color: white; }
        .tag.humano { background: #f44336; color: white; }
        
        /* CHAT */
        .chat { 
            display: flex; 
            flex-direction: column;
            background: #e5ddd5;
        }
        
        .chat-header { 
            background: #f0f0f0; 
            padding: 15px 20px; 
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .botoes button {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 10px;
            font-size: 13px;
        }
        
        .btn-intervir { background: #f44336; color: white; }
        .btn-liberar { background: #4caf50; color: white; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .mensagens { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px;
        }
        
        .msg { 
            max-width: 70%; 
            padding: 10px 14px; 
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        
        .msg.cliente { background: white; margin-right: auto; border-top-left-radius: 2px; }
        .msg.robo { background: #dcf8c6; margin-left: auto; border-top-right-radius: 2px; }
        .msg.humano { background: #ff6b6b; color: white; margin-left: auto; border-top-right-radius: 2px; }
        .msg.sistema { background: #fff3cd; margin: 10px auto; font-size: 12px; color: #856404; padding: 5px 10px; }
        
        .hora { font-size: 11px; color: #999; margin-top: 4px; text-align: right; }
        .msg.humano .hora { color: rgba(255,255,255,0.8); }
        
        .aviso {
            background: #ff6b6b;
            color: white;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 13px;
        }
        
        .input-area {
            background: #f0f0f0;
            padding: 15px;
            display: flex;
            gap: 10px;
        }
        
        .input-area input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 20px;
            outline: none;
            font-size: 15px;
        }
        
        .input-area button {
            padding: 12px 25px;
            background: #075e54;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .input-area button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .vazio {
            text-align: center;
            color: #999;
            padding: 50px;
        }
        
        /* Animação suave */
        .conversa { animation: none !important; }
    </style>
</head>
<body>
    <div class="header">
        <h2>🤖 Painel de Intervenção</h2>
        <span id="status-geral">🟢 Online</span>
    </div>
    
    <div class="container">
        <div class="lista" id="lista">
            <div class="vazio">Carregando...</div>
        </div>
        
        <div class="chat">
            <div class="chat-header" id="header" style="display: none;">
                <div>
                    <h3 id="titulo">-</h3>
                    <p id="subtitulo">-</p>
                </div>
                <div class="botoes" id="botoes"></div>
            </div>
            
            <div id="aviso" class="aviso" style="display: none;">
                🚨 VOCÊ ESTÁ NO CONTROLE - Robô não responde
            </div>
            
            <div class="mensagens" id="mensagens">
                <div class="vazio">Selecione uma conversa</div>
            </div>
            
            <div class="input-area" id="input" style="display: none;">
                <input type="text" id="campo" placeholder="Digite..." onkeypress="if(event.key==='Enter') enviar()">
                <button onclick="enviar()" id="btn-enviar">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        const API = window.location.origin + '/api/webhook';
        
        // Estado local
        let atual = null;
        let intervencao = false;
        let ultimaAtividade = 0; // Para detectar novas mensagens
        
        // Cache de conversas (evita re-render desnecessário)
        let cacheConversas = [];
        
        // Carregar conversas a cada 3 segundos (menos frequente)
        setInterval(carregarConversas, 3000);
        carregarConversas();
        
        // Carregar mensagens da conversa atual a cada 1.5s
        setInterval(() => {
            if (atual) carregarMensagens(atual);
        }, 1500);
        
        async function carregarConversas() {
            try {
                const res = await fetch(API + '?acao=listar');
                const dados = await res.json();
                
                // Verificar se mudou algo significativo (evita piscar)
                const mudou = JSON.stringify(dados.map(d => d.telefone + d.intervencao + d.ultima)) !== 
                              JSON.stringify(cacheConversas.map(d => d.telefone + d.intervencao + d.ultima));
                
                if (!mudou && cacheConversas.length > 0) {
                    // Não mudou nada, não re-renderiza
                    return;
                }
                
                cacheConversas = dados;
                
                const lista = document.getElementById('lista');
                
                if (dados.length === 0) {
                    lista.innerHTML = '<div class="vazio" style="padding:40px">Nenhuma conversa.<br>Envie mensagem de teste.</div>';
                    return;
                }
                
                // Preservar elemento selecionado para não piscar
                const html = dados.map(c => {
                    const isAtiva = c.telefone === atual;
                    const classe = `conversa ${isAtiva ? 'ativa' : ''} ${c.intervencao ? 'intervencao' : ''}`;
                    
                    return `
                        <div class="${classe}" onclick="selecionar('${c.telefone}', '${c.nome}', ${c.intervencao}, ${c.ultimaAtividade})" data-tel="${c.telefone}">
                            <div class="tel">${c.telefone}</div>
                            <div class="nome">${c.nome}</div>
                            <div class="prev">${c.ultima}</div>
                            <span class="tag ${c.intervencao ? 'humano' : 'robo'}">
                                ${c.intervencao ? '🔴 VOCÊ' : '🟢 ROBÔ'}
                            </span>
                        </div>
                    `;
                }).join('');
                
                // Só atualizar se mudou
                if (lista.innerHTML !== html) {
                    lista.innerHTML = html;
                }
                
            } catch (e) {
                console.log('Erro carregar:', e);
            }
        }
        
        function selecionar(telefone, nome, interv, atividade) {
            // Se já está selecionado e atividade não mudou, não faz nada
            if (telefone === atual && atividade === ultimaAtividade) {
                return;
            }
            
            atual = telefone;
            intervencao = interv;
            ultimaAtividade = atividade;
            
            // Atualizar classes visuais
            document.querySelectorAll('.conversa').forEach(el => {
                el.classList.remove('ativa');
                if (el.dataset.tel === telefone) {
                    el.classList.add('ativa');
                }
            });
            
            document.getElementById('header').style.display = 'flex';
            document.getElementById('titulo').textContent = telefone;
            document.getElementById('subtitulo').textContent = nome || 'Cliente';
            document.getElementById('input').style.display = 'flex';
            
            atualizarBotoes();
            carregarMensagens(telefone);
        }
        
        function atualizarBotoes() {
            const div = document.getElementById('botoes');
            const aviso = document.getElementById('aviso');
            const campo = document.getElementById('campo');
            const btn = document.getElementById('btn-enviar');
            
            if (intervencao) {
                div.innerHTML = '<button class="btn-liberar" onclick="liberar()">🤖 LIBERAR ROBÔ</button>';
                aviso.style.display = 'block';
                campo.placeholder = 'Você no controle - digite sua mensagem...';
                campo.disabled = false;
                btn.disabled = false;
            } else {
                div.innerHTML = '<button class="btn-intervir" onclick="intervir()">🚨 ASSUMIR CONTROLE</button>';
                aviso.style.display = 'none';
                campo.placeholder = 'Clique em ASSUMIR CONTROLE primeiro...';
                campo.disabled = true;
                btn.disabled = true;
            }
        }
        
        async function carregarMensagens(tel) {
            try {
                const res = await fetch(API + '?acao=mensagens&telefone=' + tel);
                const msgs = await res.json();
                
                const area = document.getElementById('mensagens');
                
                // Verificar se mudou
                const atualHtml = area.innerHTML;
                const novoHtml = msgs.map(m => `
                    <div class="msg ${m.tipo}">
                        ${m.texto.replace(/\n/g, '<br>')}
                        <div class="hora">${m.nome} • ${m.hora}</div>
                    </div>
                `).join('');
                
                // Só atualizar se mudou (evita flicker)
                if (novoHtml !== atualHtml) {
                    area.innerHTML = novoHtml;
                    area.scrollTop = area.scrollHeight;
                }
                
            } catch (e) {}
        }
        
        async function intervir() {
            if (!atual) return;
            
            const btn = document.querySelector('.btn-intervir');
            btn.textContent = '⏳...';
            btn.disabled = true;
            
            try {
                const res = await fetch(API + '?acao=intervir', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telefone: atual })
                });
                
                const result = await res.json();
                
                if (result.ok) {
                    intervencao = true;
                    atualizarBotoes();
                    carregarMensagens(atual);
                    // Recarregar lista para mostrar mudança
                    setTimeout(carregarConversas, 500);
                } else {
                    alert('Erro: ' + (result.erro || 'Desconhecido'));
                    btn.textContent = '🚨 ASSUMIR CONTROLE';
                    btn.disabled = false;
                }
                
            } catch (e) {
                alert('Erro de conexão');
                btn.textContent = '🚨 ASSUMIR CONTROLE';
                btn.disabled = false;
            }
        }
        
        async function liberar() {
            if (!atual) return;
            
            const btn = document.querySelector('.btn-liberar');
            btn.textContent = '⏳...';
            btn.disabled = true;
            
            try {
                const res = await fetch(API + '?acao=liberar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telefone: atual })
                });
                
                const result = await res.json();
                
                if (result.ok) {
                    intervencao = false;
                    atualizarBotoes();
                    carregarMensagens(atual);
                    setTimeout(carregarConversas, 500);
                }
                
            } catch (e) {
                alert('Erro de conexão');
            }
        }
        
        async function enviar() {
            if (!atual || !intervencao) {
                alert('Assuma o controle primeiro!');
                return;
            }
            
            const campo = document.getElementById('campo');
            const texto = campo.value.trim();
            if (!texto) return;
            
            campo.value = '';
            
            try {
                const res = await fetch(API + '?acao=enviar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telefone: atual, mensagem: texto })
                });
                
                const result = await res.json();
                
                if (result.ok) {
                    // Aguardar um pouco e recarregar
                    setTimeout(() => carregarMensagens(atual), 300);
                } else {
                    alert('Erro: ' + (result.erro || 'Não foi possível enviar'));
                    campo.value = texto;
                }
                
            } catch (e) {
                alert('Erro de conexão');
                campo.value = texto;
            }
        }
    </script>
</body>
</html>
