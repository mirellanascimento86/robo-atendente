<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#075e54">
    <title>WhatsApp Pro</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        :root {
            --primary: #075e54;
            --primary-dark: #054d44;
            --secondary: #128c7e;
            --accent: #25d366;
            --bg: #0a1014;
            --sidebar-bg: #111b21;
            --chat-bg: #0a1014;
            --incoming: #202c33;
            --outgoing: #005c4b;
            --text: #e9edef;
            --text-secondary: #8696a0;
            --border: #2a3942;
            --danger: #f15c6d;
            --warning: #ffd700;
        }
        
        body {
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        
        #loading {
            position: fixed;
            inset: 0;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        #loading.fade-out { opacity: 0; pointer-events: none; }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading p { color: white; font-size: 16px; }
        
        #debugPanel {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #ff4444;
            color: white;
            padding: 10px;
            font-size: 12px;
            z-index: 10000;
            display: none;
            max-height: 150px;
            overflow-y: auto;
        }
        #debugPanel.show { display: block; }
        
        #app {
            display: flex;
            height: 100%;
            width: 100%;
        }
        
        .sidebar {
            width: 100%;
            height: 100%;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }
        
        .sidebar.hidden-mobile {
            transform: translateX(-100%);
            position: absolute;
        }
        
        @media (min-width: 900px) {
            .sidebar {
                width: 380px;
                border-right: 1px solid var(--border);
                position: relative;
                transform: none !important;
            }
            .sidebar.hidden-mobile {
                transform: none;
                position: relative;
            }
        }
        
        .header {
            background: var(--sidebar-bg);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }
        .header h1 { 
            font-size: 20px; 
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }
        .icon-btn svg { width: 24px; height: 24px; }
        
        .connection-badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 12px;
            background: var(--accent);
            color: white;
            font-weight: 600;
        }
        .connection-badge.offline { background: var(--danger); }
        
        .search-container {
            padding: 8px 12px;
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--border);
        }
        .search-box {
            background: #202c33;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 8px 12px;
            gap: 10px;
        }
        .search-box input {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 15px;
            outline: none;
        }
        .search-box input::placeholder { color: var(--text-secondary); }
        
        .chat-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 8px 0;
        }
        
        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .chat-item:hover { background: rgba(255,255,255,0.05); }
        .chat-item.active { background: #2a3942; }
        
        .chat-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667781 0%, #8696a0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 600;
            color: white;
            margin-right: 14px;
            flex-shrink: 0;
        }
        
        .chat-info {
            flex: 1;
            min-width: 0;
        }
        .chat-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .chat-name {
            font-weight: 500;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
        }
        .chat-time {
            font-size: 12px;
            color: var(--accent);
            flex-shrink: 0;
        }
        
        .chat-preview {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 8px;
            font-weight: 600;
        }
        .status-indicator.bot { background: rgba(37, 211, 102, 0.15); color: var(--accent); }
        .status-indicator.human { background: rgba(241, 92, 109, 0.15); color: var(--danger); }
        
        .chat-area {
            flex: 1;
            display: none;
            flex-direction: column;
            background: var(--chat-bg);
            width: 100%;
            height: 100%;
        }
        .chat-area.active { display: flex; }
        
        @media (min-width: 900px) {
            .chat-area { display: flex; }
            .chat-area:not(.has-chat) .chat-placeholder { display: flex; }
        }
        
        .chat-header {
            background: var(--sidebar-bg);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            min-height: 60px;
        }
        
        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            min-width: 0;
        }
        
        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: -8px;
        }
        @media (min-width: 900px) { .back-btn { display: none; } }
        
        .chat-title { flex: 1; min-width: 0; }
        .chat-title h3 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-title p {
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .chat-actions {
            display: flex;
            gap: 8px;
        }
        
        .action-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .action-btn.intervene { background: var(--danger); color: white; }
        .action-btn.release { background: var(--accent); color: #111; }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .intervention-banner {
            background: linear-gradient(90deg, var(--danger), #ff6b6b);
            color: white;
            padding: 12px 16px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .intervention-banner.active { display: flex; }
        
        .messages-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            background-image: url("data:image/svg+xml,%3Csvg width='400' height='400' viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h400v400H0z' fill='%230a1014'/%3E%3Cpath d='M0 0h400v400H0z' fill='none' stroke='%23111b21' stroke-width='2'/%3E%3C/svg%3E");
        }
        
        .message {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14.5px;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
            animation: messageIn 0.3s ease;
        }
        @keyframes messageIn {
            from { opacity: 0; transform: translateY(20px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .message.incoming {
            background: var(--incoming);
            align-self: flex-start;
            border-top-left-radius: 2px;
            color: var(--text);
        }
        .message.outgoing {
            background: var(--outgoing);
            align-self: flex-end;
            border-top-right-radius: 2px;
            color: white;
        }
        .message.system {
            background: rgba(255, 193, 7, 0.15);
            align-self: center;
            font-size: 12.5px;
            color: #ffd700;
            padding: 8px 16px;
            border-radius: 16px;
            max-width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 193, 7, 0.3);
        }
        
        .message-content { margin-bottom: 4px; }
        
        .message-meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            font-size: 11px;
            opacity: 0.7;
            margin-top: 2px;
        }
        .message.outgoing .message-meta { color: #a5f3c5; }
        
        .date-separator {
            align-self: center;
            background: #1e2a30;
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
            margin: 16px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .input-container {
            background: var(--sidebar-bg);
            padding: 10px 16px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            border-top: 1px solid var(--border);
        }
        
        .input-wrapper {
            flex: 1;
            background: #2a3942;
            border-radius: 24px;
            padding: 12px 20px;
            max-height: 120px;
            overflow-y: auto;
        }
        
        .input-wrapper input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);
            font-size: 15.5px;
            line-height: 1.4;
        }
        .input-wrapper input::placeholder { color: var(--text-secondary); }
        .input-wrapper input:disabled { opacity: 0.5; }
        
        .send-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: var(--secondary);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .send-btn:hover:not(:disabled) { background: var(--accent); transform: scale(1.05); }
        .send-btn:active:not(:disabled) { transform: scale(0.95); }
        .send-btn:disabled { background: #374248; cursor: not-allowed; }
        .send-btn svg { width: 24px; height: 24px; margin-left: 2px; }
        
        .chat-placeholder {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            text-align: center;
            padding: 40px;
        }
        .chat-placeholder svg {
            width: 120px;
            height: 120px;
            margin-bottom: 24px;
            opacity: 0.2;
        }
        .chat-placeholder h3 {
            font-size: 32px;
            font-weight: 300;
            margin-bottom: 16px;
            color: var(--text-secondary);
        }
        .chat-placeholder p { font-size: 14px; max-width: 400px; line-height: 1.6; }
        
        .empty-list {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374248; border-radius: 3px; }
        
        @media (max-width: 899px) {
            .message { max-width: 92%; font-size: 15.5px; }
            .chat-avatar { width: 48px; height: 48px; font-size: 20px; }
            .chat-name { font-size: 15px; }
            .action-btn { padding: 8px 16px; font-size: 13px; }
        }
        
        @supports (-webkit-touch-callout: none) {
            input, textarea { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div id="debugPanel"></div>
    
    <div id="loading">
        <div class="spinner"></div>
        <p>Conectando ao painel...</p>
    </div>

    <div id="app">
        <aside class="sidebar" id="sidebar">
            <div class="header">
                <h1>
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20.52 3.45A11.83 11.83 0 0 0 12 0 12 12 0 0 0 0 12a12 12 0 0 0 1.74 6.15L0 24l6.33-1.5A12 12 0 0 0 12 24a12 12 0 0 0 12-12 12 12 0 0 0-3.48-8.55zM12 22a9.89 9.89 0 0 1-5-1.35l-.36-.22-3.76.89.89-3.66-.23-.37A10 10 0 0 1 12 2a10 10 0 0 1 10 10 10 10 0 0 1-10 10zm5.4-7.4c-.3-.15-1.77-.87-2.05-1-.27-.1-.47-.15-.67.15s-.77 1-.95 1.2-.35.23-.65.08a8.2 8.2 0 0 1-2.4-1.5 9 9 0 0 1-1.67-2.08c-.17-.3 0-.47.13-.62s.3-.35.45-.53a2 2 0 0 0 .3-.5.55.55 0 0 0 0-.52c-.08-.15-.67-1.6-.92-2.2s-.48-.5-.67-.51h-.57a1.1 1.1 0 0 0-.8.37c-.28.3-1 1-1 2.43s1.03 2.82 1.17 3s1.35 2.06 3.27 2.89 1.9.85 2.25.89a2 2 0 0 0 1.53-.71 1.6 1.6 0 0 0 .36-1.03c0-.15-.12-.27-.4-.42z"/>
                    </svg>
                    WhatsApp Pro
                </h1>
                <div class="header-actions">
                    <span class="connection-badge" id="connectionBadge">Iniciando...</span>
                    <button class="icon-btn" onclick="app.toggleDebug()" title="Debug">🐛</button>
                </div>
            </div>
            
            <div class="search-container">
                <div class="search-box">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#8696a0">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Pesquisar..." oninput="app.search(this.value)">
                </div>
            </div>
            
            <div class="chat-list" id="chatList">
                <div class="empty-list">
                    <p>Carregando...</p>
                </div>
            </div>
        </aside>

        <main class="chat-area" id="chatArea">
            <div class="chat-placeholder" id="chatPlaceholder">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                <h3>WhatsApp Web</h3>
                <p>Selecione uma conversa para começar</p>
            </div>

            <div id="activeChat" style="display: none; flex-direction: column; height: 100%;">
                <div class="chat-header">
                    <div class="chat-header-info">
                        <button class="back-btn" onclick="app.closeChat()">←</button>
                        <div class="chat-avatar" id="chatAvatar">👤</div>
                        <div class="chat-title">
                            <h3 id="chatName">-</h3>
                            <p id="chatStatus">-</p>
                        </div>
                    </div>
                    <div class="chat-actions" id="chatActions"></div>
                </div>

                <div class="intervention-banner" id="interventionBanner">
                    <span>⚡</span>
                    <span>Você assumiu o controle - Robô desativado</span>
                </div>

                <div class="messages-container" id="messagesContainer"></div>

                <div class="input-container">
                    <div class="input-wrapper">
                        <input type="text" id="messageInput" placeholder="Digite uma mensagem..." 
                               onkeypress="if(event.key==='Enter') app.sendMessage()" disabled>
                    </div>
                    <button class="send-btn" id="sendBtn" onclick="app.sendMessage()" disabled>
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
    const CONFIG = {
        WEBHOOK_URL: window.location.origin + '/api/webhook',
        POLL_INTERVAL: 3000,
        CHAT_POLL_INTERVAL: 1500,
        DEBUG: true   // mantenha true por enquanto para ver logs
    };

    class WhatsAppPanel {
        constructor() {
            this.chats = new Map();
            this.currentPhone = null;
            this.debugMode = true;
            this.lastMessageCount = new Map();
            
            this.init();
        }

        init() {
            setTimeout(() => document.getElementById('loading').classList.add('fade-out'), 600);
            this.fetchConversations();
            setInterval(() => this.fetchConversations(), CONFIG.POLL_INTERVAL);
            
            setInterval(() => {
                if (this.currentPhone) this.fetchMessages(this.currentPhone);
            }, CONFIG.CHAT_POLL_INTERVAL);
        }

        log(msg, type = 'info') {
            console.log(`[Painel] ${msg}`);
            if (this.debugMode) {
                const panel = document.getElementById('debugPanel');
                panel.style.display = 'block';
                const time = new Date().toLocaleTimeString();
                panel.innerHTML += `<div>[${time}] ${msg}</div>`;
                panel.scrollTop = panel.scrollHeight;
            }
        }

        async fetchConversations() {
            try {
                const res = await fetch(`${CONFIG.WEBHOOK_URL}?action=list&_t=${Date.now()}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const conversas = data.conversas || data || [];

                conversas.forEach(conv => {
                    const phone = conv.telefone;
                    let chat = this.chats.get(phone) || { messages: [], telefone: phone };
                    Object.assign(chat, conv);
                    this.chats.set(phone, chat);
                });

                this.renderList();
            } catch (e) {
                this.log('Erro ao buscar conversas: ' + e.message, 'error');
            }
        }

        async fetchMessages(phone) {
            if (!phone) return;
            try {
                const res = await fetch(`${CONFIG.WEBHOOK_URL}?action=messages&phone=${encodeURIComponent(phone)}&_t=${Date.now()}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const mensagens = data.mensagens || data || [];

                const chat = this.chats.get(phone);
                if (chat) chat.messages = mensagens;

                if (this.currentPhone === phone) {
                    this.renderMessages(mensagens);
                }
                if (mensagens.length > 0) {
                    chat.ultima = mensagens[mensagens.length-1].mensagem || mensagens[mensagens.length-1].texto || '';
                    this.renderList();
                }
            } catch (e) {
                this.log('Erro mensagens: ' + e.message);
            }
        }

        async intervene(phone) {
            try {
                this.log(`Tentando assumir controle de ${phone}`);
                const res = await fetch(`${CONFIG.WEBHOOK_URL}?action=intervene`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ phone })
                });

                const result = await res.json().catch(() => ({}));
                this.log('Resposta intervene: ' + JSON.stringify(result));

                if (!res.ok) {
                    throw new Error(result.error || result.message || `HTTP ${res.status}`);
                }

                // Força atualização completa
                const chat = this.chats.get(phone);
                if (chat) chat.emIntervencao = true;
                
                this.selectChat(phone);   // recarrega tudo
                this.log('Controle assumido com sucesso', 'success');

            } catch (error) {
                this.log('Falha ao assumir controle: ' + error.message, 'error');
                alert('Erro ao assumir controle:\n' + error.message);
            }
        }

        async release(phone) {
            try {
                await fetch(`${CONFIG.WEBHOOK_URL}?action=release`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ phone })
                });
                const chat = this.chats.get(phone);
                if (chat) chat.emIntervencao = false;
                this.selectChat(phone);
            } catch (e) {
                alert('Erro ao liberar robô');
            }
        }

        async sendMessage() {
            if (!this.currentPhone) return;
            
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            const chat = this.chats.get(this.currentPhone);
            if (!chat || !chat.emIntervencao) {
                alert('Você precisa assumir o controle primeiro!');
                return;
            }

            const original = text;
            input.value = '';

            try {
                const res = await fetch(`${CONFIG.WEBHOOK_URL}?action=send`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ phone: this.currentPhone, message: original })
                });

                let result;
                try { result = await res.json(); } catch (_) { result = {}; }

                if (!res.ok) {
                    throw new Error(result.error || result.message || `HTTP ${res.status}`);
                }

                this.log('Mensagem enviada com sucesso');
                setTimeout(() => this.fetchMessages(this.currentPhone), 500);

            } catch (error) {
                this.log('Erro send: ' + error.message, 'error');
                alert(`Erro ao enviar mensagem:\n\n${error.message}\n\nVerifique os logs no Vercel.`);
                input.value = original;
            }
        }

        // renderList, selectChat, updateUI, renderMessages, etc. permanecem iguais ao código anterior que eu te passei
        // (para não repetir tudo aqui, mantenha as funções de renderização do código anterior)

        // ... (coloque aqui as funções renderList, selectChat, updateUI, renderMessages, scrollToBottom, etc. do código que enviei na resposta anterior)

        updateStatus(status) {
            const badge = document.getElementById('connectionBadge');
            badge.className = 'connection-badge ' + (status === 'online' ? '' : 'offline');
            badge.textContent = status === 'online' ? 'Online' : 'Offline';
        }
    }

    const app = new WhatsAppPanel();
</script>
</body>
</html>
