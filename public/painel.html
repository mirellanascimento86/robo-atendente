<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#075e54">
    <title>Painel de Atendimento</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        :root {
            --primary: #075e54;
            --primary-dark: #054d44;
            --secondary: #128c7e;
            --accent: #25d366;
            --bg: #dadbd3;
            --chat-bg: #e5ddd5;
            --incoming: #ffffff;
            --outgoing: #dcf8c6;
            --text: #111b21;
            --text-secondary: #667781;
            --border: #d1d7db;
            --danger: #ea4335;
            --warning: #ffa500;
        }
        
        body {
            background: var(--bg);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        
        /* Loading */
        #loading {
            position: fixed;
            inset: 0;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: white;
        }
        #loading.hide { display: none; }
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* App Layout */
        #app {
            display: grid;
            grid-template-columns: 100% 100%;
            height: 100%;
            transition: transform 0.3s ease;
        }
        #app.chat-open { transform: translateX(-100%); }
        
        @media (min-width: 1024px) {
            #app {
                grid-template-columns: 350px 1fr;
                transform: none !important;
            }
        }
        
        /* Sidebar */
        .sidebar {
            background: white;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }
        
        .header {
            background: var(--primary);
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 { font-size: 18px; font-weight: 600; }
        
        .search-box {
            padding: 10px;
            background: #f0f2f5;
        }
        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border: none;
            border-radius: 20px;
            font-size: 15px;
            outline: none;
        }
        
        /* Chat List */
        .chat-list {
            flex: 1;
            overflow-y: auto;
            background: white;
        }
        
        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
            position: relative;
        }
        .chat-item:hover { background: #f5f5f5; }
        .chat-item.active { background: #e3f2fd; }
        .chat-item.unread { font-weight: 600; }
        .chat-item.unread::after {
            content: '';
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
        }
        
        .chat-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #dfe5e7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-right: 12px;
            flex-shrink: 0;
        }
        
        .chat-info { flex: 1; min-width: 0; }
        .chat-header-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .chat-name {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-time { font-size: 12px; color: var(--text-secondary); }
        .chat-preview {
            font-size: 14px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .status-badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-badge.bot { background: #e8f5e9; color: #2e7d32; }
        .status-badge.human { background: #ffebee; color: #c62828; }
        
        /* Chat Area */
        .chat-area {
            display: flex;
            flex-direction: column;
            background: var(--chat-bg);
            position: relative;
        }
        
        .chat-header {
            background: var(--primary);
            color: white;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        
        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
            margin: -5px;
        }
        @media (min-width: 1024px) { .back-btn { display: none; } }
        
        .chat-title h3 { font-size: 16px; margin-bottom: 2px; }
        .chat-title p { font-size: 13px; opacity: 0.9; }
        
        .intervention-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .intervention-btn.take { background: var(--danger); color: white; }
        .intervention-btn.release { background: var(--accent); color: white; }
        .intervention-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        /* Messages */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .message {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14.5px;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .message.incoming {
            background: var(--incoming);
            align-self: flex-start;
            border-top-left-radius: 2px;
        }
        .message.outgoing {
            background: var(--outgoing);
            align-self: flex-end;
            border-top-right-radius: 2px;
        }
        .message.system {
            background: rgba(255, 193, 7, 0.2);
            align-self: center;
            font-size: 12px;
            padding: 6px 12px;
            color: #856404;
        }
        
        .message-meta {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
            text-align: right;
        }
        .message.outgoing .message-meta { color: #4caf50; }
        
        .date-separator {
            align-self: center;
            background: rgba(0,0,0,0.1);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            margin: 10px 0;
        }
        
        /* Input */
        .input-container {
            background: #f0f0f0;
            padding: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .input-container input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 20px;
            font-size: 15px;
            outline: none;
        }
        .input-container button {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            background: var(--secondary);
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-container button:disabled { background: #ccc; }
        
        .intervention-banner {
            background: var(--danger);
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            display: none;
        }
        .intervention-banner.active { display: block; }
        
        /* Empty State */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            text-align: center;
            padding: 40px;
        }
        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 3px; }
        
        /* Mobile */
        @media (max-width: 1023px) {
            .message { max-width: 90%; font-size: 15px; }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p>Iniciando Painel...</p>
    </div>

    <div id="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="header">
                <h1>💬 Atendimentos</h1>
                <span id="connectionStatus" style="font-size: 12px; opacity: 0.8;">🟢 Online</span>
            </div>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Pesquisar conversas..." oninput="app.search(this.value)">
            </div>
            
            <div class="chat-list" id="chatList">
                <div style="padding: 40px; text-align: center; color: #666;">
                    Carregando conversas...
                </div>
            </div>
        </aside>

        <!-- Chat Area -->
        <main class="chat-area">
            <div id="emptyState" class="empty-state">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                <h3>Selecione uma conversa</h3>
                <p>Escolha um cliente ao lado para começar o atendimento</p>
            </div>

            <div id="chatContainer" style="display: none; flex-direction: column; height: 100%;">
                <div class="chat-header">
                    <div class="chat-header-info">
                        <button class="back-btn" onclick="app.closeChat()">←</button>
                        <div class="chat-avatar" id="chatAvatar">👤</div>
                        <div class="chat-title">
                            <h3 id="chatName">-</h3>
                            <p id="chatStatus">-</p>
                        </div>
                    </div>
                    <div id="actionButtons"></div>
                </div>

                <div class="intervention-banner" id="interventionBanner">
                    🚨 VOCÊ ESTÁ NO CONTROLE - Robô pausado
                </div>

                <div class="messages-container" id="messagesContainer"></div>

                <div class="input-container">
                    <input type="text" id="messageInput" placeholder="Digite uma mensagem..." 
                           onkeypress="if(event.key==='Enter') app.sendMessage()" disabled>
                    <button onclick="app.sendMessage()" id="sendBtn" disabled>➤</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // CONFIGURAÇÃO - ALTERE AQUI SEU WEBHOOK
        const CONFIG = {
            WEBHOOK_URL: '/api/webhook', // Ou URL completa: 'https://seu-site.com/api/webhook'
            POLLING_INTERVAL: 2000, // 2 segundos
            STORAGE_KEY: 'whatsapp_panel_data'
        };

        class WhatsAppPanel {
            constructor() {
                this.chats = new Map();
                this.currentChat = null;
                this.pollingInterval = null;
                this.init();
            }

            async init() {
                // Carregar dados salvos localmente primeiro (instantâneo)
                this.loadFromStorage();
                this.renderChatList();
                
                // Esconder loading
                document.getElementById('loading').classList.add('hide');
                
                // Iniciar polling
                this.startPolling();
                
                // Carregar dados iniciais
                await this.fetchConversations();
            }

            // Carregar do localStorage
            loadFromStorage() {
                try {
                    const saved = localStorage.getItem(CONFIG.STORAGE_KEY);
                    if (saved) {
                        const data = JSON.parse(saved);
                        data.chats?.forEach(chat => this.chats.set(chat.phone, chat));
                    }
                } catch (e) {
                    console.log('Erro ao carregar storage:', e);
                }
            }

            // Salvar no localStorage
            saveToStorage() {
                try {
                    const data = {
                        chats: Array.from(this.chats.values()),
                        lastUpdate: new Date().toISOString()
                    };
                    localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(data));
                } catch (e) {
                    console.log('Erro ao salvar storage:', e);
                }
            }

            // Polling das conversas
            startPolling() {
                this.fetchConversations();
                this.pollingInterval = setInterval(() => this.fetchConversations(), CONFIG.POLLING_INTERVAL);
            }

            async fetchConversations() {
                try {
                    const response = await fetch(`${CONFIG.WEBHOOK_URL}?action=list`);
                    if (!response.ok) throw new Error('Erro na resposta');
                    
                    const conversations = await response.json();
                    
                    // Atualizar mapa sem perder dados existentes
                    let hasChanges = false;
                    conversations.forEach(conv => {
                        const existing = this.chats.get(conv.phone);
                        if (!existing || JSON.stringify(existing) !== JSON.stringify(conv)) {
                            this.chats.set(conv.phone, { ...existing, ...conv });
                            hasChanges = true;
                        }
                    });
                    
                    if (hasChanges) {
                        this.saveToStorage();
                        this.renderChatList();
                        
                        // Se tem chat aberto, atualizar mensagens
                        if (this.currentChat) {
                            this.fetchMessages(this.currentChat);
                        }
                    }
                    
                    this.updateConnectionStatus(true);
                } catch (error) {
                    console.error('Erro ao buscar conversas:', error);
                    this.updateConnectionStatus(false);
                }
            }

            async fetchMessages(phone) {
                if (!phone) return;
                
                try {
                    const response = await fetch(`${CONFIG.WEBHOOK_URL}?action=messages&phone=${encodeURIComponent(phone)}`);
                    if (!response.ok) throw new Error('Erro ao buscar mensagens');
                    
                    const messages = await response.json();
                    const chat = this.chats.get(phone);
                    if (chat) {
                        chat.messages = messages;
                        this.saveToStorage();
                        if (this.currentChat === phone) {
                            this.renderMessages(messages);
                        }
                    }
                } catch (error) {
                    console.error('Erro ao buscar mensagens:', error);
                }
            }

            renderChatList() {
                const container = document.getElementById('chatList');
                const searchTerm = document.getElementById('searchInput').value.toLowerCase();
                
                const chats = Array.from(this.chats.values())
                    .filter(c => !searchTerm || 
                        (c.name?.toLowerCase().includes(searchTerm)) || 
                        c.phone.includes(searchTerm))
                    .sort((a, b) => {
                        const dateA = a.lastMessageAt || a.updatedAt || 0;
                        const dateB = b.lastMessageAt || b.updatedAt || 0;
                        return new Date(dateB) - new Date(dateA);
                    });

                if (chats.length === 0) {
                    container.innerHTML = `
                        <div style="padding: 40px; text-align: center; color: #666;">
                            <p>Nenhuma conversa encontrada</p>
                            <p style="font-size: 13px; margin-top: 10px;">Aguardando mensagens...</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = chats.map(chat => {
                    const isActive = chat.phone === this.currentChat;
                    const isUnread = chat.unread && !isActive;
                    const lastMsg = chat.lastMessage || 'Nenhuma mensagem';
                    const time = this.formatTime(chat.lastMessageAt);
                    
                    return `
                        <div class="chat-item ${isActive ? 'active' : ''} ${isUnread ? 'unread' : ''}" 
                             onclick="app.openChat('${chat.phone}')">
                            <div class="chat-avatar">${this.getInitials(chat.name)}</div>
                            <div class="chat-info">
                                <div class="chat-header-row">
                                    <span class="chat-name">${chat.name || chat.phone}</span>
                                    <span class="chat-time">${time}</span>
                                </div>
                                <div class="chat-preview">
                                    <span style="flex: 1; overflow: hidden; text-overflow: ellipsis;">${lastMsg}</span>
                                    <span class="status-badge ${chat.intervention ? 'human' : 'bot'}">
                                        ${chat.intervention ? '🔴 VOCÊ' : '🤖 BOT'}
                                    </span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            openChat(phone) {
                this.currentChat = phone;
                const chat = this.chats.get(phone);
                if (!chat) return;

                // UI
                document.getElementById('emptyState').style.display = 'none';
                document.getElementById('chatContainer').style.display = 'flex';
                document.getElementById('app').classList.add('chat-open');
                
                // Dados
                document.getElementById('chatName').textContent = chat.name || phone;
                document.getElementById('chatAvatar').textContent = this.getInitials(chat.name);
                this.updateChatStatus(chat);
                
                // Renderizar mensagens existentes imediatamente
                if (chat.messages) {
                    this.renderMessages(chat.messages);
                }
                
                // Buscar mensagens atualizadas
                this.fetchMessages(phone);
                
                // Marcar como lida
                if (chat.unread) {
                    this.markAsRead(phone);
                }
                
                // Focar input se em intervenção
                if (chat.intervention) {
                    setTimeout(() => document.getElementById('messageInput').focus(), 100);
                }
            }

            closeChat() {
                this.currentChat = null;
                document.getElementById('app').classList.remove('chat-open');
                setTimeout(() => {
                    document.getElementById('emptyState').style.display = 'flex';
                    document.getElementById('chatContainer').style.display = 'none';
                }, 300);
            }

            updateChatStatus(chat) {
                const statusText = chat.intervention ? 'Você está respondendo' : 'Robô ativo';
                document.getElementById('chatStatus').textContent = statusText;
                
                const banner = document.getElementById('interventionBanner');
                const input = document.getElementById('messageInput');
                const sendBtn = document.getElementById('sendBtn');
                const actions = document.getElementById('actionButtons');
                
                if (chat.intervention) {
                    banner.classList.add('active');
                    input.disabled = false;
                    sendBtn.disabled = false;
                    input.placeholder = 'Digite uma mensagem...';
                    actions.innerHTML = `
                        <button class="intervention-btn release" onclick="app.toggleIntervention(false)">
                            🤖 Liberar Robô
                        </button>
                    `;
                } else {
                    banner.classList.remove('active');
                    input.disabled = true;
                    sendBtn.disabled = true;
                    input.placeholder = 'Assuma o controle para responder';
                    actions.innerHTML = `
                        <button class="intervention-btn take" onclick="app.toggleIntervention(true)">
                            🚨 Assumir Controle
                        </button>
                    `;
                }
            }

            renderMessages(messages) {
                const container = document.getElementById('messagesContainer');
                if (!messages || messages.length === 0) {
                    container.innerHTML = '<div style="text-align: center; color: #999; padding: 40px;">Nenhuma mensagem</div>';
                    return;
                }

                let lastDate = null;
                const html = messages.map(msg => {
                    const msgDate = new Date(msg.timestamp || msg.created_at).toDateString();
                    let dateSeparator = '';
                    
                    if (msgDate !== lastDate) {
                        dateSeparator = `<div class="date-separator">${this.formatDate(msg.timestamp || msg.created_at)}</div>`;
                        lastDate = msgDate;
                    }
                    
                    const isOutgoing = msg.from === 'human' || msg.from === 'me' || msg.sender === 'human';
                    const type = msg.type === 'system' ? 'system' : (isOutgoing ? 'outgoing' : 'incoming');
                    const time = this.formatTime(msg.timestamp || msg.created_at);
                    
                    return `${dateSeparator}
                        <div class="message ${type}">
                            ${this.escapeHtml(msg.content || msg.text || msg.message)}
                            <div class="message-meta">${time}</div>
                        </div>`;
                }).join('');
                
                // Só atualizar se mudou (evita flicker)
                if (container.innerHTML !== html) {
                    container.innerHTML = html;
                    this.scrollToBottom();
                }
            }

            async toggleIntervention(takeControl) {
                if (!this.currentChat) return;
                
                const btn = document.querySelector('.intervention-btn');
                const originalText = btn.textContent;
                btn.disabled = true;
                btn.textContent = '⏳...';
                
                try {
                    const action = takeControl ? 'intervene' : 'release';
                    const response = await fetch(`${CONFIG.WEBHOOK_URL}?action=${action}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone: this.currentChat })
                    });
                    
                    if (!response.ok) throw new Error('Falha na requisição');
                    
                    // Atualizar localmente otimisticamente
                    const chat = this.chats.get(this.currentChat);
                    chat.intervention = takeControl;
                    this.saveToStorage();
                    this.updateChatStatus(chat);
                    this.renderChatList();
                    
                } catch (error) {
                    console.error('Erro:', error);
                    alert('Erro ao alterar controle. Tente novamente.');
                    btn.disabled = false;
                    btn.textContent = originalText;
                }
            }

            async sendMessage() {
                if (!this.currentChat) return;
                
                const input = document.getElementById('messageInput');
                const text = input.value.trim();
                if (!text) return;
                
                const chat = this.chats.get(this.currentChat);
                if (!chat.intervention) {
                    alert('Assuma o controle primeiro!');
                    return;
                }
                
                input.value = '';
                
                // Adicionar mensagem localmente imediatamente
                const newMsg = {
                    content: text,
                    from: 'human',
                    timestamp: new Date().toISOString()
                };
                
                if (!chat.messages) chat.messages = [];
                chat.messages.push(newMsg);
                this.renderMessages(chat.messages);
                this.saveToStorage();
                
                // Enviar para servidor
                try {
                    const response = await fetch(`${CONFIG.WEBHOOK_URL}?action=send`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            phone: this.currentChat,
                            message: text
                        })
                    });
                    
                    if (!response.ok) throw new Error('Falha ao enviar');
                    
                    // Atualizar preview na lista
                    chat.lastMessage = text;
                    chat.lastMessageAt = new Date().toISOString();
                    this.renderChatList();
                    
                } catch (error) {
                    console.error('Erro ao enviar:', error);
                    alert('Erro ao enviar mensagem. Salva localmente.');
                    // Marcar como pendente
                    newMsg.pending = true;
                    this.saveToStorage();
                }
            }

            async markAsRead(phone) {
                const chat = this.chats.get(phone);
                if (chat) {
                    chat.unread = false;
                    this.saveToStorage();
                    this.renderChatList();
                    
                    // Notificar servidor
                    try {
                        await fetch(`${CONFIG.WEBHOOK_URL}?action=read`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ phone })
                        });
                    } catch (e) {
                        console.log('Erro ao marcar como lida:', e);
                    }
                }
            }

            search(term) {
                this.renderChatList();
            }

            scrollToBottom() {
                const container = document.getElementById('messagesContainer');
                container.scrollTop = container.scrollHeight;
            }

            updateConnectionStatus(online) {
                const status = document.getElementById('connectionStatus');
                status.textContent = online ? '🟢 Online' : '🔴 Offline';
                status.style.opacity = online ? '0.8' : '1';
            }

            getInitials(name) {
                if (!name) return '👤';
                return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
            }

            formatTime(date) {
                if (!date) return '';
                const d = new Date(date);
                return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            }

            formatDate(date) {
                if (!date) return '';
                const d = new Date(date);
                const today = new Date();
                const yesterday = new Date(today);
                yesterday.setDate(yesterday.getDate() - 1);
                
                if (d.toDateString() === today.toDateString()) return 'Hoje';
                if (d.toDateString() === yesterday.toDateString()) return 'Ontem';
                return d.toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' });
            }

            escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // Inicializar
        const app = new WhatsAppPanel();

        // Notificações quando minimizado
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && app.currentChat) {
                app.markAsRead(app.currentChat);
            }
        });
    </script>
</body>
</html>
