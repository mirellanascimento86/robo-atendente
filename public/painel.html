<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#075e54">
    <title>WhatsApp Pro - Painel de Intervenção</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --primary: #075e54;
            --primary-dark: #054d44;
            --secondary: #128c7e;
            --accent: #25d366;
            --bg: #0a1014;
            --sidebar-bg: #111b21;
            --chat-bg: #0a1014;
            --incoming: #202c33;
            --outgoing: #005c4b;
            --text: #e9edef;
            --text-secondary: #8696a0;
            --border: #2a3942;
            --danger: #f15c6d;
            --warning: #ffd700;
        }

        body {
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        #loading {
            position: fixed;
            inset: 0;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        #loading.fade-out { opacity: 0; pointer-events: none; }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading p { color: white; font-size: 16px; }

        #debugPanel {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #1a1a2e;
            color: #00ff88;
            padding: 10px;
            font-size: 11px;
            z-index: 10000;
            display: none;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            border-bottom: 2px solid #333;
        }
        #debugPanel.show { display: block; }

        #app {
            display: flex;
            height: 100%;
            width: 100%;
        }

        .sidebar {
            width: 100%;
            height: 100%;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .sidebar.hidden-mobile {
            transform: translateX(-100%);
            position: absolute;
        }

        @media (min-width: 900px) {
            .sidebar {
                width: 380px;
                border-right: 1px solid var(--border);
                position: relative;
                transform: none !important;
            }
            .sidebar.hidden-mobile {
                transform: none;
                position: relative;
            }
        }

        .header {
            background: var(--sidebar-bg);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }
        .header h1 { 
            font-size: 18px; 
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 18px;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }

        .connection-badge {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 10px;
            background: var(--accent);
            color: white;
            font-weight: 600;
        }
        .connection-badge.offline { background: var(--danger); }

        .search-container {
            padding: 8px 12px;
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--border);
        }
        .search-box {
            background: #202c33;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 8px 12px;
            gap: 10px;
        }
        .search-box input {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 15px;
            outline: none;
        }
        .search-box input::placeholder { color: var(--text-secondary); }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 8px 0;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .chat-item:hover { background: rgba(255,255,255,0.05); }
        .chat-item.active { background: #2a3942; }
        .chat-item.has-unread { border-left: 3px solid var(--accent); }

        .chat-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667781 0%, #8696a0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 600;
            color: white;
            margin-right: 14px;
            flex-shrink: 0;
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }
        .chat-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .chat-name {
            font-weight: 500;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
        }
        .chat-time {
            font-size: 11px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .chat-time.recent { color: var(--accent); font-weight: 600; }

        .chat-preview {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 8px;
            margin-left: 6px;
            font-weight: 600;
            flex-shrink: 0;
        }
        .status-indicator.bot { background: rgba(37, 211, 102, 0.15); color: var(--accent); }
        .status-indicator.human { background: rgba(241, 92, 109, 0.15); color: var(--danger); }

        .unread-badge {
            background: var(--accent);
            color: #111;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 6px;
            flex-shrink: 0;
        }

        .chat-area {
            flex: 1;
            display: none;
            flex-direction: column;
            background: var(--chat-bg);
            width: 100%;
            height: 100%;
        }
        .chat-area.active { display: flex; }

        @media (min-width: 900px) {
            .chat-area { display: flex; }
            .chat-area:not(.has-chat) .chat-placeholder { display: flex; }
        }

        .chat-header {
            background: var(--sidebar-bg);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            min-height: 60px;
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            min-width: 0;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: -8px;
        }
        @media (min-width: 900px) { .back-btn { display: none; } }

        .chat-title { flex: 1; min-width: 0; }
        .chat-title h3 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-title p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .chat-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .action-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .action-btn.intervene { background: var(--danger); color: white; }
        .action-btn.release { background: var(--accent); color: #111; }
        .action-btn.export { background: #2a3942; color: var(--text); border: 1px solid var(--border); }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .intervention-banner {
            background: linear-gradient(90deg, var(--danger), #ff6b6b);
            color: white;
            padding: 10px 16px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .intervention-banner.active { display: flex; }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .message {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14.5px;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
            animation: messageIn 0.3s ease;
        }
        @keyframes messageIn {
            from { opacity: 0; transform: translateY(20px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message.incoming {
            background: var(--incoming);
            align-self: flex-start;
            border-top-left-radius: 2px;
            color: var(--text);
        }
        .message.outgoing {
            background: var(--outgoing);
            align-self: flex-end;
            border-top-right-radius: 2px;
            color: white;
        }
        .message.system {
            background: rgba(255, 193, 7, 0.15);
            align-self: center;
            font-size: 12.5px;
            color: #ffd700;
            padding: 8px 16px;
            border-radius: 16px;
            max-width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 193, 7, 0.3);
        }

        .message-content { margin-bottom: 4px; white-space: pre-wrap; }

        .message-meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            font-size: 11px;
            opacity: 0.7;
            margin-top: 2px;
        }
        .message.outgoing .message-meta { color: #a5f3c5; }

        .date-separator {
            align-self: center;
            background: #1e2a30;
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
            margin: 16px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-container {
            background: var(--sidebar-bg);
            padding: 10px 16px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            border-top: 1px solid var(--border);
        }

        .input-wrapper {
            flex: 1;
            background: #2a3942;
            border-radius: 24px;
            padding: 12px 20px;
            max-height: 120px;
            overflow-y: auto;
        }

        .input-wrapper input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);
            font-size: 15.5px;
            line-height: 1.4;
        }
        .input-wrapper input::placeholder { color: var(--text-secondary); }
        .input-wrapper input:disabled { opacity: 0.5; }

        .send-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: var(--secondary);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .send-btn:hover:not(:disabled) { background: var(--accent); transform: scale(1.05); }
        .send-btn:active:not(:disabled) { transform: scale(0.95); }
        .send-btn:disabled { background: #374248; cursor: not-allowed; }
        .send-btn svg { width: 24px; height: 24px; margin-left: 2px; }

        .chat-placeholder {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            text-align: center;
            padding: 40px;
        }
        .chat-placeholder svg {
            width: 120px;
            height: 120px;
            margin-bottom: 24px;
            opacity: 0.2;
        }
        .chat-placeholder h3 {
            font-size: 32px;
            font-weight: 300;
            margin-bottom: 16px;
            color: var(--text-secondary);
        }
        .chat-placeholder p { font-size: 14px; max-width: 400px; line-height: 1.6; }

        .empty-list {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .backup-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 20000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .backup-modal.active { display: flex; }
        .backup-box {
            background: var(--sidebar-bg);
            border-radius: 16px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            border: 1px solid var(--border);
        }
        .backup-box h3 { margin-bottom: 16px; font-size: 18px; }
        .backup-box input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #202c33;
            color: var(--text);
            font-size: 15px;
            margin-bottom: 12px;
        }
        .backup-box button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: #111;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
        }
        .backup-box .close-btn {
            background: transparent;
            color: var(--text-secondary);
            margin-top: 8px;
            border: 1px solid var(--border);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374248; border-radius: 3px; }

        @media (max-width: 899px) {
            .message { max-width: 92%; font-size: 15.5px; }
            .chat-avatar { width: 48px; height: 48px; font-size: 20px; }
            .chat-name { font-size: 15px; }
            .action-btn { padding: 6px 12px; font-size: 12px; }
        }

        @supports (-webkit-touch-callout: none) {
            input, textarea { font-size: 16px; }
        }
    </style>
<base target="_blank">

<body>
    <div id="debugPanel"></div>

    <div id="loading">
        <div class="spinner"></div>
        <p>Conectando ao painel...</p>
    </div>

    <div id="app">
        <aside class="sidebar" id="sidebar">
            <div class="header">
                <h1>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20.52 3.45A11.83 11.83 0 0 0 12 0 12 12 0 0 0 0 12a12 12 0 0 0 1.74 6.15L0 24l6.33-1.5A12 12 0 0 0 12 24a12 12 0 0 0 12-12 12 12 0 0 0-3.48-8.55zM12 22a9.89 9.89 0 0 1-5-1.35l-.36-.22-3.76.89.89-3.66-.23-.37A10 10 0 0 1 12 2a10 10 0 0 1 10 10 10 10 0 0 1-10 10zm5.4-7.4c-.3-.15-1.77-.87-2.05-1-.27-.1-.47-.15-.67.15s-.77 1-.95 1.2-.35.23-.65.08a8.2 8.2 0 0 1-2.4-1.5 9 9 0 0 1-1.67-2.08c-.17-.3 0-.47.13-.62s.3-.35.45-.53a2 2 0 0 0 .3-.5.55.55 0 0 0 0-.52c-.08-.15-.67-1.6-.92-2.2s-.48-.5-.67-.51h-.57a1.1 1.1 0 0 0-.8.37c-.28.3-1 1-1 2.43s1.03 2.82 1.17 3s1.35 2.06 3.27 2.89 1.9.85 2.25.89a2 2 0 0 0 1.53-.71 1.6 1.6 0 0 0 .36-1.03c0-.15-.12-.27-.4-.42z"/>
                    </svg>
                    WhatsApp Pro
                </h1>
                <div class="header-actions">
                    <span class="connection-badge" id="connectionBadge">Iniciando...</span>
                    <button class="icon-btn" onclick="app.showBackupModal()" title="Backup">💾</button>
                    <button class="icon-btn" onclick="app.toggleDebug()" title="Debug">🐛</button>
                </div>
            </div>

            <div class="search-container">
                <div class="search-box">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#8696a0">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Pesquisar conversas..." oninput="app.search(this.value)">
                </div>
            </div>

            <div class="chat-list" id="chatList">
                <div class="empty-list">
                    <p>Carregando conversas...</p>
                </div>
            </div>
        </aside>

        <main class="chat-area" id="chatArea">
            <div class="chat-placeholder" id="chatPlaceholder">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                <h3>WhatsApp Pro</h3>
                <p>Selecione uma conversa para visualizar o historico completo</p>
            </div>

            <div id="activeChat" style="display: none; flex-direction: column; height: 100%;">
                <div class="chat-header">
                    <div class="chat-header-info">
                        <button class="back-btn" onclick="app.closeChat()">←</button>
                        <div class="chat-avatar" id="chatAvatar">👤</div>
                        <div class="chat-title">
                            <h3 id="chatName">-</h3>
                            <p id="chatStatus">-</p>
                        </div>
                    </div>
                    <div class="chat-actions" id="chatActions"></div>
                </div>

                <div class="intervention-banner" id="interventionBanner">
                    <span>⚡</span>
                    <span>Você assumiu o controle - Robô desativado</span>
                </div>

                <div class="messages-container" id="messagesContainer"></div>

                <div class="input-container">
                    <div class="input-wrapper">
                        <input type="text" id="messageInput" placeholder="Digite uma mensagem..." 
                               onkeypress="if(event.key==='Enter') app.sendMessage()" disabled>
                    </div>
                    <button class="send-btn" id="sendBtn" onclick="app.sendMessage()" disabled>
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Backup -->
    <div class="backup-modal" id="backupModal">
        <div class="backup-box">
            <h3>💾 Backup de Conversas</h3>
            <p style="color: var(--text-secondary); font-size: 13px; margin-bottom: 12px;">
                Exporte todas as conversas para CSV ou envie por email.
            </p>
            <input type="email" id="backupEmail" placeholder="Email para receber backup">
            <button onclick="app.fazerBackup()">📧 Enviar Backup por Email</button>
            <button class="close-btn" onclick="app.closeBackupModal()">Fechar</button>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURACAO
        // ==========================================
        const CONFIG = {
            WEBHOOK_URL: window.location.origin + '/api/webhook',
            POLL_INTERVAL: 4000,
            CHAT_POLL_INTERVAL: 2000,
            DEBUG: false
        };

        // ==========================================
        // CACHE LOCAL (IndexedDB)
        // ==========================================
        class LocalCache {
            constructor() {
                this.db = null;
                this.init();
            }

            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open('WhatsAppPro', 1);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => {
                        this.db = request.result;
                        resolve();
                    };
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains('conversas')) {
                            db.createObjectStore('conversas', { keyPath: 'telefone' });
                        }
                        if (!db.objectStoreNames.contains('config')) {
                            db.createObjectStore('config', { keyPath: 'chave' });
                        }
                    };
                });
            }

            async salvarConversa(telefone, dados) {
                if (!this.db) await this.init();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('conversas', 'readwrite');
                    const store = tx.objectStore('conversas');
                    const request = store.put({ telefone, ...dados, cacheEm: Date.now() });
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
            }

            async carregarConversas() {
                if (!this.db) await this.init();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('conversas', 'readonly');
                    const store = tx.objectStore('conversas');
                    const request = store.getAll();
                    request.onsuccess = () => resolve(request.result || []);
                    request.onerror = () => reject(request.error);
                });
            }

            async salvarConfig(chave, valor) {
                if (!this.db) await this.init();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('config', 'readwrite');
                    const store = tx.objectStore('config');
                    const request = store.put({ chave, valor });
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
            }

            async carregarConfig(chave) {
                if (!this.db) await this.init();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('config', 'readonly');
                    const store = tx.objectStore('config');
                    const request = store.get(chave);
                    request.onsuccess = () => resolve(request.result?.valor);
                    request.onerror = () => reject(request.error);
                });
            }
        }

        // ==========================================
        // APLICACAO
        // ==========================================
        class WhatsAppPanel {
            constructor() {
                this.chats = new Map();
                this.currentPhone = null;
                this.debugMode = false;
                this.cache = new LocalCache();
                this.lastMessageCount = new Map(); // Evita piscar
                this.init();
            }

            async init() {
                console.log('[Painel] Iniciando versao PRO...');

                // Carregar cache local primeiro
                await this.carregarCacheLocal();

                setTimeout(() => {
                    document.getElementById('loading').classList.add('fade-out');
                }, 500);

                // Buscar do servidor
                await this.fetchConversations();

                // Polling
                setInterval(() => this.fetchConversations(), CONFIG.POLL_INTERVAL);
                setInterval(() => {
                    if (this.currentPhone) {
                        this.fetchMessages(this.currentPhone);
                    }
                }, CONFIG.CHAT_POLL_INTERVAL);

                // Restaurar chat aberto
                const ultimoChat = await this.cache.carregarConfig('ultimoChat');
                if (ultimoChat && this.chats.has(ultimoChat)) {
                    this.selectChat(ultimoChat);
                }
            }

            log(msg, type = 'info') {
                const time = new Date().toLocaleTimeString();
                console.log(`[${time}] ${msg}`);
                if (this.debugMode) {
                    const panel = document.getElementById('debugPanel');
                    const color = type === 'error' ? '#ff6b6b' : (type === 'success' ? '#4caf50' : '#00ff88');
                    panel.innerHTML += `<div style="color: ${color};">[${time}] ${msg}</div>`;
                    panel.scrollTop = panel.scrollHeight;
                }
            }

            toggleDebug() {
                this.debugMode = !this.debugMode;
                document.getElementById('debugPanel').classList.toggle('show', this.debugMode);
                this.log('Debug: ' + (this.debugMode ? 'ON' : 'OFF'));
            }

            // ==========================================
            // CACHE LOCAL
            // ==========================================
            async carregarCacheLocal() {
                try {
                    const cached = await this.cache.carregarConversas();
                    cached.forEach(c => {
                        this.chats.set(c.telefone, {
                            telefone: c.telefone,
                            nome: c.nome,
                            emIntervencao: c.emIntervencao || false,
                            etapa: c.etapa,
                            ultimaAtividade: c.ultimaAtividade,
                            ultima: c.ultima,
                            messages: c.mensagens || c.messages || []
                        });
                    });
                    this.log(`Cache local: ${cached.length} conversas carregadas`);
                    this.renderList();
                } catch (e) {
                    this.log('Erro cache local: ' + e.message, 'error');
                }
            }

            async salvarNoCache() {
                try {
                    for (const [phone, chat] of this.chats) {
                        await this.cache.salvarConversa(phone, chat);
                    }
                } catch (e) {
                    this.log('Erro ao salvar cache: ' + e.message, 'error');
                }
            }

            // ==========================================
            // BUSCAR CONVERSAS DO SERVIDOR
            // ==========================================
            async fetchConversations() {
                try {
                    this.updateStatus('online');

                    const url = `${CONFIG.WEBHOOK_URL}?action=list&_t=${Date.now()}`;
                    const response = await fetch(url);

                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    const data = await response.json();
                    const conversas = data.conversas || [];

                    if (!Array.isArray(conversas)) return;

                    let houveMudanca = false;

                    conversas.forEach(conv => {
                        const phone = conv.telefone;
                        const existing = this.chats.get(phone);

                        if (!existing) {
                            // Nova conversa
                            this.chats.set(phone, {
                                ...conv,
                                messages: conv.mensagens || []
                            });
                            houveMudanca = true;
                            this.log('Nova conversa: ' + phone);
                        } else {
                            // Atualizar apenas se mudou algo relevante
                            const msgCountServer = conv.mensagens?.length || 0;
                            const msgCountLocal = existing.messages?.length || 0;
                            const intervencaoMudou = existing.emIntervencao !== conv.emIntervencao;
                            const temMensagensNovas = msgCountServer > msgCountLocal;

                            if (intervencaoMudou || temMensagensNovas || !existing.ultimaAtividade) {
                                existing.nome = conv.nome || existing.nome;
                                existing.emIntervencao = conv.emIntervencao;
                                existing.etapa = conv.etapa;
                                existing.ultimaAtividade = conv.ultimaAtividade;
                                existing.ultima = conv.ultima || existing.ultima;
                                houveMudanca = true;
                            }
                        }
                    });

                    if (houveMudanca) {
                        this.renderList();
                        this.salvarNoCache();

                        // Atualizar UI se estiver no chat
                        if (this.currentPhone) {
                            const chat = this.chats.get(this.currentPhone);
                            if (chat) this.updateUI(chat);
                        }
                    }

                } catch (error) {
                    this.log('Erro ao buscar: ' + error.message, 'error');
                    this.updateStatus('offline');
                }
            }

            // ==========================================
            // BUSCAR MENSAGENS (SEM PISCAR)
            // ==========================================
            async fetchMessages(phone) {
                try {
                    const url = `${CONFIG.WEBHOOK_URL}?action=messages&phone=${encodeURIComponent(phone)}&_t=${Date.now()}`;
                    const response = await fetch(url);

                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    const data = await response.json();
                    const mensagens = data.mensagens || [];

                    if (!Array.isArray(mensagens)) return;

                    const chat = this.chats.get(phone);
                    if (!chat) return;

                    // Atualizar estado de intervencao
                    if (data.emIntervencao !== undefined) {
                        chat.emIntervencao = data.emIntervencao;
                    }

                    // SO renderizar se houver MENSAGENS NOVAS
                    const lastCount = this.lastMessageCount.get(phone) || 0;
                    const newCount = mensagens.length;

                    if (newCount !== lastCount || !chat.messages || chat.messages.length !== newCount) {
                        chat.messages = mensagens;
                        this.lastMessageCount.set(phone, newCount);

                        if (this.currentPhone === phone) {
                            this.renderMessages(mensagens);
                            this.updateUI(chat);
                        }

                        // Atualizar preview
                        if (mensagens.length > 0) {
                            const last = mensagens[mensagens.length - 1];
                            chat.ultima = last.mensagem || last.texto || last.content || 'Nova mensagem';
                            chat.ultimaAtividade = last.data || new Date().toISOString();
                            this.renderList();
                        }

                        this.salvarNoCache();
                    }

                } catch (error) {
                    this.log('Erro mensagens: ' + error.message, 'error');
                }
            }

            // ==========================================
            // RENDERIZAR LISTA
            // ==========================================
            renderList() {
                const container = document.getElementById('chatList');
                const searchTerm = (document.getElementById('searchInput')?.value || '').toLowerCase();

                const chats = Array.from(this.chats.values())
                    .filter(c => !searchTerm || 
                        (c.nome?.toLowerCase().includes(searchTerm)) || 
                        c.telefone.includes(searchTerm))
                    .sort((a, b) => {
                        if (a.emIntervencao && !b.emIntervencao) return -1;
                        if (!a.emIntervencao && b.emIntervencao) return 1;
                        return new Date(b.ultimaAtividade || 0) - new Date(a.ultimaAtividade || 0);
                    });

                if (chats.length === 0) {
                    container.innerHTML = '<div class="empty-list"><p>Nenhuma conversa ainda. Aguarde mensagens...</p></div>';
                    return;
                }

                // Reutilizar DOM para evitar piscar
                const existingItems = new Map();
                container.querySelectorAll('.chat-item').forEach(el => {
                    existingItems.set(el.dataset.phone, el);
                });

                const fragment = document.createDocumentFragment();

                chats.forEach(c => {
                    const isActive = c.telefone === this.currentPhone;
                    const time = this.formatTime(c.ultimaAtividade);
                    const isRecent = c.ultimaAtividade && (Date.now() - new Date(c.ultimaAtividade).getTime()) < 300000;

                    let el = existingItems.get(c.telefone);

                    if (!el) {
                        el = document.createElement('div');
                        el.className = 'chat-item';
                        el.dataset.phone = c.telefone;
                        el.onclick = () => this.selectChat(c.telefone);
                    }

                    el.className = `chat-item ${isActive ? 'active' : ''}`;

                    el.innerHTML = `
                        <div class="chat-avatar">${this.getInitials(c.nome)}</div>
                        <div class="chat-info">
                            <div class="chat-header-row">
                                <span class="chat-name">${this.escapeHtml(c.nome || c.telefone)}</span>
                                <span class="chat-time ${isRecent ? 'recent' : ''}">${time}</span>
                            </div>
                            <div class="chat-preview">
                                <span style="flex:1;overflow:hidden;text-overflow:ellipsis;">
                                    ${this.escapeHtml(c.ultima || 'Sem mensagens')}
                                </span>
                                <span class="status-indicator ${c.emIntervencao ? 'human' : 'bot'}">
                                    ${c.emIntervencao ? '🔴 VOCÊ' : '🤖 BOT'}
                                </span>
                            </div>
                        </div>
                    `;

                    fragment.appendChild(el);
                });

                container.innerHTML = '';
                container.appendChild(fragment);
            }

            // ==========================================
            // SELECIONAR CHAT
            // ==========================================
            async selectChat(phone) {
                this.log('Selecionando: ' + phone);
                this.currentPhone = phone;

                const chat = this.chats.get(phone);
                if (!chat) {
                    this.log('Chat nao encontrado!', 'error');
                    return;
                }

                document.getElementById('sidebar').classList.add('hidden-mobile');
                document.getElementById('chatArea').classList.add('active', 'has-chat');
                document.getElementById('chatPlaceholder').style.display = 'none';
                document.getElementById('activeChat').style.display = 'flex';

                document.getElementById('chatName').textContent = chat.nome || phone;
                document.getElementById('chatAvatar').textContent = this.getInitials(chat.nome);

                this.updateUI(chat);

                if (chat.messages && chat.messages.length > 0) {
                    this.renderMessages(chat.messages);
                } else {
                    document.getElementById('messagesContainer').innerHTML = '';
                }

                await this.fetchMessages(phone);
                this.renderList();

                // Salvar no cache
                await this.cache.salvarConfig('ultimoChat', phone);
            }

            closeChat() {
                this.currentPhone = null;
                document.getElementById('sidebar').classList.remove('hidden-mobile');
                document.getElementById('chatArea').classList.remove('active', 'has-chat');
                document.getElementById('chatPlaceholder').style.display = 'flex';
                document.getElementById('activeChat').style.display = 'none';
                this.renderList();
                this.cache.salvarConfig('ultimoChat', null);
            }

            // ==========================================
            // ATUALIZAR UI
            // ==========================================
            updateUI(chat) {
                const banner = document.getElementById('interventionBanner');
                const input = document.getElementById('messageInput');
                const sendBtn = document.getElementById('sendBtn');
                const actions = document.getElementById('chatActions');
                const status = document.getElementById('chatStatus');

                this.log(`UI update: ${chat.telefone} intervencao=${chat.emIntervencao}`);

                if (chat.emIntervencao === true) {
                    banner.classList.add('active');
                    input.disabled = false;
                    sendBtn.disabled = false;
                    input.placeholder = 'Digite uma mensagem...';
                    actions.innerHTML = `
                        <button class="action-btn export" onclick="app.exportarConversa('${chat.telefone}')">📥 Exportar</button>
                        <button class="action-btn release" onclick="app.release('${chat.telefone}')">🤖 Liberar Robô</button>
                    `;
                    status.textContent = '✓ Você está no controle';
                    status.style.color = '#25d366';
                } else {
                    banner.classList.remove('active');
                    input.disabled = true;
                    sendBtn.disabled = true;
                    input.placeholder = 'Assuma o controle para responder';
                    actions.innerHTML = `
                        <button class="action-btn export" onclick="app.exportarConversa('${chat.telefone}')">📥 Exportar</button>
                        <button class="action-btn intervene" onclick="app.intervene('${chat.telefone}')">🚨 Assumir Controle</button>
                    `;
                    status.textContent = '🤖 Robô ativo';
                    status.style.color = '#8696a0';
                }
            }

            // ==========================================
            // RENDERIZAR MENSAGENS (SEM PISCAR)
            // ==========================================
            renderMessages(messages) {
                const container = document.getElementById('messagesContainer');

                if (!messages || messages.length === 0) {
                    container.innerHTML = '<div style="text-align:center;color:#8696a0;padding:40px;">Nenhuma mensagem</div>';
                    return;
                }

                // Verificar se ja tem as mesmas mensagens
                const currentMsgs = container.querySelectorAll('.message');
                if (currentMsgs.length === messages.length) {
                    // Mesma quantidade, verificar se precisa atualizar
                    let precisaAtualizar = false;
                    messages.forEach((msg, i) => {
                        const el = currentMsgs[i];
                        if (!el) { precisaAtualizar = true; return; }
                        const content = msg.mensagem || msg.texto || msg.content || msg.message || '';
                        if (el.querySelector('.message-content')?.textContent !== content) {
                            precisaAtualizar = true;
                        }
                    });
                    if (!precisaAtualizar) return; // Nada mudou, nao re-renderiza
                }

                let lastDate = null;
                let html = '';

                messages.forEach((msg) => {
                    const msgDate = new Date(msg.data || msg.timestamp || Date.now()).toDateString();

                    if (msgDate !== lastDate) {
                        html += `<div class="date-separator">${this.formatDate(msg.data || msg.timestamp)}</div>`;
                        lastDate = msgDate;
                    }

                    const tipo = msg.tipo || msg.from || 'cliente';
                    let type = 'incoming';

                    if (tipo === 'bot' || tipo === 'robo') type = 'outgoing';
                    else if (tipo === 'humano' || tipo === 'me' || tipo === 'atendente') type = 'outgoing';
                    else if (tipo === 'system' || tipo === 'sistema') type = 'system';

                    const content = this.escapeHtml(msg.mensagem || msg.texto || msg.content || msg.message || '');
                    const time = this.formatTime(msg.data || msg.timestamp);
                    const sender = msg.nome || (type === 'outgoing' ? 'Você' : 'Cliente');

                    html += `
                        <div class="message ${type}">
                            <div class="message-content">${content}</div>
                            <div class="message-meta">${sender} • ${time}</div>
                        </div>
                    `;
                });

                container.innerHTML = html;
                this.scrollToBottom();
            }

            // ==========================================
            // ASSUMIR CONTROLE
            // ==========================================
            async intervene(phone) {
                this.log('Intervencao: ' + phone);

                const btn = document.querySelector('.action-btn.intervene');
                if (btn) { btn.disabled = true; btn.textContent = '⏳...'; }

                try {
                    const response = await fetch(`${CONFIG.WEBHOOK_URL}?action=intervene`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone: phone })
                    });

                    const result = await response.json();
                    this.log('Intervencao OK: ' + JSON.stringify(result), 'success');

                    const chat = this.chats.get(phone);
                    if (chat) {
                        chat.emIntervencao = true;
                        chat.ultimaAtividade = new Date().toISOString();
                        this.updateUI(chat);
                        this.renderList();
                        await this.fetchMessages(phone);
                        await this.salvarNoCache();
                    }

                } catch (error) {
                    this.log('Erro intervene: ' + error.message, 'error');
                    alert('Erro ao assumir controle');
                    if (btn) { btn.disabled = false; btn.textContent = '🚨 Assumir Controle'; }
                }
            }

            // ==========================================
            // LIBERAR ROBO
            // ==========================================
            async release(phone) {
                this.log('Release: ' + phone);

                const btn = document.querySelector('.action-btn.release');
                if (btn) { btn.disabled = true; btn.textContent = '⏳...'; }

                try {
                    const response = await fetch(`${CONFIG.WEBHOOK_URL}?action=release`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone: phone })
                    });

                    const result = await response.json();
                    this.log('Release OK: ' + JSON.stringify(result), 'success');

                    const chat = this.chats.get(phone);
                    if (chat) {
                        chat.emIntervencao = false;
                        chat.ultimaAtividade = new Date().toISOString();
                        this.updateUI(chat);
                        this.renderList();
                        await this.fetchMessages(phone);
                        await this.salvarNoCache();
                    }

                } catch (error) {
                    this.log('Erro release: ' + error.message, 'error');
                    if (btn) { btn.disabled = false; btn.textContent = '🤖 Liberar Robô'; }
                }
            }

            // ==========================================
            // ENVIAR MENSAGEM
            // ==========================================
            async sendMessage() {
                if (!this.currentPhone) return;

                const input = document.getElementById('messageInput');
                const text = input.value.trim();
                if (!text) return;

                const chat = this.chats.get(this.currentPhone);
                if (!chat || chat.emIntervencao !== true) {
                    alert('Assuma o controle primeiro!');
                    return;
                }

                input.value = '';

                try {
                    const response = await fetch(`${CONFIG.WEBHOOK_URL}?action=send`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            phone: this.currentPhone,
                            message: text
                        })
                    });

                    const result = await response.json();

                    if (!result.ok) {
                        throw new Error(result.erro || 'Erro ao enviar');
                    }

                    this.log('Mensagem enviada', 'success');
                    setTimeout(() => this.fetchMessages(this.currentPhone), 300);

                } catch (error) {
                    this.log('Erro enviar: ' + error.message, 'error');
                    alert('Erro ao enviar: ' + error.message);
                    input.value = text;
                }
            }

            // ==========================================
            // EXPORTAR CONVERSA
            // ==========================================
            async exportarConversa(phone) {
                const chat = this.chats.get(phone);
                if (!chat || !chat.messages) return;

                let csv = 'Data,Tipo,Remetente,Mensagem\n';
                chat.messages.forEach(m => {
                    const data = new Date(m.data).toLocaleString('pt-BR');
                    const tipo = m.tipo || 'desconhecido';
                    const nome = m.nome || '';
                    const msg = (m.mensagem || '').replace(/"/g, '""');
                    csv += `"${data}","${tipo}","${nome}","${msg}"\n`;
                });

                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `conversa_${phone}_${new Date().toISOString().split('T')[0]}.csv`;
                link.click();

                this.log('Conversa exportada: ' + phone, 'success');
            }

            // ==========================================
            // BACKUP POR EMAIL
            // ==========================================
            showBackupModal() {
                document.getElementById('backupModal').classList.add('active');
            }

            closeBackupModal() {
                document.getElementById('backupModal').classList.remove('active');
            }

            async fazerBackup() {
                const email = document.getElementById('backupEmail').value.trim();
                if (!email) {
                    alert('Digite um email valido');
                    return;
                }

                try {
                    const response = await fetch(`${CONFIG.WEBHOOK_URL}?action=backup`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: email })
                    });

                    const result = await response.json();
                    if (result.ok) {
                        alert('Backup enviado para ' + email);
                        this.closeBackupModal();
                    } else {
                        alert('Erro no backup. Verifique as configuracoes do servidor.');
                    }
                } catch (e) {
                    alert('Erro: ' + e.message);
                }
            }

            search(term) {
                this.renderList();
            }

            scrollToBottom() {
                const container = document.getElementById('messagesContainer');
                container.scrollTop = container.scrollHeight;
            }

            updateStatus(status) {
                const badge = document.getElementById('connectionBadge');
                badge.className = 'connection-badge ' + (status === 'online' ? '' : 'offline');
                badge.textContent = status === 'online' ? '🟢 Online' : '🔴 Offline';
            }

            getInitials(name) {
                if (!name) return '👤';
                return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
            }

            formatTime(date) {
                if (!date) return '';
                const d = new Date(date);
                const hoje = new Date();
                const ontem = new Date(hoje);
                ontem.setDate(ontem.getDate() - 1);

                if (d.toDateString() === hoje.toDateString()) {
                    return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                }
                if (d.toDateString() === ontem.toDateString()) {
                    return 'Ontem';
                }
                return d.toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' });
            }

            formatDate(date) {
                if (!date) return '';
                const d = new Date(date);
                const hoje = new Date();
                const ontem = new Date(hoje);
                ontem.setDate(ontem.getDate() - 1);

                if (d.toDateString() === hoje.toDateString()) return 'Hoje';
                if (d.toDateString() === ontem.toDateString()) return 'Ontem';
                return d.toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' });
            }

            escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        const app = new WhatsAppPanel();
    </script>
