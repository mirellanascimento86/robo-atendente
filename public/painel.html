<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Intervenção - Histórico</title>
    <style>
        /* [Mesmo CSS anterior, já funciona] */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #f0f2f5;
            height: 100vh;
            overflow: hidden;
        }
        
        .header { 
            background: #075e54; 
            color: white; 
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .container { 
            display: grid; 
            grid-template-columns: 350px 1fr; 
            height: calc(100vh - 60px);
            overflow: hidden;
        }
        
        .lista { 
            background: white;
            border-right: 1px solid #ddd;
            overflow-y: auto;
            height: 100%;
        }
        
        .conversa { 
            padding: 15px; 
            border-bottom: 1px solid #eee; 
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .conversa:hover { background: #f5f5f5; }
        .conversa.ativa { background: #e3f2fd !important; border-left: 4px solid #2196f3; }
        .conversa.intervencao { border-left: 4px solid #f44336; background: #ffebee; }
        
        .tel { font-weight: bold; color: #075e54; font-size: 14px; }
        .nome { color: #666; font-size: 12px; }
        .prev { color: #999; font-size: 13px; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .data { color: #999; font-size: 11px; margin-top: 3px; }
        
        .tag { 
            display: inline-block;
            padding: 3px 10px; 
            border-radius: 12px; 
            font-size: 11px; 
            margin-top: 8px;
            font-weight: bold;
        }
        .tag.robo { background: #4caf50; color: white; }
        .tag.humano { background: #f44336; color: white; }
        
        .chat { 
            display: flex; 
            flex-direction: column;
            background: #e5ddd5;
            height: 100%;
            overflow: hidden;
        }
        
        .chat-header { 
            background: #f0f0f0; 
            padding: 15px 20px; 
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        
        .botoes button {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 10px;
            font-size: 13px;
        }
        
        .btn-intervir { background: #f44336; color: white; }
        .btn-liberar { background: #4caf50; color: white; }
        .btn-visita { background: #2196f3; color: white; }
        
        .mensagens { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px;
        }
        
        .msg { 
            max-width: 70%; 
            padding: 10px 14px; 
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        
        .msg.cliente { background: white; margin-right: auto; border-top-left-radius: 2px; }
        .msg.robo { background: #dcf8c6; margin-left: auto; border-top-right-radius: 2px; }
        .msg.humano { background: #ff6b6b; color: white; margin-left: auto; border-top-right-radius: 2px; }
        .msg.sistema { background: #fff3cd; margin: 10px auto; font-size: 12px; color: #856404; padding: 5px 10px; }
        
        .hora { font-size: 11px; color: #999; margin-top: 4px; text-align: right; }
        .msg.humano .hora { color: rgba(255,255,255,0.8); }
        
        .aviso {
            background: #ff6b6b;
            color: white;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 13px;
            flex-shrink: 0;
        }
        
        .input-area {
            background: #f0f0f0;
            padding: 15px;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            border-top: 1px solid #ddd;
        }
        
        .input-area input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 20px;
            outline: none;
            font-size: 15px;
        }
        
        .input-area button {
            padding: 12px 25px;
            background: #075e54;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .vazio {
            text-align: center;
            color: #999;
            padding: 50px;
        }
        
        .btn-marcar {
            background: #ff9800;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>🤖 Painel de Intervenção (IA + Histórico)</h2>
        <span>🟢 Online</span>
    </div>
    
    <div class="container">
        <div class="lista" id="lista">
            <div class="vazio">Carregando histórico...</div>
        </div>
        
        <div class="chat">
            <div class="chat-header" id="header" style="display: none;">
                <div>
                    <h3 id="titulo">-</h3>
                    <p id="subtitulo">-</p>
                </div>
                <div class="botoes" id="botoes"></div>
            </div>
            
            <div id="aviso" class="aviso" style="display: none;">
                🚨 VOCÊ ESTÁ NO CONTROLE - IA não responde
            </div>
            
            <div class="mensagens" id="mensagens">
                <div class="vazio">Selecione uma conversa para ver histórico</div>
            </div>
            
            <div class="input-area" id="input" style="display: none;">
                <input type="text" id="campo" placeholder="Digite..." onkeypress="if(event.key==='Enter') enviar()">
                <button onclick="enviar()" id="btn-enviar">Enviar</button>
                <button class="btn-marcar" onclick="marcarVisita()" id="btn-visita">📅 Marcar Visita</button>
            </div>
        </div>
    </div>

    <script>
        const API = window.location.origin + '/api/webhook';
        let atual = null;
        let intervencao = false;
        let nomeAtual = '';
        
        // Carregar a cada 3 segundos
        setInterval(carregarConversas, 3000);
        carregarConversas();
        
        setInterval(() => {
            if (atual) carregarMensagens(atual);
        }, 2000);
        
        async function carregarConversas() {
            try {
                const res = await fetch(API + '?acao=listar');
                const dados = await res.json();
                
                const lista = document.getElementById('lista');
                
                if (dados.length === 0) {
                    lista.innerHTML = '<div class="vazio" style="padding:40px">Nenhuma conversa no histórico.</div>';
                    return;
                }
                
                lista.innerHTML = dados.map(c => `
                    <div class="conversa ${c.telefone === atual ? 'ativa' : ''} ${c.intervencao ? 'intervencao' : ''}" 
                         onclick="selecionar('${c.telefone}', '${c.nome}', ${c.intervencao})">
                        <div class="tel">${c.telefone}</div>
                        <div class="nome">${c.nome}</div>
                        <div class="prev">${c.ultima}</div>
                        <div class="data">${c.data}</div>
                        <span class="tag ${c.intervencao ? 'humano' : 'robo'}">
                            ${c.intervencao ? '🔴 VOCÊ' : '🟢 IA'}
                        </span>
                    </div>
                `).join('');
                
            } catch (e) {
                console.log('Erro:', e);
            }
        }
        
        async function selecionar(telefone, nome, interv) {
            atual = telefone;
            nomeAtual = nome;
            intervencao = interv;
            
            document.getElementById('header').style.display = 'flex';
            document.getElementById('titulo').textContent = telefone;
            document.getElementById('subtitulo').textContent = nome || 'Cliente';
            document.getElementById('input').style.display = 'flex';
            
            atualizarBotoes();
            await carregarMensagens(telefone);
        }
        
        function atualizarBotoes() {
            const div = document.getElementById('botoes');
            const aviso = document.getElementById('aviso');
            const campo = document.getElementById('campo');
            const btn = document.getElementById('btn-enviar');
            const btnVisita = document.getElementById('btn-visita');
            
            if (intervencao) {
                div.innerHTML = '<button class="btn-liberar" onclick="liberar()">🤖 LIBERAR IA</button>';
                aviso.style.display = 'block';
                campo.placeholder = 'Você no controle...';
                campo.disabled = false;
                btn.disabled = false;
                btnVisita.style.display = 'inline-block';
            } else {
                div.innerHTML = '<button class="btn-intervir" onclick="intervir()">🚨 ASSUMIR CONTROLE</button>';
                aviso.style.display = 'none';
                campo.placeholder = 'Clique em ASSUMIR primeiro...';
                campo.disabled = true;
                btn.disabled = true;
                btnVisita.style.display = 'none';
            }
        }
        
        async function carregarMensagens(tel) {
            try {
                const res = await fetch(API + '?acao=mensagens&telefone=' + tel);
                const msgs = await res.json();
                
                const area = document.getElementById('mensagens');
                
                if (msgs.length === 0) {
                    area.innerHTML = '<div class="vazio">Sem mensagens no histórico</div>';
                    return;
                }
                
                area.innerHTML = msgs.map(m => `
                    <div class="msg ${m.tipo}">
                        ${m.texto.replace(/\n/g, '<br>')}
                        <div class="hora">${m.nome} • ${m.hora}${m.data ? ' • ' + m.data : ''}</div>
                    </div>
                `).join('');
                
                area.scrollTop = area.scrollHeight;
                
            } catch (e) {}
        }
        
        async function intervir() {
            if (!atual) return;
            
            try {
                await fetch(API + '?acao=intervir', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telefone: atual })
                });
                
                intervencao = true;
                atualizarBotoes();
                carregarMensagens(atual);
                
            } catch (e) {
                alert('Erro');
            }
        }
        
        async function liberar() {
            if (!atual) return;
            
            try {
                await fetch(API + '?acao=liberar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telefone: atual })
                });
                
                intervencao = false;
                atualizarBotoes();
                carregarMensagens(atual);
                
            } catch (e) {
                alert('Erro');
            }
        }
        
        async function enviar() {
            if (!atual || !intervencao) {
                alert('Assuma o controle primeiro!');
                return;
            }
            
            const campo = document.getElementById('campo');
            const texto = campo.value.trim();
            if (!texto) return;
            
            campo.value = '';
            
            try {
                await fetch(API + '?acao=enviar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telefone: atual, mensagem: texto })
                });
                
                setTimeout(() => carregarMensagens(atual), 500);
                
            } catch (e) {
                alert('Erro');
                campo.value = texto;
            }
        }
        
        async function marcarVisita() {
            if (!atual || !intervencao) {
                alert('Assuma o controle primeiro!');
                return;
            }
            
            const servico = prompt('Qual serviço? (Reforma/Marcenaria/Construção)');
            if (!servico) return;
            
            const endereco = prompt('Endereço completo:');
            if (!endereco) return;
            
            const data = prompt('Data da visita (DD/MM/AAAA):');
            if (!data) return;
            
            try {
                await fetch(API + '?acao=visita', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telefone: atual,
                        nome: nomeAtual,
                        servico: servico,
                        endereco: endereco,
                        data: data
                    })
                });
                
                alert('Visita marcada! Notificação enviada ao Telegram.');
                
            } catch (e) {
                alert('Erro ao marcar visita');
            }
        }
    </script>
</body>
</html>
