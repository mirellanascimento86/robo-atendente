<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#075e54">
    <title>Painel de Atendimento</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        :root {
            --primary: #075e54;
            --primary-dark: #054d44;
            --secondary: #128c7e;
            --accent: #25d366;
            --bg: #dadbd3;
            --chat-bg: #e5ddd5;
            --incoming: #ffffff;
            --outgoing: #dcf8c6;
            --text: #111b21;
            --text-secondary: #667781;
            --border: #d1d7db;
            --danger: #ea4335;
            --warning: #ffa500;
        }
        
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b141a;
                --chat-bg: #0b141a;
                --incoming: #202c33;
                --outgoing: #005c4b;
                --text: #e9edef;
                --text-secondary: #8696a0;
                --border: #2a3942;
            }
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            color: var(--text);
        }
        
        /* Loading Screen */
        #loading {
            position: fixed;
            inset: 0;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.3s;
        }
        #loading.hide { opacity: 0; pointer-events: none; }
        #loading img { width: 80px; margin-bottom: 20px; }
        #loading p { color: white; font-size: 14px; }
        
        /* App Container */
        #app {
            display: grid;
            grid-template-columns: 100% 100%;
            height: 100%;
            transition: transform 0.3s ease;
        }
        #app.chat-open { transform: translateX(-100%); }
        
        @media (min-width: 1024px) {
            #app {
                grid-template-columns: 380px 1fr;
                transform: none !important;
            }
        }
        
        /* Sidebar */
        .sidebar {
            background: var(--bg);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }
        
        .header {
            background: var(--bg);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }
        
        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
        }
        
        .header-actions {
            display: flex;
            gap: 12px;
        }
        
        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: background 0.2s;
        }
        .icon-btn:hover { background: rgba(0,0,0,0.05); }
        .icon-btn svg { width: 24px; height: 24px; }
        
        /* Search */
        .search-container {
            padding: 8px 12px;
            background: var(--bg);
        }
        
        .search-box {
            background: #f0f2f5;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 8px 12px;
            gap: 8px;
        }
        
        .search-box input {
            border: none;
            background: transparent;
            flex: 1;
            font-size: 15px;
            outline: none;
            color: var(--text);
        }
        
        /* Chat List */
        .chat-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
        }
        .chat-item:hover { background: rgba(0,0,0,0.03); }
        .chat-item.active { background: rgba(0,0,0,0.05); }
        .chat-item.unread::after {
            content: '';
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
        }
        
        .chat-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #dfe5e7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-right: 12px;
            flex-shrink: 0;
        }
        
        .chat-info {
            flex: 1;
            min-width: 0;
        }
        
        .chat-header-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 4px;
        }
        
        .chat-name {
            font-weight: 500;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .chat-time {
            font-size: 12px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        
        .chat-preview {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .chat-preview.typing { color: var(--secondary); font-style: italic; }
        
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
        }
        .status-badge.bot { background: rgba(37, 211, 102, 0.2); color: var(--accent); }
        .status-badge.human { background: rgba(234, 67, 53, 0.2); color: var(--danger); }
        
        /* Main Chat Area */
        .chat-area {
            display: flex;
            flex-direction: column;
            background: var(--chat-bg);
            position: relative;
        }
        
        .chat-bg {
            position: absolute;
            inset: 0;
            opacity: 0.06;
            background-image: url("data:image/svg+xml,%3Csvg width='400' height='400' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h400v400H0z' fill='%23000' fill-opacity='.05'/%3E%3C/svg%3E");
            pointer-events: none;
        }
        
        .chat-header {
            background: var(--bg);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }
        
        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }
        
        .back-btn {
            display: flex;
            padding: 8px;
            margin: -8px;
        }
        @media (min-width: 1024px) { .back-btn { display: none; } }
        
        .chat-title {
            flex: 1;
            min-width: 0;
        }
        
        .chat-title h3 {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .chat-title p {
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .chat-actions {
            display: flex;
            gap: 8px;
        }
        
        /* Intervention Banner */
        .intervention-banner {
            background: var(--danger);
            color: white;
            padding: 12px 16px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            z-index: 10;
        }
        .intervention-banner.active { display: flex; }
        
        /* Messages */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            position: relative;
            z-index: 1;
        }
        
        .message {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 8px;
            position: relative;
            word-wrap: break-word;
            font-size: 14.2px;
            line-height: 1.4;
            animation: messageIn 0.2s ease;
        }
        
        @keyframes messageIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.incoming {
            background: var(--incoming);
            align-self: flex-start;
            border-top-left-radius: 2px;
        }
        
        .message.outgoing {
            background: var(--outgoing);
            align-self: flex-end;
            border-top-right-radius: 2px;
        }
        
        .message.system {
            background: rgba(255, 193, 7, 0.2);
            align-self: center;
            font-size: 12px;
            color: #856404;
            max-width: 90%;
            text-align: center;
        }
        
        .message-meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            margin-top: 2px;
            font-size: 11px;
            color: var(--text-secondary);
        }
        
        .message.outgoing .message-meta { color: #53bdeb; }
        
        .message-status {
            display: flex;
            align-items: center;
        }
        
        /* Date separator */
        .date-separator {
            align-self: center;
            background: rgba(0,0,0,0.1);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            margin: 16px 0;
            font-weight: 500;
        }
        
        /* Input Area */
        .input-container {
            background: var(--bg);
            padding: 8px 16px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            border-top: 1px solid var(--border);
            z-index: 10;
        }
        
        .input-wrapper {
            flex: 1;
            background: white;
            border-radius: 20px;
            padding: 10px 16px;
            max-height: 120px;
            overflow-y: auto;
        }
        
        .input-wrapper input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 15px;
            background: transparent;
            color: var(--text);
        }
        
        .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--secondary);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
            flex-shrink: 0;
        }
        .send-btn:active { transform: scale(0.95); }
        .send-btn:disabled { background: #ccc; cursor: not-allowed; }
        
        /* Intervention Button */
        .intervention-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .intervention-btn.take {
            background: var(--danger);
            color: white;
        }
        .intervention-btn.take:hover { background: #d33b28; }
        
        .intervention-btn.release {
            background: var(--accent);
            color: white;
        }
        .intervention-btn.release:hover { background: #1da851; }
        
        /* Empty States */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            text-align: center;
            padding: 40px;
        }
        
        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 3px; }
        
        /* Typing indicator */
        .typing-indicator {
            display: none;
            padding: 12px 16px;
            background: var(--incoming);
            border-radius: 8px;
            border-top-left-radius: 2px;
            align-self: flex-start;
            margin-bottom: 8px;
        }
        .typing-indicator.active { display: flex; gap: 4px; }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
        
        /* Connection status */
        .connection-status {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--warning);
            color: white;
            text-align: center;
            padding: 4px;
            font-size: 12px;
            font-weight: 500;
            transform: translateY(-100%);
            transition: transform 0.3s;
            z-index: 10000;
        }
        .connection-status.show { transform: translateY(0); }
        .connection-status.online { background: var(--accent); }
        
        /* Mobile optimizations */
        @media (max-width: 1023px) {
            .message { max-width: 90%; font-size: 15px; }
            .chat-item { padding: 12px; }
            .chat-avatar { width: 48px; height: 48px; }
        }
        
        /* Prevent zoom on iOS */
        @supports (-webkit-touch-callout: none) {
            input, textarea { font-size: 16px; }
        }
    </style>
</head>
<body>
    <!-- Connection Status -->
    <div id="connectionStatus" class="connection-status">Conectando...</div>
    
    <!-- Loading Screen -->
    <div id="loading">
        <svg width="80" height="80" viewBox="0 0 24 24" fill="white">
            <path d="M12 2C6.48 2 2 6.48 2 12c0 5.52 4.48 10 10 10s10-4.48 10-10c0-5.52-4.48-10-10-10zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
        </svg>
        <p>Iniciando Painel...</p>
    </div>

    <div id="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="header">
                <h1>💬 Atendimentos</h1>
                <div class="header-actions">
                    <button class="icon-btn" onclick="app.refresh()" title="Atualizar">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                    </button>
                </div>
            </div>
            
            <div class="search-container">
                <div class="search-box">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#667781">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Pesquisar conversas..." oninput="app.search(this.value)">
                </div>
            </div>
            
            <div class="chat-list" id="chatList">
                <div class="empty-state">
                    <p>Carregando conversas...</p>
                </div>
            </div>
        </aside>

        <!-- Chat Area -->
        <main class="chat-area">
            <div class="chat-bg"></div>
            
            <div id="emptyChat" class="empty-state">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
                </svg>
                <h3>Selecione uma conversa</h3>
                <p>Clique em uma conversa ao lado para começar o atendimento</p>
            </div>

            <div id="activeChat" style="display: none; flex-direction: column; height: 100%;">
                <div class="chat-header">
                    <div class="chat-header-info">
                        <button class="icon-btn back-btn" onclick="app.closeChat()">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                        </button>
                        <div class="chat-avatar" id="chatAvatar">👤</div>
                        <div class="chat-title">
                            <h3 id="chatName">-</h3>
                            <p id="chatStatus">-</p>
                        </div>
                    </div>
                    <div class="chat-actions" id="chatActions">
                        <!-- Intervention buttons injected here -->
                    </div>
                </div>

                <div class="intervention-banner" id="interventionBanner">
                    <span>🚨</span>
                    <span>Você assumiu o controle - Robô pausado</span>
                </div>

                <div class="messages-container" id="messagesContainer">
                    <!-- Messages injected here -->
                </div>

                <div class="typing-indicator" id="typingIndicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>

                <div class="input-container" id="inputContainer">
                    <div class="input-wrapper">
                        <input type="text" id="messageInput" placeholder="Digite uma mensagem..." onkeypress="if(event.key==='Enter') app.sendMessage()">
                    </div>
                    <button class="send-btn" id="sendBtn" onclick="app.sendMessage()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
