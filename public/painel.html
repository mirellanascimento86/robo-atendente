<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#075e54">
    <title>WhatsApp Pro</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        :root {
            --primary: #075e54;
            --primary-dark: #054d44;
            --secondary: #128c7e;
            --accent: #25d366;
            --bg: #0a1014;
            --sidebar-bg: #111b21;
            --chat-bg: #0a1014;
            --incoming: #202c33;
            --outgoing: #005c4b;
            --text: #e9edef;
            --text-secondary: #8696a0;
            --border: #2a3942;
            --danger: #f15c6d;
            --warning: #ffd700;
        }
        
        body {
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        
        /* Loading */
        #loading {
            position: fixed;
            inset: 0;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        #loading.fade-out { opacity: 0; pointer-events: none; }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading p { color: white; font-size: 16px; }
        
        /* App Container - Mobile First */
        #app {
            display: flex;
            height: 100%;
            width: 100%;
        }
        
        /* Sidebar */
        .sidebar {
            width: 100%;
            height: 100%;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }
        
        .sidebar.hidden-mobile {
            transform: translateX(-100%);
            position: absolute;
        }
        
        @media (min-width: 900px) {
            .sidebar {
                width: 380px;
                border-right: 1px solid var(--border);
                position: relative;
                transform: none !important;
            }
            .sidebar.hidden-mobile {
                transform: none;
                position: relative;
            }
        }
        
        /* Header */
        .header {
            background: var(--sidebar-bg);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }
        .header h1 { 
            font-size: 20px; 
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }
        .icon-btn svg { width: 24px; height: 24px; }
        
        .connection-badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 12px;
            background: var(--accent);
            color: white;
            font-weight: 600;
        }
        .connection-badge.offline { background: var(--danger); }
        .connection-badge.connecting { background: var(--warning); color: #000; }
        
        /* Search */
        .search-container {
            padding: 8px 12px;
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--border);
        }
        .search-box {
            background: #202c33;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 8px 12px;
            gap: 10px;
        }
        .search-box input {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 15px;
            outline: none;
        }
        .search-box input::placeholder { color: var(--text-secondary); }
        
        /* Chat List */
        .chat-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 8px 0;
        }
        
        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .chat-item:hover { background: rgba(255,255,255,0.05); }
        .chat-item.active { background: #2a3942; }
        
        .chat-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667781 0%, #8696a0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 600;
            color: white;
            margin-right: 14px;
            flex-shrink: 0;
            position: relative;
        }
        
        .chat-info {
            flex: 1;
            min-width: 0;
        }
        .chat-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .chat-name {
            font-weight: 500;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
        }
        .chat-time {
            font-size: 12px;
            color: var(--accent);
            flex-shrink: 0;
        }
        
        .chat-preview {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 8px;
            font-weight: 600;
        }
        .status-indicator.bot { background: rgba(37, 211, 102, 0.15); color: var(--accent); }
        .status-indicator.human { background: rgba(241, 92, 109, 0.15); color: var(--danger); }
        
        /* Chat Area */
        .chat-area {
            flex: 1;
            display: none;
            flex-direction: column;
            background: var(--chat-bg);
            width: 100%;
            height: 100%;
        }
        .chat-area.active { display: flex; }
        
        @media (min-width: 900px) {
            .chat-area { display: flex; }
            .chat-area:not(.has-chat) .chat-placeholder { display: flex; }
        }
        
        .chat-header {
            background: var(--sidebar-bg);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            min-height: 60px;
        }
        
        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            min-width: 0;
        }
        
        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: -8px;
        }
        @media (min-width: 900px) { .back-btn { display: none; } }
        
        .chat-title { flex: 1; min-width: 0; }
        .chat-title h3 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-title p {
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .chat-actions {
            display: flex;
            gap: 8px;
        }
        
        .action-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .action-btn.intervene { background: var(--danger); color: white; }
        .action-btn.release { background: var(--accent); color: #111; }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Intervention Banner */
        .intervention-banner {
            background: linear-gradient(90deg, var(--danger), #ff6b6b);
            color: white;
            padding: 12px 16px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            animation: pulse 2s infinite;
        }
        .intervention-banner.active { display: flex; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        
        /* Messages */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            background-image: url("data:image/svg+xml,%3Csvg width='400' height='400' viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h400v400H0z' fill='%230a1014'/%3E%3Cpath d='M0 0h400v400H0z' fill='none' stroke='%23111b21' stroke-width='2'/%3E%3C/svg%3E");
        }
        
        .message {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14.5px;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
            animation: messageIn 0.3s ease;
        }
        @keyframes messageIn {
            from { opacity: 0; transform: translateY(20px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .message.incoming {
            background: var(--incoming);
            align-self: flex-start;
            border-top-left-radius: 2px;
            color: var(--text);
        }
        .message.outgoing {
            background: var(--outgoing);
            align-self: flex-end;
            border-top-right-radius: 2px;
            color: white;
        }
        .message.system {
            background: rgba(255, 193, 7, 0.15);
            align-self: center;
            font-size: 12.5px;
            color: #ffd700;
            padding: 8px 16px;
            border-radius: 16px;
            max-width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 193, 7, 0.3);
        }
        
        .message-content { margin-bottom: 4px; }
        
        .message-meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            font-size: 11px;
            opacity: 0.7;
            margin-top: 2px;
        }
        .message.outgoing .message-meta { color: #a5f3c5; }
        
        .date-separator {
            align-self: center;
            background: #1e2a30;
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
            margin: 16px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Input Area */
        .input-container {
            background: var(--sidebar-bg);
            padding: 10px 16px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            border-top: 1px solid var(--border);
        }
        
        .input-wrapper {
            flex: 1;
            background: #2a3942;
            border-radius: 24px;
            padding: 12px 20px;
            max-height: 120px;
            overflow-y: auto;
        }
        
        .input-wrapper input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);
            font-size: 15.5px;
            line-height: 1.4;
        }
        .input-wrapper input::placeholder { color: var(--text-secondary); }
        .input-wrapper input:disabled { opacity: 0.5; }
        
        .send-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: var(--secondary);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .send-btn:hover:not(:disabled) { background: var(--accent); transform: scale(1.05); }
        .send-btn:active:not(:disabled) { transform: scale(0.95); }
        .send-btn:disabled { background: #374248; cursor: not-allowed; }
        .send-btn svg { width: 24px; height: 24px; margin-left: 2px; }
        
        /* Placeholder */
        .chat-placeholder {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            text-align: center;
            padding: 40px;
        }
        .chat-placeholder svg {
            width: 120px;
            height: 120px;
            margin-bottom: 24px;
            opacity: 0.2;
        }
        .chat-placeholder h3 {
            font-size: 32px;
            font-weight: 300;
            margin-bottom: 16px;
            color: var(--text-secondary);
        }
        .chat-placeholder p { font-size: 14px; max-width: 400px; line-height: 1.6; }
        
        /* Empty State List */
        .empty-list {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .empty-list svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374248; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #4a5a63; }
        
        /* Mobile Optimizations */
        @media (max-width: 899px) {
            .message { max-width: 92%; font-size: 15.5px; }
            .chat-avatar { width: 48px; height: 48px; font-size: 20px; }
            .chat-name { font-size: 15px; }
            .action-btn { padding: 8px 16px; font-size: 13px; }
        }
        
        /* Prevent zoom on iOS */
        @supports (-webkit-touch-callout: none) {
            input, textarea { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p>Conectando ao painel...</p>
    </div>

    <div id="app">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="header">
                <h1>
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20.52 3.45A11.83 11.83 0 0 0 12 0 12 12 0 0 0 0 12a12 12 0 0 0 1.74 6.15L0 24l6.33-1.5A12 12 0 0 0 12 24a12 12 0 0 0 12-12 12 12 0 0 0-3.48-8.55zM12 22a9.89 9.89 0 0 1-5-1.35l-.36-.22-3.76.89.89-3.66-.23-.37A10 10 0 0 1 12 2a10 10 0 0 1 10 10 10 10 0 0 1-10 10zm5.4-7.4c-.3-.15-1.77-.87-2.05-1-.27-.1-.47-.15-.67.15s-.77 1-.95 1.2-.35.23-.65.08a8.2 8.2 0 0 1-2.4-1.5 9 9 0 0 1-1.67-2.08c-.17-.3 0-.47.13-.62s.3-.35.45-.53a2 2 0 0 0 .3-.5.55.55 0 0 0 0-.52c-.08-.15-.67-1.6-.92-2.2s-.48-.5-.67-.51h-.57a1.1 1.1 0 0 0-.8.37c-.28.3-1 1-1 2.43s1.03 2.82 1.17 3s1.35 2.06 3.27 2.89 1.9.85 2.25.89a2 2 0 0 0 1.53-.71 1.6 1.6 0 0 0 .36-1.03c0-.15-.12-.27-.4-.42z"/>
                    </svg>
                    WhatsApp Pro
                </h1>
                <div class="header-actions">
                    <span class="connection-badge" id="connectionBadge">Conectando...</span>
                </div>
            </div>
            
            <div class="search-container">
                <div class="search-box">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#8696a0">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Pesquisar ou começar nova conversa" oninput="app.search(this.value)">
                </div>
            </div>
            
            <div class="chat-list" id="chatList">
                <div class="empty-list">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
                    <p>Carregando conversas...</p>
                </div>
            </div>
        </aside>

        <!-- Chat Area -->
        <main class="chat-area" id="chatArea">
            <div class="chat-placeholder" id="chatPlaceholder">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                <h3>WhatsApp Web</h3>
                <p>Envie e receba mensagens sem precisar manter seu celular conectado.<br>Use em até 4 dispositivos e 1 celular simultaneamente.</p>
            </div>

            <div id="activeChat" style="display: none; flex-direction: column; height: 100%;">
                <div class="chat-header">
                    <div class="chat-header-info">
                        <button class="back-btn" onclick="app.closeChat()">←</button>
                        <div class="chat-avatar" id="chatAvatar">👤</div>
                        <div class="chat-title">
                            <h3 id="chatName">-</h3>
                            <p id="chatStatus">-</p>
                        </div>
                    </div>
                    <div class="chat-actions" id="chatActions"></div>
                </div>

                <div class="intervention-banner" id="interventionBanner">
                    <span>⚡</span>
                    <span>Você assumiu o controle - Robô desativado</span>
                </div>

                <div class="messages-container" id="messagesContainer"></div>

                <div class="input-container">
                    <div class="input-wrapper">
                        <input type="text" id="messageInput" placeholder="Digite uma mensagem" 
                               onkeypress="if(event.key==='Enter') app.sendMessage()" disabled>
                    </div>
                    <button class="send-btn" id="sendBtn" onclick="app.sendMessage()" disabled>
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ==========================================
        // CONFIGURAÇÃO
        // ==========================================
        const CONFIG = {
            WEBHOOK_URL: window.location.origin + '/api/webhook',
            POLL_INTERVAL: 3000,      // 3 segundos para lista (igual ao seu código funcional)
            CHAT_POLL_INTERVAL: 1500, // 1.5 segundos para mensagens (igual ao seu código funcional)
            STORAGE_KEY: 'whatsapp_panel_v3'
        };

        // ==========================================
        // APLICAÇÃO - LÓGICA CORRIGIDA (SEM BUG DE PISCAR)
        // ==========================================
        class WhatsAppPanel {
            constructor() {
                this.conversations = new Map(); // telefone -> dados
                this.currentPhone = null;
                this.intervention = false;
                this.lastActivity = 0;
                this.cacheConversations = []; // Cache para evitar re-render desnecessário
                
                this.init();
            }

            init() {
                console.log('[Painel] Iniciando...');
                
                // Esconder loading
                setTimeout(() => {
                    document.getElementById('loading').classList.add('fade-out');
                }, 500);
                
                // Iniciar polling (igual ao seu código funcional)
                this.loadConversations();
                setInterval(() => this.loadConversations(), CONFIG.POLL_INTERVAL);
                
                // Polling de mensagens do chat atual (igual ao seu código funcional)
                setInterval(() => {
                    if (this.currentPhone) {
                        this.loadMessages(this.currentPhone);
                    }
                }, CONFIG.CHAT_POLL_INTERVAL);
            }

            // ==========================================
            // CARREGAR CONVERSAS (LÓGICA DO SEU CÓDIGO FUNCIONAL)
            // ==========================================
            async loadConversations() {
                try {
                    this.updateConnection('connecting');
                    
                    const response = await fetch(`${CONFIG.WEBHOOK_URL}?acao=listar&_t=${Date.now()}`);
                    const data = await response.json();
                    
                    console.log('[Painel] Conversas recebidas:', data.length);
                    
                    // VERIFICAÇÃO CRÍTICA: Só re-renderiza se mudou algo (evita piscar)
                    const currentHash = JSON.stringify(this.cacheConversations.map(d => 
                        d.telefone + (d.intervencao ? '1' : '0') + d.ultima
                    ));
                    
                    const newHash = JSON.stringify(data.map(d => 
                        d.telefone + (d.intervencao ? '1' : '0') + d.ultima
                    ));
                    
                    // Se não mudou nada e já temos dados, não re-renderiza (SEM BUG DE PISCAR)
                    if (currentHash === newHash && this.cacheConversations.length > 0) {
                        return;
                    }
                    
                    // Atualizar cache
                    this.cacheConversations = data;
                    
                    // Atualizar mapa de conversas
                    data.forEach(c => {
                        if (!this.conversations.has(c.telefone)) {
                            this.conversations.set(c.telefone, {
                                ...c,
                                messages: []
                            });
                        } else {
                            // Atualizar apenas campos necessários
                            const existing = this.conversations.get(c.telefone);
                            existing.nome = c.nome;
                            existing.intervencao = c.intervencao;
                            existing.ultima = c.ultima;
                            existing.ultimaAtividade = c.ultimaAtividade;
                        }
                    });
                    
                    this.renderList();
                    this.updateConnection('online');
                    
                } catch (error) {
                    console.error('[Painel] Erro:', error);
                    this.updateConnection('offline');
                }
            }

            // ==========================================
            // CARREGAR MENSAGENS (LÓGICA DO SEU CÓDIGO FUNCIONAL)
            // ==========================================
            async loadMessages(phone) {
                try {
                    const response = await fetch(`${CONFIG.WEBHOOK_URL}?acao=mensagens&telefone=${encodeURIComponent(phone)}&_t=${Date.now()}`);
                    const messages = await response.json();
                    
                    const container = document.getElementById('messagesContainer');
                    
                    // VERIFICAÇÃO CRÍTICA: Comparar HTML atual com novo (evita piscar)
                    const currentHtml = container.innerHTML;
                    
                    const newHtml = messages.map(m => {
                        // Determinar tipo baseado no seu webhook
                        let type = 'incoming';
                        if (m.tipo === 'robo' || m.tipo === 'bot') type = 'outgoing';
                        else if (m.tipo === 'humano' || m.tipo === 'me') type = 'outgoing';
                        else if (m.tipo === 'sistema' || m.tipo === 'system') type = 'system';
                        else if (m.tipo === 'cliente') type = 'incoming';
                        
                        const content = this.escapeHtml(m.texto || m.mensagem || m.content || '');
                        const time = m.hora || this.formatTime(m.data);
                        const sender = m.nome || (type === 'outgoing' ? 'Você' : 'Cliente');
                        
                        return `
                            <div class="message ${type}">
                                <div class="message-content">${content}</div>
                                <div class="message-meta">${sender} • ${time}</div>
                            </div>
                        `;
                    }).join('');
                    
                    // SÓ ATUALIZAR SE MUDOU (SEM BUG DE PISCAR)
                    if (newHtml !== currentHtml) {
                        container.innerHTML = newHtml;
                        this.scrollToBottom();
                    }
                    
                    // Atualizar dados da conversa atual
                    const conv = this.conversations.get(phone);
                    if (conv) {
                        conv.messages = messages;
                        // Atualizar preview na lista se necessário
                        if (messages.length > 0) {
                            const last = messages[messages.length - 1];
                            conv.ultima = last.texto || last.mensagem || 'Nova mensagem';
                        }
                    }
                    
                } catch (error) {
                    console.error('[Painel] Erro mensagens:', error);
                }
            }

            // ==========================================
            // ABRIR CHAT (LÓGICA DO SEU CÓDIGO FUNCIONAL)
            // ==========================================
            openChat(phone, nome, interv, atividade) {
                // Se já está selecionado e atividade não mudou, não faz nada (SEM BUG)
                if (phone === this.currentPhone && atividade === this.lastActivity) {
                    return;
                }
                
                this.currentPhone = phone;
                this.intervention = interv;
                this.lastActivity = atividade;
                
                // Atualizar classes visuais na lista
                document.querySelectorAll('.chat-item').forEach(el => {
                    el.classList.remove('active');
                    if (el.dataset.phone === phone) {
                        el.classList.add('active');
                    }
                });
                
                // Mostrar chat
                document.getElementById('sidebar').classList.add('hidden-mobile');
                document.getElementById('chatArea').classList.add('active', 'has-chat');
                document.getElementById('chatPlaceholder').style.display = 'none';
                document.getElementById('activeChat').style.display = 'flex';
                
                // Header
                const conv = this.conversations.get(phone);
                document.getElementById('chatName').textContent = nome || phone;
                document.getElementById('chatAvatar').textContent = this.getInitials(nome);
                
                this.updateButtons();
                this.loadMessages(phone);
            }

            closeChat() {
                this.currentPhone = null;
                
                document.getElementById('sidebar').classList.remove('hidden-mobile');
                document.getElementById('chatArea').classList.remove('active', 'has-chat');
                document.getElementById('chatPlaceholder').style.display = 'flex';
                document.getElementById('activeChat').style.display = 'none';
            }

            updateButtons() {
                const actions = document.getElementById('chatActions');
                const banner = document.getElementById('interventionBanner');
                const input = document.getElementById('messageInput');
                const sendBtn = document.getElementById('sendBtn');
                const status = document.getElementById('chatStatus');
                
                if (this.intervention) {
                    actions.innerHTML = '<button class="action-btn release" onclick="app.release()">🤖 Liberar Robô</button>';
                    banner.classList.add('active');
                    input.disabled = false;
                    sendBtn.disabled = false;
                    input.placeholder = 'Digite uma mensagem...';
                    input.focus();
                    status.textContent = 'Você está no controle';
                } else {
                    actions.innerHTML = '<button class="action-btn intervene" onclick="app.intervene()">🚨 Assumir Controle</button>';
                    banner.classList.remove('active');
                    input.disabled = true;
                    sendBtn.disabled = true;
                    input.placeholder = 'Assuma o controle para responder';
                    status.textContent = 'Robô ativo';
                }
            }

            // ==========================================
            // AÇÕES (LÓGICA DO SEU CÓDIGO FUNCIONAL)
            // ==========================================
            async intervene() {
                if (!this.currentPhone) return;
                
                const btn = document.querySelector('.action-btn');
                btn.textContent = '⏳...';
                btn.disabled = true;
                
                try {
                    const response = await fetch(`${CONFIG.WEBHOOK_URL}?acao=intervir`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ telefone: this.currentPhone })
                    });
                    
                    const result = await response.json();
                    
                    if (result.ok) {
                        this.intervention = true;
                        this.updateButtons();
                        this.loadMessages(this.currentPhone);
                        // Recarregar lista após 500ms
                        setTimeout(() => this.loadConversations(), 500);
                    } else {
                        alert('Erro: ' + (result.erro || 'Desconhecido'));
                        btn.textContent = '🚨 Assumir Controle';
                        btn.disabled = false;
                    }
                    
                } catch (error) {
                    alert('Erro de conexão');
                    btn.textContent = '🚨 Assumir Controle';
                    btn.disabled = false;
                }
            }

            async release() {
                if (!this.currentPhone) return;
                
                const btn = document.querySelector('.action-btn');
                btn.textContent = '⏳...';
                btn.disabled = true;
                
                try {
                    const response = await fetch(`${CONFIG.WEBHOOK_URL}?acao=liberar`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ telefone: this.currentPhone })
                    });
                    
                    const result = await response.json();
                    
                    if (result.ok) {
                        this.intervention = false;
                        this.updateButtons();
                        this.loadMessages(this.currentPhone);
                        setTimeout(() => this.loadConversations(), 500);
                    }
                    
                } catch (error) {
                    alert('Erro de conexão');
                    btn.textContent = '🤖 Liberar Robô';
                    btn.disabled = false;
                }
            }

            async sendMessage() {
                if (!this.currentPhone || !this.intervention) {
                    alert('Assuma o controle primeiro!');
                    return;
                }
                
                const input = document.getElementById('messageInput');
                const text = input.value.trim();
                if (!text) return;
                
                input.value = '';
                
                try {
                    const response = await fetch(`${CONFIG.WEBHOOK_URL}?acao=enviar`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            telefone: this.currentPhone, 
                            mensagem: text 
                        })
                    });
                    
                    const result = await response.json();
                    
                    if (result.ok) {
                        // Aguardar e recarregar
                        setTimeout(() => this.loadMessages(this.currentPhone), 300);
                    } else {
                        alert('Erro: ' + (result.erro || 'Não foi possível enviar'));
                        input.value = text;
                    }
                    
                } catch (error) {
                    alert('Erro de conexão');
                    input.value = text;
                }
            }

            // ==========================================
            // RENDERIZAR LISTA (COM CACHE SEM PISCAR)
            // ==========================================
            renderList() {
                const container = document.getElementById('chatList');
                const searchTerm = (document.getElementById('searchInput')?.value || '').toLowerCase();
                
                const convs = Array.from(this.conversations.values())
                    .filter(c => !searchTerm || 
                        (c.nome?.toLowerCase().includes(searchTerm)) || 
                        c.telefone.includes(searchTerm))
                    .sort((a, b) => {
                        // Intervenções primeiro
                        if (a.intervencao && !b.intervencao) return -1;
                        if (!a.intervencao && b.intervencao) return 1;
                        return new Date(b.ultimaAtividade || 0) - new Date(a.ultimaAtividade || 0);
                    });

                if (convs.length === 0) {
                    container.innerHTML = `
                        <div class="empty-list">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
                            <p>Nenhuma conversa.<br>Envie mensagem de teste.</p>
                        </div>
                    `;
                    return;
                }

                const html = convs.map(c => {
                    const isActive = c.telefone === this.currentPhone;
                    const isIntervention = c.intervencao;
                    
                    return `
                        <div class="chat-item ${isActive ? 'active' : ''}" 
                             onclick="app.openChat('${c.telefone}', '${c.nome}', ${c.intervencao}, ${c.ultimaAtividade})"
                             data-phone="${c.telefone}">
                            <div class="chat-avatar">${this.getInitials(c.nome)}</div>
                            <div class="chat-info">
                                <div class="chat-header-row">
                                    <span class="chat-name">${c.nome || c.telefone}</span>
                                    <span class="chat-time">${this.formatTime(c.ultimaAtividade)}</span>
                                </div>
                                <div class="chat-preview">
                                    <span style="flex: 1; overflow: hidden; text-overflow: ellipsis;">
                                        ${this.escapeHtml(c.ultima || 'Sem mensagens')}
                                    </span>
                                    <span class="status-indicator ${isIntervention ? 'human' : 'bot'}">
                                        ${isIntervention ? '🔴 VOCÊ' : '🤖 BOT'}
                                    </span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
                
                // Só atualizar se mudou (evita flicker)
                if (container.innerHTML !== html) {
                    container.innerHTML = html;
                }
            }

            search(term) {
                this.renderList();
            }

            scrollToBottom() {
                const container = document.getElementById('messagesContainer');
                container.scrollTop = container.scrollHeight;
            }

            updateConnection(status) {
                const badge = document.getElementById('connectionBadge');
                badge.className = 'connection-badge ' + status;
                switch(status) {
                    case 'online': badge.textContent = '🟢 Online'; break;
                    case 'offline': badge.textContent = '🔴 Offline'; break;
                    case 'connecting': badge.textContent = '🟡 Atualizando...'; break;
                }
            }

            getInitials(name) {
                if (!name) return '👤';
                return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
            }

            formatTime(date) {
                if (!date) return '';
                const d = new Date(date);
                return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            }

            escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // Inicializar
        const app = new WhatsAppPanel();
    </script>
</body>
</html>
